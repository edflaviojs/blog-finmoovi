  O mesmo estilo do Short e do piloto "Economizar R$ 300": a cor do fundo muda por capítulo, uma manchete
  com a palavra de impacto a acender, o boneco sempre em cena, e UM cartão que nunca corta — ele muda de
  forma para cada tela (número, desenho, fotografia, app, extrato, lista, objeto, frase).
  17/10 (2.ª volta, pedidos do Ed): o boneco com EMOÇÕES (chora, ferve, pensa, cora, dorme, olhos de cifrão),
  o close no rosto, o balão de pensamento, o desenho solto sem fundo preto, a folha de caderno com o cursor
  a marcar, o aviso "daqui a pouco" como pensamento do boneco, e a tela final na medida dos quadros do YouTube.
  Cada quadro é função pura do tempo: seek(t). O render injeta o plano em window.__PLANO__.
  Prévia: abrir com ?plano=trabalho/<slug>/plano.json&t=<segundos> num servidor local.
-->

<script>
// ═══ MOLAS ═══
function S(t, f, z) {
  if (t <= 0) return 0
  const w = 2 * Math.PI * f
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t)
  const wd = w * Math.sqrt(1 - z * z)
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))
}
function pulse(t, f) { if (t <= 0) return 0; const x = 2 * Math.PI * f * t; return x * Math.exp(1 - x) }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, p) => a + (b - a) * p
const SPR = { shape: { f: 1.4, z: 0.85 }, enter: { f: 2.8, z: 1 }, exit: { f: 7, z: 1 }, press: { f: 9, z: 1 }, snap: { f: 2.6, z: 0.65 }, word: { f: 2.8, z: 0.75 }, pose: { f: 1.6, z: 0.75 }, cam: { f: 0.35, z: 1 }, calmo: { f: 0.8, z: 1 }, anda: { f: 0.6, z: 1 }, close: { f: 0.9, z: 1 } }
const INK = '#0d1117', CARD = '#161b22'
// O vídeo longo NÃO dá a volta (não é loop): um valor = o primeiro + uma mola por mudança.
// Uma mola que já assentou conta inteira sem se calcular (são centenas de chaves em 8 minutos).
function track(keys, def = SPR.shape) {
  const k = keys.map(([t, v, s]) => [t, v, s || def]).sort((a, b) => a[0] - b[0])
  return (t) => {
    let v = k[0][1]
    for (let i = 1; i < k.length; i++) {
      const dt = t - k[i][0]; if (dt <= 0) break
      const dv = k[i][1] - k[i - 1][1]; if (!dv) continue
      v += dt > 8 / k[i][2].f ? dv : dv * S(dt, k[i][2].f, k[i][2].z)
    }
    return v
  }
}
// o último da lista que já começou (as listas vêm por ordem de tempo)
function ultimo(list, t, chave = (x) => x.t) { let lo = 0, hi = list.length - 1, b = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (chave(list[m]) <= t) { b = m; lo = m + 1 } else hi = m - 1 } return b }
function mixHex(a, b, p) { const A = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), Bc = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16)); return `rgb(${A.map((x, i) => Math.round(lerp(x, Bc[i], clamp(p)))).join(',')})` }
function visStyle(el, vis, blurMax = 10) { el.style.opacity = clamp(vis).toFixed(4); const b = (1 - clamp(vis)) * blurMax; el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none'; el.style.visibility = vis < 0.002 ? 'hidden' : 'visible' }
const $ = (id) => document.getElementById(id)
const reais = (n) => 'R$ ' + Math.round(n).toLocaleString('pt-BR')
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const f1 = (x) => x.toFixed(1)

// ═══ TAMANHOS DAS TELAS ═══ [largura, altura, raio, fundo]
const TAM = { numero: [900, 460, 56, CARD], meta: [620, 600, 70, CARD], foto: [1040, 600, 40, CARD], app: [820, 640, 56, CARD], broll: [900, 600, 56, CARD], conta: [880, 700, 34, '#FFF8E7'], lista: [880, 660, 30, '#FFFDF5'], janela: [1000, 600, 48, CARD], frase: [1100, 420, 56, CARD], chamada: [960, 360, 56, CARD], nada: [620, 600, 70, CARD] }

let PL, D, ST, shapeW, shapeH, shapeR, cardOn, layerVis, cam, heads, poseTracks, bonecoX, closeK, curPress, telasDe, SOBRE, EMO
function montar(plano) {
  PL = plano; D = plano.duracao
  ST = plano.estados.map((e) => ({ ...e, w: TAM[e.id][0], h: TAM[e.id][1], r: TAM[e.id][2], bg: TAM[e.id][3] }))
  // o cartão: tamanho e cantos são molas; nas cenas "nada" ele encolhe e some (o palco é do boneco)
  const reais0 = ST.filter((s) => s.id !== 'nada')
  const tamDe = (s, k) => (s.id === 'nada' ? (reais0[0] ? TAM[reais0[0].id][k] : 600) : s[['w', 'h', 'r'][k]])
  shapeW = track(ST.map((s) => [s.t, tamDe(s, 0)])); shapeH = track(ST.map((s) => [s.t, tamDe(s, 1)])); shapeR = track(ST.map((s) => [s.t, tamDe(s, 2)]))
  cardOn = track([[-1, 0], ...ST.map((s) => [s.t + (s.id === 'nada' ? 0 : 0.05), s.id === 'nada' ? 0 : 1, s.id === 'nada' ? SPR.exit : SPR.snap])])
  layerVis = {}
  ST.forEach((s, i) => { if (s.id === 'nada') return; const nx = i + 1 < ST.length ? ST[i + 1].t : D + 1; (layerVis[s.id] ||= []).push(track([[-1, 0], [s.t + 0.12, 1, SPR.enter], [nx - 0.04, 0, SPR.exit]])) })
  document.querySelectorAll('.layer').forEach((el) => { if (!layerVis[el.id.slice(2)]) { el.style.visibility = 'hidden'; el.style.opacity = '0' } })
  telasDe = {}; ST.forEach((s) => (telasDe[s.id] ||= []).push(s))
  cam = track([[0, 1], ...PL.cenas.flatMap((c) => [[c.inicio, 1, { f: 2, z: 1 }], [c.inicio + 0.3, 1.04, SPR.cam]])], SPR.cam)
  heads = PL.manchetes.map((m) => {
    const el = document.createElement('div'); el.className = 'head'
    el.innerHTML = m.palavras.map((w) => `<span class="w">${esc(w)}</span>`).join('')
    $('heads').appendChild(el)
    let fs = 108; el.style.fontSize = fs + 'px'
    while ((el.scrollWidth > 1760 || el.scrollHeight > 150) && fs > 56) { fs -= 6; el.style.fontSize = fs + 'px' }
    return { el, m, words: [...el.children] }
  })
  // o boneco: a pose, o lugar (ao lado do cartão, no meio do palco, ou em close no rosto) e a emoção
  const P = PL.poses.length ? PL.poses : [[0, 'neutra', 'lado']]
  poseTracks = Object.fromEntries(Object.keys(POSES.neutra).map((k) => [k, track([[-1, POSES.neutra[k]], ...P.map(([t, n]) => [t, (POSES[n] || POSES.neutra)[k]])], SPR.pose)]))

  const v = PL.cursor.visitas
  const cl = v.filter((x) => x.clique)
  curPress = cl.length ? track([[-1, 0], ...cl.flatMap((x) => [[x.clique - 0.07, 1, SPR.press], [x.clique + 0.06, 0, SPR.enter]])]) : () => 0

  $('pautas').innerHTML = Array.from({ length: 7 }, (_, i) => `<div class="abs" style="left:0;right:0;top:${150 + i * 82 + 66}px;height:2px;background:#cfe0f5"></div>`).join('')

  const capa = SOBRE.find((o) => o.tipo === 'capa')
  if (capa) $('capaTxt').innerHTML = capa.texto.split(/\s+/).map((w) => `<span style="display:inline-block;margin:0 12px;padding:0 10px;border-radius:18px">${esc(w)}</span>`).join('')
  $('bordaoTxt').textContent = (SOBRE.find((o) => o.tipo === 'bordao') || {}).texto || ''
}

const seg = (o, a, l) => ({ x: o.x + l * Math.sin(a * Math.PI / 180), y: o.y + l * Math.cos(a * Math.PI / 180) })


// o boneco inteiro (corpo + rosto), em qualquer lugar e tamanho: o do palco e o pequeno do aviso
function bonecoSVG(p, x0, chao, emo, k, a, t, fala, andar = 0, olhaCima = 0) {
  const fase = x0 * 0.045
  const bob = Math.sin(t * 2.4) * 3 + Math.abs(Math.sin(fase)) * 10 * andar + (emo === 'feliz' ? -Math.abs(Math.sin(t * 7)) * 26 * k : 0) + (emo === 'nervoso' ? Math.sin(t * 40) * 2 * k : 0)
  const gesto = fala ? Math.sin(t * 3.1) * 6 : 0
  const hip = { x: x0, y: chao - UL - LL + bob + p.sit * (UL - 10) }
  const hL = p.hL + Math.sin(fase) * 28 * andar, hR = p.hR - Math.sin(fase) * 28 * andar
  const sL = p.sL - Math.sin(fase) * 20 * andar + gesto, sR = p.sR + Math.sin(fase) * 20 * andar - gesto
  const sh = seg(hip, 180 + p.lean, TORSO), nk = seg(sh, 180 + p.lean + p.head, NECK), hc = seg(nk, 180 + p.lean + p.head, HEAD_R)
  const eL = seg(sh, sL, UA), hdL = seg(eL, sL + p.eL, FA), eR = seg(sh, sR, UA), hdR = seg(eR, sR + p.eR, FA)
  const kL = seg(hip, hL, UL), fL = seg(kL, hL + p.kL, LL), kR = seg(hip, hR, UL), fR = seg(kR, hR + p.kR, LL)
  const L = (q, r) => `<line x1="${f1(q.x)}" y1="${f1(q.y)}" x2="${f1(r.x)}" y2="${f1(r.y)}"/>`
  const J = (q) => `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="${STK / 2 + 3}" fill="${INK}"/>`
  // sentado: um caixote por baixo
  const banco = p.sit > 0.3 ? `<rect x="${f1(x0 - 70)}" y="${f1(chao - 96)}" width="140" height="96" rx="12" fill="#8a5a2b" opacity="${f1(clamp((p.sit - 0.3) * 2))}"/><rect x="${f1(x0 - 70)}" y="${f1(chao - 96)}" width="140" height="18" rx="9" fill="#a8743f" opacity="${f1(clamp((p.sit - 0.3) * 2))}"/>` : ''
  return {
    svg: `${banco}<ellipse cx="${f1(x0)}" cy="${chao + 6}" rx="110" ry="15" fill="rgba(13,17,23,0.18)"/>
    <g stroke="${INK}" stroke-width="${STK}" stroke-linecap="round">${L(hip, kL)}${L(kL, fL)}${L(hip, kR)}${L(kR, fR)}${L(hip, sh)}${L(sh, eL)}${L(eL, hdL)}${L(sh, eR)}${L(eR, hdR)}</g>
    ${[hip, kL, kR, sh, eL, eR].map(J).join('')}${rosto(hc, p, emo, k, a, t, fala, olhaCima)}`,
    cabeca: hc,
  }
}

const falando = (t) => PL.cenas.some((c) => t >= c.inicio && t < c.fim - 0.25)
function emocaoEm(t) { const i = ultimo(EMO, t); if (i < 0) return { nome: 'neutra', k: 0, a: 0 }; const e = EMO[i]; return { nome: e.nome, k: clamp((t - e.t) / 0.35), a: t - e.t } }
function desenharBoneco(t) {
  const p = Object.fromEntries(Object.entries(poseTracks).map(([k, f]) => [k, f(t)]))
  const x0 = bonecoX(t)
  const andar = clamp(Math.abs(bonecoX(t + 0.02) - bonecoX(t - 0.02)) / 0.04 / 260)
  const em = emocaoEm(t)
  const b = bonecoSVG(p, x0, GROUND, em.nome, em.k, em.a, t, falando(t), andar)
  // CLOSE: a câmara vai ao rosto (2,6×), e a cabeça fica no meio do ecrã
  const ck = clamp(closeK(t)), Z = lerp(1, 2.6, ck)
  const hx = lerp(b.cabeca.x, 960, ck), hy = lerp(b.cabeca.y, 560, ck)
  $('boneco').innerHTML = `<g transform="translate(${f1(hx - b.cabeca.x * Z)} ${f1(hy - b.cabeca.y * Z)}) scale(${Z.toFixed(4)})">${b.svg}</g>`
  return { cabeca: { x: hx, y: hy }, Z }
}

// o balão de pensamento sai da cabeça; dentro, o símbolo do que ele sente
function simbolo(nome, cx, cy, a) {
  const b = 1 + 0.06 * Math.sin(a * 4)
  const T = (txt, cor = INK, tam = 150) => `<text x="${cx}" y="${cy + tam * 0.36}" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="${f1(tam * b)}" fill="${cor}">${txt}</text>`
  switch (nome) {
    case 'interrogacao': return T('?', '#5B8CFF')
    case 'exclamacao': return T('!', '#FF5A4E')
    case 'reticencias': return T('…', INK, 130)
    case 'zzz': return T('Zzz', '#A78BFA', 90)
    case 'coracao': return `<path transform="translate(${cx} ${cy}) scale(${f1(3.4 * b)})" d="M0 12 C -18 -2 -12 -18 0 -8 C 12 -18 18 -2 0 12 Z" fill="#FF4FA0"/>`
    case 'raio': return `<path transform="translate(${cx - 30} ${cy - 70}) scale(${f1(1.4 * b)})" d="M30 0 L0 55 L24 55 L12 100 L52 38 L28 38 L42 0 Z" fill="#FDE047" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`
    case 'nuvem': { let gotas = ''; for (let i = 0; i < 4; i++) { const f = (a * 1.2 + i / 4) % 1; gotas += `<line x1="${cx - 45 + i * 30}" y1="${f1(cy + 30 + f * 50)}" x2="${cx - 50 + i * 30}" y2="${f1(cy + 46 + f * 50)}" stroke="#5BC8FF" stroke-width="7" stroke-linecap="round" opacity="${f1(1 - f)}"/>` } return `<g fill="#8b949e"><circle cx="${cx - 40}" cy="${cy}" r="34"/><circle cx="${cx}" cy="${cy - 20}" r="42"/><circle cx="${cx + 42}" cy="${cy}" r="32"/><rect x="${cx - 70}" y="${cy}" width="140" height="32" rx="16"/></g>${gotas}` }
    case 'documento': return `<g transform="translate(${cx - 55} ${cy - 70})"><rect width="110" height="140" rx="12" fill="#fff" stroke="${INK}" stroke-width="6"/><line x1="20" y1="35" x2="90" y2="35" stroke="${INK}" stroke-width="6"/><line x1="20" y1="60" x2="90" y2="60" stroke="${INK}" stroke-width="6"/><line x1="20" y1="85" x2="70" y2="85" stroke="${INK}" stroke-width="6"/><text x="55" y="128" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="26" fill="#FF5A4E">R$</text></g>`
    case 'moeda': return `<g transform="translate(${cx} ${cy}) scale(${f1(b)})"><circle r="70" fill="#FDE047" stroke="#d4a800" stroke-width="8"/><text y="24" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="66" fill="#8a6a00">R$</text></g>`
    default: return T('?', '#5B8CFF')
  }
}
function balao(cabeca, cx, cy, w, h, a, conteudo, Z = 1) {
  // as três bolinhas que sobem da cabeça até ao balão, uma de cada vez; depois o balão abre
  let s = ''
  for (let i = 0; i < 3; i++) {
    const k = clamp(S(a - 0.12 * i, 3, 0.6), 0, 1.2), x = lerp(cabeca.x + 50 * Z, cx - w * 0.36, (i + 1) / 4), y = lerp(cabeca.y - 70 * Z, cy + h * 0.42, (i + 1) / 4)
    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1((10 + i * 7) * k)}" fill="#fff" stroke="${INK}" stroke-width="5"/>`
  }
  const k = clamp(S(a - 0.4, 2.4, 0.6), 0, 1.15)
  if (k > 0.01) {
    const rx = w / 2 * k, ry = h / 2 * k
    // uma nuvem: elipse grande e bolhas à volta
    let bolhas = ''
    for (let i = 0; i < 10; i++) { const ang = (i / 10) * Math.PI * 2; bolhas += `<circle cx="${f1(cx + Math.cos(ang) * rx * 0.86)}" cy="${f1(cy + Math.sin(ang) * ry * 0.82)}" r="${f1(Math.min(rx, ry) * 0.36)}"/>` }
    s += `<g fill="#fff" stroke="${INK}" stroke-width="6">${bolhas}</g><g fill="#fff">${bolhas}<ellipse cx="${cx}" cy="${cy}" rx="${f1(rx * 0.95)}" ry="${f1(ry * 0.9)}"/></g>`
    if (conteudo) s += `<g opacity="${f1(clamp((k - 0.6) * 3))}">${conteudo}</g>`
  }
  return s
}
function momentoDoPalco(t, cab) {
  let solto = '', bal = ''
  const nadas = telasDe.nada || []
  const i = ultimo(nadas, t), e = i >= 0 ? nadas[i] : null
  const cur = ST[Math.max(0, ultimo(ST, t))]
  if (e && cur === e && t >= e.depois) {
    const a = t - e.depois
    if (e.momento === 'pensamento') bal = balao(cab.cabeca, 1320, 600, 500, 300, a, simbolo(e.pensa, 1320, 600, a), cab.Z)

      solto = `<ellipse cx="1260" cy="920" rx="${f1(280 * k)}" ry="24" fill="rgba(13,17,23,0.16)"/><g transform="translate(${f1(1260 - 450 * 1.15 * k)} ${f1(610 - 280 * 1.15 * k + bob)}) scale(${(1.15 * k).toFixed(4)})">${OBJ[e.solto.nome](a + 0.8, {})}</g>`
    }
  }
  $('soltoSvg').innerHTML = solto
  $('balaoSvg').innerHTML = bal
}

// ═══ O CONTEÚDO DE CADA TELA ═══
const TOM = { sai: ['#ff7a6e', 'saiu da conta'], entra: ['#3fdc8f', 'entrou na conta'], saldo: ['#f0f6fc', 'no fim das contas'] }
function telaNumero(e, t) {

const maiuscula = (x) => x.charAt(0).toUpperCase() + x.slice(1)
const listaDoMapa = () => (PL.valoresDoMapa || []).filter((v) => v.tipo === 'sai').map((v) => ({ ...v, nome: maiuscula(v.nome.replace(/^(o|a|os|as) /i, '')) }))
function telaApp(e, t) {

    corpo = `<div class="abs" style="left:40px;top:10px;font-size:28px;font-weight:700;color:#8b949e">${esc(e.rotulo)}</div><div class="abs disp" style="left:36px;top:60px;font-size:110px;font-weight:900;letter-spacing:-4px;color:#ff7a6e;white-space:nowrap">− ${reais(e.valor * (1 - Math.pow(1 - u, 3)))}</div>
      <div class="abs" style="left:40px;right:40px;top:250px;height:84px;border-radius:42px;background:#22d3ee;color:#0d1117;text-align:center;font-family:Unbounded;font-weight:900;font-size:30px;line-height:84px;transform:scale(${(1 - 0.05 * clamp(curPress(t))).toFixed(3)})">Registrar</div>`

}
function telaBroll(e, t) {
  const a = t - e.t, v = e.valores || {}
  const u = clamp((a - 0.3) / 1.6), ease = 1 - Math.pow(1 - u, 3)

  if (v.fluxo) {

// ═══ O CURSOR COMO QUEM EXPLICA ═══ chega em CURVA (nunca a direito), faz o gesto à volta do que importa
// — dá a volta (circula), passa por baixo (sublinha), bate duas vezes (aponta), ou vai à caixinha (marca) —,
// clica quando é para clicar, e sai em curva. Coordenadas a partir do meio do cartão.
const suave = (u) => u * u * (3 - 2 * u)
function curva(a, b, u, lado) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1

}
function cursorEm(t) {
  const V = PL.cursor.visitas
  const i = ultimo(V, t, (v) => v.entra - 0.15)
  if (i < 0) return null
  const v = V[i]
  if (t > v.sai + 0.7) return null
  const lado = i % 2 ? 1 : -1
  const de = v.seguido && i > 0 ? [V[i - 1].x, V[i - 1].y] : [v.x + 420, v.y + 330]
  const chega = v.entra + (v.gesto === 'marca' ? 0.28 : 0.75)
  const alvo = [v.x, v.y]
  let pos
  if (t < chega) pos = curva(de, alvo, suave(clamp((t - v.entra) / (chega - v.entra))), lado)
  else {
    const g = t - chega, ate = v.clique || v.sai
    // o gesto vai desvanecendo até ao clique, para o clique cair EXATAMENTE no alvo
    const k = v.clique ? clamp((v.clique - t) / 0.3) : 1
    let dx = 0, dy = 0
    if (v.gesto === 'circula') { const rx = Math.min(150, (v.larg || 240) / 3.2), ry = 34, w = Math.PI * 2 / 1.1; dx = rx * Math.sin(w * g); dy = -ry * (1 - Math.cos(w * g)) * 0.9 }
    else if (v.gesto === 'sublinha') { const L = (v.larg || 400) / 2, u = (g % 2.2) / 2.2; dx = -L + 2 * L * suave(u < 0.5 ? u * 2 : 2 - u * 2); dy = 40 + Math.sin(u * Math.PI * 4) * 4 }
    else if (v.gesto === 'aponta') { dx = Math.sin(g * 9) * 14 * Math.exp(-g * 0.8); dy = Math.abs(Math.sin(g * 9)) * -10 * Math.exp(-g * 0.8) }
    pos = [alvo[0] + dx * (t < ate ? k : 0), alvo[1] + dy * (t < ate ? k : 0)]
    // depois do clique: um toque de "aí está", e no fim sai em curva
    if (v.clique && t >= v.clique && t < v.sai) { const a2 = t - v.clique; pos = [alvo[0] + 6 * Math.sin(a2 * 6) * Math.exp(-a2 * 2), alvo[1]] }
    if (t >= v.sai) { const prox = V[i + 1]; if (!(prox && prox.seguido)) pos = curva(alvo, [v.x + 380, v.y + 300], suave(clamp((t - v.sai) / 0.7)), -lado) }
  }
  const vis = clamp((t - v.entra + 0.15) / 0.2) * (t > v.sai && !(V[i + 1]?.seguido) ? clamp(1 - (t - v.sai) / 0.5) : 1)
  return { x: pos[0], y: pos[1], vis }
}

function seek(tIn) {
  const t = clamp(tIn, 0, D - 0.001)
  const IN = PL.inundacoes, wi = Math.max(0, ultimo(IN, t))

  const rad = 2400 * S(t - IN[wi].t, 1.1, 1)
  Object.assign($('wipe').style, { left: 1220 - rad + 'px', top: 590 - rad + 'px', width: 2 * rad + 'px', height: 2 * rad + 'px', background: IN[wi].cor })
  const ph = t * 0.21
  $('decoRing').style.transform = `translate(${-300 + 60 * Math.sin(ph)}px, ${520 + 40 * Math.cos(ph)}px)`
  $('decoSquare').style.transform = `translate(${1500 + 40 * Math.cos(ph)}px, ${-160 + 50 * Math.sin(ph)}px) rotate(${(t * 3) % 360 + 14}deg)`

  // o cartão
  const c = cam(t), on = clamp(cardOn(t), 0, 1.1)
  $('world').style.transform = `scale(${(c * lerp(0.6, 1, Math.min(1, on))).toFixed(5)})`
  $('world').style.opacity = clamp(on * 1.6).toFixed(3)
  $('world').style.visibility = on < 0.01 ? 'hidden' : 'visible'
  const w = shapeW(t), h = shapeH(t), r = Math.min(shapeR(t), w / 2, h / 2)
  const si = Math.max(0, ultimo(ST, t)), cur = ST[si]
  const sp = 1 - 0.03 * clamp(curPress(t))
  Object.assign($('shape').style, { width: w + 'px', height: h + 'px', left: -w / 2 + 'px', top: -h / 2 + 'px', borderRadius: r + 'px', transform: `scale(${sp.toFixed(4)})`, boxShadow: '0 2px 4px rgba(13,17,23,0.18), 0 40px 80px -24px rgba(13,17,23,0.55)' })
  const prevBg = ST[Math.max(0, si - 1)].bg, sRad = Math.hypot(w, h) * S(t - cur.t, 1.7, 1)
  $('shape').style.background = prevBg
  Object.assign($('shapeWipe').style, { left: w / 2 - sRad + 'px', top: h / 2 - sRad + 'px', width: 2 * sRad + 'px', height: 2 * sRad + 'px', background: cur.bg })
  for (const id of Object.keys(layerVis)) {
    const el = $('L-' + id), vis = Math.max(...layerVis[id].map((f) => f(t)))
    visStyle(el, vis)
    if (vis < 0.002) continue
    const [lw, lh] = TAM[id]
    Object.assign(el.style, { width: lw + 'px', height: lh + 'px', left: (w - lw) / 2 + 'px', top: (h - lh) / 2 + 'px', transform: `scale(${lerp(0.96, 1, clamp(vis))})` })
    const lista = telasDe[id], e = lista[Math.max(0, ultimo(lista, t))]

    else if (id === 'meta') { const modo = e.acao || t >= e.viraAcao ? 'acao' : 'apresenta'; const a = modo === 'acao' && !e.acao ? t - e.viraAcao : t - e.t; $('metaSvg').innerHTML = (METAFORAS[e.figura] || ((x, m) => metaforaPadrao(x, m, e.figura)))(Math.max(0, a), modo) }
    else if (id === 'foto') { const img = $('fotoImg'), src = FOTOS[e.ficheiro]; if (src && img.dataset.src !== e.ficheiro) { img.src = src; img.dataset.src = e.ficheiro } const dur = Math.max(1, (PL.cenas[e.cena]?.fim || e.t + 6) - e.t); const k = clamp((t - e.t) / dur); img.style.transform = `scale(${(e.movimento === 'afasta' ? lerp(1.12, 1, k) : lerp(1, e.movimento === 'aproxima-lento' ? 1.06 : 1.12, k)).toFixed(4)})` }

    else if (id === 'chamada') { const a = t - e.t, ws = String(e.texto || 'Comenta FINMOOVI').split(''); $('chamTxt').textContent = ws.slice(0, Math.floor(clamp((a - 0.4) / 1.2) * ws.length)).join(''); $('chamEtq').textContent = e.etiqueta || ''; $('chamBotao').style.transform = `scale(${(1 - 0.08 * clamp(curPress(t))).toFixed(3)})` }
  }

  let fxs = ''

      wEl.style.transform = `translateY(${((1 - p) * 60).toFixed(2)}px) scale(${(lerp(0.85, 1, clamp(p)) + 0.1 * kick * hl).toFixed(4)})`
      wEl.style.filter = p < 0.98 ? `blur(${((1 - clamp(p)) * 12).toFixed(2)}px)` : 'none'
      wEl.style.background = `rgba(13,17,23,${(0.92 * hl).toFixed(3)})`

  }

}

function cues() {
  const L = []
  ST.forEach((s, i) => { if (i > 0 && s.id !== 'nada') L.push({ t: s.t, kind: 'swish' }) })
  ST.filter((s) => s.id === 'numero').forEach((s) => L.push({ t: s.aterra, kind: 'thud' }))
  ST.filter((s) => s.id === 'nada' && s.depois).forEach((s) => L.push({ t: s.depois, kind: s.momento === 'pensamento' ? 'rise' : s.momento === 'close' ? 'whoosh' : 'swish' }))
  ;(PL.fx || []).forEach((f) => { if (f.tipo === 'moedas') [0, 0.08, 0.16, 0.24].forEach((d) => L.push({ t: f.t + d, kind: 'coin' })); if (f.tipo === 'confete' || f.tipo === 'brilho') L.push({ t: f.t, kind: 'ding' }); if (f.tipo === 'raios') L.push({ t: f.t, kind: 'boom' }); if (f.tipo === 'papeis') L.push({ t: f.t, kind: 'swish' }) })
  PL.cursor.visitas.filter((v) => v.clique).forEach((v) => L.push({ t: v.clique, kind: 'click' }))
  PL.cursor.visitas.filter((v) => v.gesto === 'marca').forEach((v) => L.push({ t: v.clique + 0.08, kind: 'tick' }))
  ST.filter((s) => s.id === 'lista').forEach((s) => L.push({ t: s.botao + 0.05, kind: 'ding' }))
  ST.filter((s) => s.id === 'janela').forEach((j) => j.objetos.forEach((o) => L.push({ t: o.t + 0.05, kind: o.nome === 'carro' ? 'rise' : 'tick' })))
  SOBRE.forEach((o) => { if (o.tipo === 'capitulo') L.push({ t: o.t, kind: 'whoosh' }, { t: o.t + 0.4, kind: 'ding' }); if (o.tipo === 'pausa') L.push({ t: o.t, kind: 'whoosh' }, { t: o.t + 0.6, kind: 'rise' }); if (o.tipo === 'bordao' || o.tipo === 'assinatura') L.push({ t: o.t, kind: 'rise' }) })
  return L.filter((x) => x.t >= 0 && x.t < D)
}

window.seek = seek
window.__medir__ = () => {
  const st = $('stage').getBoundingClientRect(), k = 1920 / st.width
  const caixa = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - st.left) * k, y: (r.top - st.top) * k, w: r.width * k, h: r.height * k } }
  const visivel = (el) => { let e = el; while (e && e !== document.body) { const cs = getComputedStyle(e); if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity < 0.6) return false; e = e.parentElement } return true }
  const porCima = [...document.querySelectorAll('.over')].some((el) => el.style.visibility === 'visible')
  const palavras = porCima ? [] : [...document.querySelectorAll('#heads .w')].filter(visivel).map((el) => ({ txt: el.textContent, ...caixa(el) }))
  const cartao = visivel($('world')) && !porCima ? caixa($('shape')) : null
  const legenda = visivel($('capBox')) && !porCima ? caixa($('capBox')) : null
  const dentro = []
  if (cartao) for (const id of ['numero', 'app', 'broll', 'frase', 'chamada']) {
    const L = $('L-' + id); if (!visivel(L)) continue
    L.querySelectorAll('div').forEach((el) => { if (el.children.length === 0 && el.textContent.trim() && visivel(el)) dentro.push({ tela: id, txt: el.textContent.trim().slice(0, 30), ...caixa(el) }) })
  }
  return { palavras, cartao, legenda, dentro }
}
window.configure = () => {}
window.timeline = () => ({ beat: PL.batida, beats: Math.ceil(D / PL.batida), duration: D, phrases: PL.cenas.map((c) => c.inicio), cues: cues() })

const FOTOS = {}
async function iniciar() {
  let plano = window.__PLANO__
  if (!plano) plano = await (await fetch(new URLSearchParams(location.search).get('plano'))).json()
  await document.fonts.ready
  for (const e of plano.estados.filter((x) => x.id === 'foto')) {
    if (FOTOS[e.ficheiro]) continue
    const src = (window.__FOTOS__ || {})[e.ficheiro] || `../youtube-render/public/${e.ficheiro}`
    await new Promise((ok) => { const im = new Image(); im.onload = () => { FOTOS[e.ficheiro] = src; ok() }; im.onerror = () => ok(); im.src = src })
  }
  // fotografia que não carregou: a tela vira desenho, nunca um buraco
  plano.estados.forEach((e) => { if (e.id === 'foto' && !FOTOS[e.ficheiro]) { e.id = 'meta'; e.figura = 'semente'; e.acao = false; e.viraAcao = 1e9 } })
  montar(plano)
  window.__PRONTO__ = true
  if (!window.__RENDER__) {
    document.body.classList.add('preview')
    const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080)); fit(); addEventListener('resize', fit)
    const q = new URLSearchParams(location.search)
    if (q.has('t')) seek(+q.get('t'))
    else { const t0 = performance.now() - 1000 * (+q.get('de') || 0); const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop) }; loop() }
  }
}
iniciar()
</script>

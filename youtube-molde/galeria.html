<!doctype html>
<!-- GALERIA — todas as metáforas e ícones de uma vez, para conferir antes de entrar num vídeo. ?a=1.2 muda o instante da ação -->
<html><head><meta charset="utf-8"><title>galeria do molde</title>
<style>
@font-face { font-family: 'Unbounded'; src: url(fonts/unbounded.woff2) format('woff2'); font-weight: 200 900; }
body { margin: 0; background: #FFC72C; font-family: 'Unbounded'; }
#g { display: grid; grid-template-columns: repeat(11, 300px); gap: 12px; padding: 12px; width: max-content; }
.c { width: 300px; height: 330px; background: #161b22; border-radius: 26px; position: relative; overflow: hidden; }
.c svg { position: absolute; left: 10px; top: 0; }
.c b { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #f0f6fc; font-size: 15px; }
#ic { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; width: 3400px; color: #f0f6fc; }
#ic div { width: 90px; height: 110px; background: #161b22; border-radius: 20px; display: grid; place-items: center; font-size: 11px; }
</style></head><body><div id="g"></div><div id="ic"></div>
<script>
function S(t, f, z) { if (t <= 0) return 0; const w = 2 * Math.PI * f; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)) }
function pulse(t, f) { if (t <= 0) return 0; const x = 2 * Math.PI * f * t; return x * Math.exp(1 - x) }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, p) => a + (b - a) * p
</script>
<script src="metaforas.js"></script><script src="icones.js"></script>
<script>
const aA = +(new URLSearchParams(location.search).get('a') || 1.3)
const g = document.getElementById('g')
for (const [nome, f] of Object.entries(METAFORAS)) for (const [modo, a] of [['apresenta', 0.9], ['acao', aA]]) {
  const d = document.createElement('div'); d.className = 'c'
  d.innerHTML = `<svg width="280" height="280" viewBox="0 0 560 560">${f(a, modo)}</svg><b>${nome} · ${modo === 'acao' ? 'ação' : 'entra'}</b>`
  g.appendChild(d)
}
const ic = document.getElementById('ic')
for (const n of Object.keys(ICONES)) { const d = document.createElement('div'); d.innerHTML = icone(n, 54, '#f0f6fc') + n; ic.appendChild(d) }
window.__PRONTO__ = true
</script></body></html>

<!doctype html>
<!--
  O MOLDE DO SHORT — desenha qualquer plano.json feito por molde/plano.mjs. Nada aqui é de um vídeo só.
  Um cartão do app que nunca corta: notificação → metáfora → valor → extrato → metáfora em ação → alerta → notificação.
  Cada quadro é função pura do tempo: seek(t). O render injeta o plano em window.__PLANO__.
  Prévia: abrir com ?plano=trabalho/<slug>/plano.json num servidor local.
-->

<script>
// ═══ MOLAS ═══
function S(t, f, z) {
  if (t <= 0) return 0
  const w = 2 * Math.PI * f
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t)
  const wd = w * Math.sqrt(1 - z * z)
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))
}
function pulse(t, f) { if (t <= 0) return 0; const x = 2 * Math.PI * f * t; return x * Math.exp(1 - x) }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, p) => a + (b - a) * p
const SPR = { shape: { f: 1.8, z: 0.8 }, enter: { f: 3.4, z: 1 }, exit: { f: 8, z: 1 }, press: { f: 10, z: 1 }, snap: { f: 3, z: 0.62 }, word: { f: 3.2, z: 0.7 }, cam: { f: 1.1, z: 0.9 } }
const INK = '#0d1117', CARD = '#161b22'

let PL, D
// um valor que muda de alvo várias vezes = soma de uma mola por mudança; cíclico (o fim emenda no começo)
function track(keys, def = SPR.shape) {
  const k = keys.map(([t, v, s]) => [((t % D) + D) % D, v, s || def]).sort((a, b) => a[0] - b[0])
  const n = k.length
  return (t) => {
    let v = k[n - 1][1]
    for (let c = -3; c <= 0; c++) for (let i = 0; i < n; i++) { const dv = k[i][1] - k[(i - 1 + n) % n][1]; if (dv) v += dv * S(t - k[i][0] - c * D, k[i][2].f, k[i][2].z) }
    return v
  }
}
const since = (t, k) => (((t - k) % D) + D) % D
const inWindow = (t, a, b) => since(t, a) < since(b, a)
function latest(list, t) { let best = 0; for (let i = 0; i < list.length; i++) if (since(t, list[i].t) < since(t, list[best].t)) best = i; return best }
function mixHex(a, b, p) { const A = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), Bc = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16)); return `rgb(${A.map((x, i) => Math.round(lerp(x, Bc[i], clamp(p)))).join(',')})` }
function visStyle(el, vis, blurMax = 10) { el.style.opacity = clamp(vis).toFixed(4); const b = (1 - clamp(vis)) * blurMax; el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none'; el.style.visibility = vis < 0.002 ? 'hidden' : 'visible' }
const $ = (id) => document.getElementById(id)

// ═══ TAMANHOS DAS TELAS ═══
const TAM = { janela: [900, 560, 48], notif: [880, 176, 88], meta: [720, 560, 70], valor: [900, 470, 56], extrato: [900, 640, 56], alerta: [660, 240, 120], lista: [900, 600, 30], app: [900, 560, 56], grafico: [900, 600, 56], conta: [900, 420, 40], convite: [900, 560, 60] }
const BG = { janela: CARD, notif: CARD, meta: CARD, valor: CARD, extrato: CARD, alerta: '#FFFFFF', lista: '#FFFDF5', app: CARD, grafico: CARD, conta: '#FFF8E7', convite: CARD }

let tomba = () => 0
let T = {}, STATES, shapeW, shapeH, shapeR, cam, layerVis, cursorX, cursorY, cursorPress, shapePress, heads, coinsSpec, cardOn
function montar(plano) {
  PL = plano; D = plano.duracao
  // o "palco" não tem tela: o cartão fica do tamanho da tela de antes e some (o ecrã é do boneco)
  STATES = []
  plano.estados.forEach((e) => { const b = e.id === 'palco' ? STATES[STATES.length - 1] : null; STATES.push({ ...e, w: b ? b.w : TAM[e.id][0], h: b ? b.h : TAM[e.id][1], r: b ? b.r : TAM[e.id][2], bg: b ? b.bg : BG[e.id] }) })
  shapeW = track(STATES.map((s) => [s.t, s.w])); shapeH = track(STATES.map((s) => [s.t, s.h])); shapeR = track(STATES.map((s) => [s.t, s.r]))
  cardOn = STATES.some((s) => s.id === 'palco') ? track(STATES.map((s) => [s.t, s.id === 'palco' ? 0 : 1, s.id === 'palco' ? SPR.exit : SPR.snap])) : () => 1
  $('pautas').innerHTML = Array.from({ length: 5 }, (_, i) => `<div class="abs" style="left:0;right:0;top:${120 + i * 80 + 66}px;height:2px;background:#cfe0f5"></div>`).join('')
  const meta2 = STATES.find((s) => s.id === 'meta' && s.modo === 'acao')
  // ⚠️ qualquer tela pode faltar (o plano tira as que não cabem): nada aqui pode contar com o extrato ou a metáfora
  cam = track([...STATES.map((s) => [s.t, 1]), [plano.aterra - 0.02, 1.1, { f: 2.2, z: 0.6 }], [plano.aterra + 1.0, 1.0], ...(meta2 ? [[meta2.t, 1.08], [meta2.t + 1.6, 1.0]] : [])], SPR.cam)
  // cada estado tem a sua camada; a mesma camada pode servir dois estados
  layerVis = {}
  STATES.forEach((s, i) => { if (s.id === 'palco') return; const nx = STATES[(i + 1) % STATES.length].t; (layerVis[s.id] ||= []).push(track([[s.t + 0.12, 1, SPR.enter], [nx - 0.04, 0, SPR.exit]])) })
  // camada de uma tela que NÃO está no plano fica escondida para sempre (senão aparecia por baixo de tudo)
  document.querySelectorAll('.layer').forEach((el) => { if (!layerVis[el.id.slice(2)]) { el.style.visibility = 'hidden'; el.style.opacity = '0' } })
  // cursor
  const ck = plano.cursor.chaves, vel = { f: plano.cursor.vel, z: 1 }
  cursorX = track(ck.map(([t, x]) => [t, x]), vel); cursorY = track(ck.map(([t, , y]) => [t, y]), vel)
  const pk = (ts) => ts.flatMap((t) => [[t - 0.07, 1, SPR.press], [t + 0.06, 0, SPR.enter]])
  cursorPress = plano.cursor.cliques.length ? track(pk(plano.cursor.cliques)) : () => 0
  shapePress = cursorPress
  // textos
  $('notifTxt').textContent = plano.rotulo
  document.querySelectorAll('.rotulo').forEach((el) => (el.textContent = plano.rotulo))
  document.querySelector('.icone').innerHTML = icone(plano.icone, 54, '#fde047')
  document.querySelector('.alertaVal').textContent = plano.valor
  // extrato: a despesa verdadeira entre linhas-esqueleto (sem números inventados)
  const xr = $('xrows')
  for (let i = 0; i < 4; i++) {
    const r = document.createElement('div'); r.className = 'row'; r.style.top = 160 + i * 116 + 'px'; r.style.height = '100px'
    r.innerHTML = i === 1
      ? `<div class="abs" style="left:22px;top:18px;width:64px;height:64px;border-radius:20px;background:#fde04722;display:grid;place-items:center">${icone(plano.icone, 38, '#fde047')}</div><div class="abs" style="left:108px;top:30px;font-size:34px;font-weight:700;white-space:nowrap">${plano.rotulo}</div><div class="abs disp" style="right:26px;top:26px;font-size:38px;font-weight:800;color:#ff7a6e;white-space:nowrap">− ${plano.valor}</div>`
      : `<div class="abs" style="left:22px;top:18px;width:64px;height:64px;border-radius:20px;background:#21262d"></div><div class="skel" style="left:108px;top:26px;width:${220 + (i * 70) % 160}px"></div><div class="skel" style="left:108px;top:58px;width:120px;height:16px;opacity:.6"></div><div class="skel" style="right:26px;top:38px;width:140px"></div>`
    if (i === 1) r.id = 'xreal'
    xr.appendChild(r)
  }
  // manchetes: o tamanho da letra encolhe até caber
  heads = plano.manchetes.map((m) => {
    const el = document.createElement('div'); el.className = 'head'
    el.innerHTML = m.palavras.map((w) => `<span class="w">${w}</span>`).join('')
    $('heads').appendChild(el)
    let fs = m.palavras.join(' ').length <= 10 ? 150 : m.palavras.join(' ').length <= 18 ? 120 : 100
    el.style.fontSize = fs + 'px'
    while ((el.scrollHeight > 330 || [...el.children].some((c) => c.offsetWidth > 980)) && fs > 56) { fs -= 6; el.style.fontSize = fs + 'px' }
    return { el, m, words: [...el.children] }
  })
  // moedas da ação (só no ralo e no cofre tem moedas próprias; no ralo giram para o centro)
  coinsSpec = meta2 && (meta2.metafora || plano.metafora) === 'ralo' ? Array.from({ length: 12 }, (_, i) => ({ x: -320 + (i * 97) % 640, y: -260 + (i % 3) * 90, t0: meta2.t + 0.03 * i, a0: i * 2.4 })) : []
  coinsSpec.forEach(() => { const c = document.createElement('div'); c.className = 'coin'; c.textContent = 'R$'; $('coins').appendChild(c) })
  const tombos = (plano.fx || []).filter((f) => f.tipo === 'tomba')
  tomba = tombos.length ? track(tombos.flatMap((f) => [[f.t - 0.05, 1, { f: 2.4, z: 0.5 }], [f.t + 0.55, 0, { f: 2.4, z: 0.5 }]])) : () => 0
  const extrato = STATES.find((s) => s.id === 'extrato')
  // (no Short de 50 s não há alerta, e há um cartão de valor para cada número dito)
  const alerta = STATES.find((s) => s.id === 'alerta')
  T = { meta2: meta2 ? meta2.t : null, metaNome: meta2 ? meta2.metafora || plano.metafora : plano.metafora, extrato: extrato ? extrato.t : null, aterra: plano.aterra, alerta: alerta ? alerta.t : null, volta: STATES[0].t }
}

// legenda: a frase falada; se for comprida, metade de cada vez
function caption(t) {
  const box = $('capBox')
  let c = -1
  PL.cenas.forEach((cn, i) => { const ws = cn.palavras; if (t >= cn.inicio - 0.05 && t < ws[ws.length - 1].t + 0.9) c = i })
  if (c < 0) { box.style.visibility = 'hidden'; return }
  let ws = PL.cenas[c].palavras
  if (ws.length > 8) { const h = Math.ceil(ws.length / 2); ws = t < ws[h].t - 0.05 ? ws.slice(0, h) : ws.slice(h) }
  box.style.visibility = 'visible'
  const html = ws.map((x, i) => { const nx = i + 1 < ws.length ? ws[i + 1].t : x.t + 0.6; const on = t >= x.t && t < nx, said = t >= x.t; return `<span class="cw" style="color:${on ? INK : said ? '#f0f6fc' : 'rgba(240,246,252,0.38)'};background:${on ? '#fde047' : 'transparent'}">${x.w}</span>` }).join(' ')
  if (box.innerHTML !== html) box.innerHTML = html
}

function seek(tIn) {
  const t = ((tIn % D) + D) % D
  const c = cam(t)
  const tb = tomba(t)
  $('world').style.transform = `scale(${c.toFixed(5)}) rotateX(${(32 * tb).toFixed(3)}deg) translateY(${(-40 * tb).toFixed(2)}px)`

  // fundo
  const IN = PL.inundacoes.map((x) => ({ t: x.t, color: x.cor }))
  const wi = latest(IN, t), prev = (wi - 1 + IN.length) % IN.length
  $('stage').style.background = IN[prev].color
  const rad = 2400 * S(since(t, IN[wi].t), 1.1, 1)
  Object.assign($('wipe').style, { left: 540 - rad + 'px', top: 950 - rad + 'px', width: 2 * rad + 'px', height: 2 * rad + 'px', background: IN[wi].color })
  // o cenário no fundo (item 3): a silhueta do lugar da janela mais recente, por cima da cor
  {
    const js = STATES.filter((x) => x.id === 'janela')
    let fundo = ''
    if (js.length) {
      const i = latest(js, t), atual = js[i], anterior = js[(i - 1 + js.length) % js.length]
      const nome = (j) => FUNDO_DO_CENARIO[CENARIO_DE[j.objetos[0].nome] || 'rua'] || 'cidade'
      const entra = clamp(since(t, atual.t) / 0.6)
      if (entra < 1 && nome(anterior) !== nome(atual)) fundo += `<g opacity="${(1 - entra).toFixed(3)}">${FUNDOS[nome(anterior)](t, D)}</g>`
      fundo += `<g opacity="${(nome(anterior) === nome(atual) ? 1 : entra).toFixed(3)}">${FUNDOS[nome(atual)](t, D)}</g>`
    } else fundo = FUNDOS.cidade(t, D)
    $('fundoSvg').innerHTML = fundo
  }
  const ph = (t / D) * Math.PI * 2
  $('decoRing').style.transform = `translate(${-380 + 50 * Math.sin(ph)}px, ${1180 + 40 * Math.cos(ph)}px)`
  $('decoSquare').style.transform = `translate(${700 + 40 * Math.cos(ph)}px, ${-120 + 50 * Math.sin(ph)}px) rotate(${(t / D) * 90 + 14}deg)`
  $('decoDot').style.transform = `translate(${880 + 30 * Math.sin(ph * 2)}px, ${1640 + 24 * Math.cos(ph)}px)`

  // o cartão
  const w = shapeW(t), h = shapeH(t), r = Math.min(shapeR(t), w / 2, h / 2)
  const aA = T.alerta === null ? 99 : since(t, T.alerta), shake = aA < 0.6 ? Math.sin(aA * 70) * 16 * Math.exp(-aA * 7) : 0
  const slam = since(t, T.aterra) < 1 ? pulse(since(t, T.aterra), 4) : 0
  const DINGS = [0.02, 2 * PL.batida + 0.02]
  const ding = DINGS.reduce((m, d0) => Math.max(m, t >= d0 && t < d0 + 0.9 ? pulse(t - d0, 3.2) : 0), 0)
  const wig = DINGS.reduce((m, d0) => m + (t >= d0 && t < d0 + 0.6 ? Math.sin((t - d0) * 55) * Math.exp(-(t - d0) * 8) : 0), 0)
  const sp = 1 - 0.035 * clamp(shapePress(t)) + 0.03 * slam + 0.06 * ding
  // no palco o cartão encolhe e some; volta com um salto quando a tela seguinte entra
  const co = clamp(cardOn(t))
  Object.assign($('shape').style, { width: w + 'px', height: h + 'px', left: -w / 2 + 'px', top: -h / 2 + 'px', borderRadius: r + 'px', transform: `translateX(${shake.toFixed(2)}px) rotate(${(2.2 * wig).toFixed(3)}deg) scale(${(sp * lerp(0.55, 1, co)).toFixed(4)})`, boxShadow: '0 2px 4px rgba(13,17,23,0.18), 0 40px 80px -24px rgba(13,17,23,0.55)', opacity: co.toFixed(4), visibility: co < 0.01 ? 'hidden' : 'visible' })
  const si = latest(STATES, t), sRad = Math.hypot(w, h) * S(since(t, STATES[si].t), 1.7, 1)
  $('shape').style.background = STATES[(si - 1 + STATES.length) % STATES.length].bg
  Object.assign($('shapeWipe').style, { left: w / 2 - sRad + 'px', top: h / 2 - sRad + 'px', width: 2 * sRad + 'px', height: 2 * sRad + 'px', background: STATES[si].bg })
  const pg = DINGS.map((d0) => t - d0).find((a) => a >= 0 && a < 0.8), pingEl = $('ping')
  if (pg === undefined) pingEl.style.visibility = 'hidden'
  else { const e = 1 - Math.pow(1 - pg / 0.8, 3); Object.assign(pingEl.style, { visibility: 'visible', width: w + 'px', height: h + 'px', left: -w / 2 + 'px', top: -h / 2 + 'px', opacity: (1 - pg / 0.8) * 0.7, transform: `scale(${1 + 0.35 * e}, ${1 + 1.2 * e})` }) }

  for (const id of Object.keys(layerVis)) {
    const el = $('L-' + id), vis = Math.max(...layerVis[id].map((f) => f(t)))
    visStyle(el, vis)
    if (vis < 0.002) continue
    const lw = TAM[id][0], lh = TAM[id][1]
    Object.assign(el.style, { width: lw + 'px', height: lh + 'px', left: (w - lw) / 2 + 'px', top: (h - lh) / 2 + 'px', transform: `scale(${lerp(0.96, 1, clamp(vis))})` })
  }
  // janela: o cenário do 1.º objeto e os objetos, cada um no seu tempo
  const janelas = STATES.filter((s) => s.id === 'janela')
  if (janelas.length) {
    const jt = janelas[latest(janelas, t)], aj = since(t, jt.t)
    const q = jt.quebra !== null && jt.quebra !== undefined ? since(t, jt.quebra) : null
    const quebrou = q !== null && q < aj
    const nomeCen = CENARIO_DE[jt.objetos[0].nome] || 'rua'
    const anda = quebrou ? 0 : aj * 300
    let svg = CENARIO[nomeCen](aj, anda)
    for (const o of jt.objetos) { const ao = since(t, o.t); if (ao <= aj + 0.01 && OBJ[o.nome]) svg += OBJ[o.nome](ao, { quebra: quebrou ? q : null }) }
    // o boneco contracena (item 4): reage aos efeitos que caem dentro desta janela
    if (!SEM_BONECO.has(jt.objetos[0].nome)) {
      const fim = STATES[(STATES.indexOf(jt) + 1) % STATES.length].t
      const ev = (tipo) => { const f = (PL.fx || []).find((x) => x.tipo === tipo && inWindow(x.t, jt.t, fim)); return f && inWindow(t, f.t, fim + 0.5) ? since(t, f.t) : null }
      // a emoção da cena em que a janela está (a mais recente que já começou)
      const E = PL.emocoes || [], ie = E.reduce((b, x, k) => (x[0] <= t ? k : b), -1), em = ie >= 0 ? E[ie] : null
      const fala = PL.cenas.some((cn) => t >= cn.inicio && cn.palavras.length && t < cn.palavras[cn.palavras.length - 1].t + 0.3)
      const emo = em ? { nome: em[1], k: clamp((t - em[0]) / 0.35), a: t - em[0], t, fala } : null
      svg += bonecoNaJanela(aj, { quebra: quebrou ? q : null, atraso: ev('papeis'), festa: ev('confete'), susto: ev('raios') }, emo)
    }
    $('janelaSvg').innerHTML = svg
  }
  // efeitos que saem da janela (sem corte)
  let fxs = ''
  for (const f of PL.fx || []) {
    const a = since(t, f.t)
    if (f.tipo === 'papeis' && a < 1.6) fxs += FX.papeis(a)
    if (f.tipo === 'moedas' && a < 1.2) fxs += FX.moedas(a)
    if (f.tipo === 'confete' && a < 2) fxs += FX.confete(a)
    if (f.tipo === 'raios' && a < 0.8) fxs += FX.raios(a)
    if (f.tipo === 'notas' && a < 1.6) fxs += FX.notas(a)
    if (f.tipo === 'brilho' && a < 1.6) fxs += FX.brilho(a)
    if (f.tipo === 'faiscas' || f.tipo === 'fumaca') {
      const jt = janelas.find((j) => Math.abs(j.quebra - f.t) < 0.01); if (!jt) continue
      const fim = STATES[(STATES.indexOf(jt) + 1) % STATES.length].t
      // a fumaça some em 0,4 s depois de a janela fechar (com 0,8 s ficava por cima do cartão seguinte)
      const vivo = inWindow(t, f.t, fim + 0.4), sumir = clamp(1 - (since(t, fim) < 0.4 ? since(t, fim) / 0.4 : 0))
      if (!vivo) continue
      const [cx, cy] = capoDoCarro(since(f.t, jt.objetos[0].t))
      const origem = [cx - 450, cy - 280]
      fxs += f.tipo === 'faiscas' ? FX.faiscas(a, origem) : `<g opacity="${inWindow(t, f.t, fim) ? 1 : sumir}">${FX.fumaca(a, origem)}</g>`
    }
  }
  $('fxSvg').innerHTML = fxs

  // metáfora: o estado "meta" mais recente diz o modo
  const metas = STATES.filter((s) => s.id === 'meta'), mt = metas.length ? metas[latest(metas, t)] : null
  const mNome = mt ? mt.metafora || PL.metafora : null
  if (mt) $('metaSvg').innerHTML = (METAFORAS[mNome] || ((a, m) => metaforaPadrao(a, m, mNome)))(since(t, mt.t), mt.modo)

  // valor: rola e aterra em cima do número dito (no Short de 50 s cada cartão traz o seu número e a sua hora)
  const valores = STATES.filter((s) => s.id === 'valor')
  if (valores.length) {
    const vs = valores[latest(valores, t)], num = vs.valor ?? parseInt(PL.valor.replace(/\D/g, ''), 10), at = vs.aterra ?? T.aterra
    const u = clamp((since(t, vs.t) - 0.1) / Math.max(0.3, since(at, vs.t) - 0.1))
    const sl = vs.aterra === undefined ? slam : since(t, at) < 1 ? pulse(since(t, at), 4) : 0
    $('amount').textContent = 'R$ ' + Math.round(num * (1 - Math.pow(1 - u, 3))).toLocaleString('pt-BR')
    $('amount').style.transform = `scale(${(1 + 0.12 * sl).toFixed(4)})`
    $('amount').style.color = mixHex('#f0f6fc', '#ff7a6e', clamp(sl * 2))
    $('valorSub').textContent = vs.valor === undefined ? 'Nova despesa' : vs.sub || ''
  }

  // a tela do app: o resultado que o FinMoovi mostrou aterra quando a voz o diz
  const apps = STATES.filter((s) => s.id === 'app')
  if (apps.length) {
    const e = apps[latest(apps, t)], u = clamp((since(t, e.t) - 0.3) / Math.max(0.4, since(e.aterra, e.t) - 0.3)), k = 1 - Math.pow(1 - u, 3)
    const cor = e.tom === 'entra' ? '#3fdc8f' : e.tom === 'sai' ? '#ff7a6e' : '#22d3ee'
    const sl = since(t, e.aterra) < 1 ? pulse(since(t, e.aterra), 4) : 0
    $('appRotulo').textContent = e.rotulo || ''
    $('appValor').textContent = (e.tom === 'entra' ? '+ ' : e.tom === 'sai' ? '− ' : '') + 'R$ ' + Math.round(e.valor * k).toLocaleString('pt-BR')
    $('appValor').style.color = mixHex('#f0f6fc', e.tom === 'neutro' ? '#f0f6fc' : cor, u)
    $('appValor').style.transform = `scale(${(1 + 0.1 * sl).toFixed(4)})`
    $('appSub').textContent = e.sub || ''
    Object.assign($('appBarra').style, { width: (100 * k).toFixed(1) + '%', background: cor })
  }
  // o gráfico de 12 meses: as barras sobem uma a uma e o total conta até aterrar no número dito
  const grafs = STATES.filter((s) => s.id === 'grafico')
  if (grafs.length) {
    const e = grafs[latest(grafs, t)], a = since(t, e.t), span = Math.max(0.8, since(e.aterra, e.t) - 0.2)
    const cor = e.tom === 'entra' ? '#3fdc8f' : '#ff7a6e', k = 1 - Math.pow(1 - clamp((a - 0.2) / span), 3)
    $('grafTitulo').textContent = e.titulo || ''
    $('grafValor').textContent = e.valor ? 'R$ ' + Math.round(e.valor * k).toLocaleString('pt-BR') : ''
    $('grafValor').style.color = cor
    const larg = (812 - 11 * 12) / 12
    $('grafBarras').innerHTML = Array.from({ length: 12 }, (_, i) => {
      const g = clamp(S(a - 0.2 - (span * i) / 12, 2.6, 0.75), 0, 1.1), h = (290 * (i + 1)) / 12 * g
      return `<div class="abs" style="left:${(i * (larg + 12)).toFixed(1)}px;bottom:0;width:${larg.toFixed(1)}px;height:${h.toFixed(1)}px;border-radius:12px 12px 4px 4px;background:${cor};opacity:${(0.55 + 0.45 * (i + 1) / 12).toFixed(2)}"></div>`
    }).join('')
  }
  // a conta no papel: a linha escreve-se, o risco passa, e o resultado aparece
  const contas = STATES.filter((s) => s.id === 'conta')
  if (contas.length) {
    const e = contas[latest(contas, t)], a = since(t, e.t)
    const linha = e.a ? `R$ ${e.a.toLocaleString('pt-BR')} × ${e.b}${e.unidade ? ' ' + e.unidade : ''}` : e.texto || ''
    $('contaLinha').textContent = linha.slice(0, Math.ceil(linha.length * clamp((a - 0.15) / 0.6)))
    $('contaLinha').style.fontSize = (linha.length > 20 ? 48 : 62) + 'px'
    $('contaRisco').style.transform = `scaleX(${clamp((a - 0.8) / 0.3).toFixed(3)})`
    $('contaRes').textContent = e.a ? '= R$ ' + (e.a * e.b).toLocaleString('pt-BR') : ''
    $('contaRes').style.opacity = clamp((a - 1.1) * 4).toFixed(3)
  }
  // o convite: o FinMoovi, os dias grátis, e o botão que o cursor carrega quando a voz diz "grátis"
  const convs = STATES.filter((s) => s.id === 'convite')
  if (convs.length) {
    const e = convs[latest(convs, t)], cl = since(t, e.clique) < since(t, e.t), b = $('convBotao')
    $('convDias').textContent = e.dias ? `${e.dias} dias grátis` : 'Teste grátis'
    b.style.background = cl ? '#3fdc8f' : '#22d3ee'
    b.textContent = cl ? 'Testar grátis ✓' : 'Testar grátis'
    b.style.transform = `scale(${(1 - 0.06 * clamp(cursorPress(t)) + (cl && since(t, e.clique) < 1 ? 0.06 * pulse(since(t, e.clique), 3) : 0)).toFixed(3)})`
  }
  // extrato: a linha da despesa acende
  const xa = T.extrato === null ? 99 : since(t, T.extrato)
  $('xreal').style.borderColor = `rgba(255,90,78,${clamp((xa - 0.4) * 3) * 0.9})`
  {
    const iEx = STATES.findIndex((s) => s.id === 'extrato'), fimEx = iEx >= 0 ? STATES[(iEx + 1) % STATES.length].t : null
    // o clique que abre o extrato (pode cair um instante antes dele) pinta a linha meio segundo depois
    const cl = iEx >= 0 ? PL.cursor.cliques.find((c) => inWindow(c, T.extrato - 0.35, fimEx)) : undefined
    const pinta = cl === undefined ? null : Math.max(cl, T.extrato + 0.6) % D
    const cheia = pinta !== null && inWindow(t, pinta, fimEx) ? clamp(since(t, pinta) / 0.3) : 0
    $('xreal').style.background = cheia > 0 ? mixHex('#0d1117', '#c0262d', cheia) : '#0d1117'
  }
  $('xreal').style.transform = `scale(${1 + 0.03 * (xa < 1.2 ? pulse(xa - 0.4, 3) : 0)})`

  // a folha de caderno: o item escreve-se quando a voz o diz; o cursor clica na caixinha, o ✓ verde aparece e a
  // linha fica circulada a verde; no fim o botão "Tudo conferido?" é carregado e vira "Conferido ✓"
  const listas = STATES.filter((s) => s.id === 'lista')
  if (listas.length) {
    const e = listas[latest(listas, t)], al = since(t, e.t)
    $('listaRows').innerHTML = e.itens.map((it, i) => {
      const ai = al - (it.t - e.t)
      const escreve = clamp((ai + 0.1) / 0.45), letras = Math.ceil(it.texto.length * escreve)
      const ok = clamp(S(ai - 0.25, 3.2, 0.6), 0, 1.15), circ = clamp((ai - 0.35) / 0.45)
      return `<div class="abs" style="left:120px;top:${120 + i * 80}px;width:740px;height:66px;opacity:${escreve > 0 ? 1 : 0}">
        <div class="abs" style="left:0;top:10px;width:46px;height:46px;border-radius:10px;border:4px solid ${ok > 0.05 ? '#16a34a' : '#8b949e'};box-sizing:border-box;background:${ok > 0.05 ? '#dcfce7' : '#fff'}"></div>
        <svg class="abs" style="left:4px;top:8px" width="46" height="46" viewBox="0 0 46 46"><path d="M9 24 L19 34 L38 11" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - clamp(ok)).toFixed(3)}"/></svg>
        <div class="abs" style="left:72px;top:6px;font-size:40px;font-weight:700;white-space:nowrap;color:${ok > 0.5 ? '#166534' : INK}">${it.texto.slice(0, letras)}</div>
        <svg class="abs" style="left:56px;top:-6px;overflow:visible" width="660" height="78"><rect x="0" y="0" width="${Math.min(650, 40 + it.texto.length * 24)}" height="78" rx="39" fill="none" stroke="#16a34a" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1 - circ).toFixed(3)}" opacity="${circ > 0 ? 0.85 : 0}"/></svg>
      </div>`
    }).join('')
    const ab = al - (e.botao - e.t), b = $('listaBotao'), bk = clamp(S(ab + 0.6, 2.6, 0.6), 0, 1.1), carregou = ab >= 0
    b.style.opacity = clamp(bk * 1.5).toFixed(2)
    b.style.transform = `scale(${(lerp(0.7, 1, Math.min(1, bk)) * (1 - 0.06 * clamp(cursorPress(t)))).toFixed(3)})`
    b.style.background = carregou ? '#16a34a' : '#22c55e'
    b.textContent = carregou ? 'Conferido ✓' : 'Tudo conferido?'
  }

  // o palco: o boneco grande sozinho em cima da cor (e meio segundo a sair quando o cartão volta)
  {
    let svgP = ''
    const si2 = latest(STATES, t), cur2 = STATES[si2], ant2 = STATES[(si2 - 1 + STATES.length) % STATES.length]
    const pa = cur2.id === 'palco' ? [cur2, 0] : ant2.id === 'palco' && since(t, cur2.t) < 0.5 ? [ant2, since(t, cur2.t)] : null
    if (pa) {
      const [e, sai] = pa
      const fala = PL.cenas.some((cn) => t >= cn.inicio && cn.palavras.length && t < cn.palavras[cn.palavras.length - 1].t + 0.3)
      const aE = sai > 0 ? since(cur2.t, e.t) + sai : since(t, e.t) // segundos desde que o palco abriu
      svgP = PALCO.desenhar(e.t + aE, e, { nome: e.emocao, k: clamp((aE - 0.3) / 0.35), a: Math.max(0, aE - 0.3), fala }, sai)
    }
    $('palcoSvg').innerHTML = svgP
  }

  // moedas do ralo
  ;[...$('coins').children].forEach((el, i) => {
    const k = coinsSpec[i], a = t - k.t0
    if (a < 0 || a > 1.4) { el.style.visibility = 'hidden'; return }
    el.style.visibility = 'visible'
    const e = 1 - Math.pow(1 - clamp(a / 1.2), 2), ang = k.a0 + e * 5, rr = Math.hypot(k.x, k.y) * (1 - e)
    el.style.transform = `translate(${(Math.cos(ang) * rr).toFixed(1)}px, ${(Math.sin(ang) * rr).toFixed(1)}px) scale(${(1 - 0.8 * e) * clamp(a * 8)})`
  })

  // manchetes, com as palavras de impacto a acender
  heads.forEach(({ el, m, words }) => {
    const on = inWindow(t, m.entra, m.sai), aIn = since(t, m.entra), aOut = since(t, m.sai)
    words.forEach((wEl, j) => {
      let p = on ? S(aIn - 0.06 * j, SPR.word.f, SPR.word.z) : 1 - S(aOut - 0.03 * j, 7, 1)
      if (!on && aOut > 0.5) p = 0
      p = clamp(p, 0, 1.15)
      const ac = m.acende[j]
      const hl = ac && on && inWindow(t, ac.t, m.sai) ? clamp(S(since(t, ac.t), 4, 0.75)) : 0
      const kick = ac && since(t, ac.t) < 1 ? pulse(since(t, ac.t), 3.6) : 0
      wEl.style.opacity = clamp(p * 1.4).toFixed(3)
      wEl.style.transform = `translateY(${((1 - p) * 70).toFixed(2)}px) scale(${(lerp(0.85, 1, clamp(p)) + 0.12 * kick * hl).toFixed(4)}) rotate(${(-3 * kick * hl).toFixed(2)}deg)`
      wEl.style.filter = p < 0.98 ? `blur(${((1 - clamp(p)) * 12).toFixed(2)}px)` : 'none'
      wEl.style.background = `rgba(13,17,23,${(0.92 * hl).toFixed(3)})`
      wEl.style.color = mixHex(INK, ac ? ac.cor : '#FDE047', hl)
    })
    el.style.visibility = on || aOut < 0.5 ? 'visible' : 'hidden'
  })

  caption(t)

  // cursor: o ritmo do plano decide quando aparece, para onde vai, e a que velocidade
  const jan = PL.cursor.janelas || []
  const cv = jan.reduce((m, [a, b]) => Math.max(m, clamp((t - a) * 3) * clamp((b - t) * 3)), 0)
  const cur = $('cursor')
  cur.style.opacity = cv * co // no palco o cursor sai com o cartão
  // 17/10, o Ed: "toda vez que o cursor aparece ele tem que fazer movimentos como se fosse uma explicação de
  // uma pessoa, e não movimentos somente retos". O caminho dobra para o lado (como a mão faz), e antes de cada
  // clique o cursor dá uma volta em espiral à volta do alvo e assenta exatamente nele.
  let cx = cursorX(t), cy = cursorY(t)
  const vx = (cursorX(t + 0.02) - cursorX(t - 0.02)) / 0.04, vy = (cursorY(t + 0.02) - cursorY(t - 0.02)) / 0.04
  const vel = Math.hypot(vx, vy), dobra = Math.min(90, vel * 0.08) / (vel || 1)
  cx += -vy * dobra; cy += vx * dobra
  const naLista = STATES[latest(STATES, t)].id === 'lista' // na folha os cliques vêm seguidos: vai direto à caixinha
  for (const cl of PL.cursor.cliques) {
    const d = since(cl, t) // segundos até ao clique
    if (d > 0 && d < 0.85 && !naLista) { const u = d / 0.85, ang = u * Math.PI * 2 * 1.2; cx += 48 * u * Math.cos(ang); cy += 30 * u * Math.sin(ang) }
  }
  cur.style.transform = `translate(${(540 + cx * c - 8).toFixed(2)}px, ${(950 + cy * c - 5).toFixed(2)}px) scale(${1 - 0.16 * clamp(cursorPress(t))})`
}

function cues() {
  const L = [
    { t: 0.02, kind: 'ding' }, { t: 2 * PL.batida + 0.02, kind: 'ding' },
    ...PL.cursor.cliques.map((t) => ({ t, kind: 'click' })),
    ...STATES.map((s) => ({ t: s.t, kind: 'swish' })),
    { t: T.aterra, kind: 'thud' }, ...(T.alerta === null ? [] : [{ t: T.alerta, kind: 'boom' }]),
    ...STATES.filter((s) => s.id === 'valor' && s.aterra !== undefined && Math.abs(s.aterra - T.aterra) > 0.05).map((s) => ({ t: s.aterra, kind: 'thud' })),
    ...STATES.filter((s) => s.id === 'app').map((s) => ({ t: s.aterra, kind: 'ding' })),
    ...STATES.filter((s) => s.id === 'grafico').map((s) => ({ t: s.aterra, kind: 'coin' })),
    ...(T.extrato === null ? [] : [{ t: T.extrato + 0.4, kind: 'tick' }]),
    ...(T.meta2 === null ? [] : T.metaNome === 'domino' ? [0, 1, 2, 3, 4].map((i) => ({ t: T.meta2 + 0.35 + 0.13 * i, kind: 'tick' })) : []),
    ...(T.meta2 === null ? [] : T.metaNome === 'cofre' ? [0, 1, 2, 3].map((i) => ({ t: T.meta2 + 0.6 + 0.22 * i, kind: 'coin' })).concat([{ t: T.meta2 + 1.6, kind: 'click' }]) : []),
    ...(T.meta2 === null ? [] : T.metaNome === 'ampulheta' ? [{ t: T.meta2 + 0.1, kind: 'whoosh' }] : []),
    ...(T.meta2 === null ? [] : T.metaNome === 'ralo' ? [{ t: T.meta2 + 0.5, kind: 'gurgle' }] : []),
    ...(PL.fx || []).flatMap((f) => f.tipo === 'faiscas' ? [{ t: f.t, kind: 'thud' }] : f.tipo === 'fumaca' ? [{ t: f.t + 0.1, kind: 'whoosh' }] : f.tipo === 'papeis' ? [0, 0.15, 0.3].map((d) => ({ t: f.t + d, kind: 'swish' })) : f.tipo === 'moedas' ? [0, 0.08, 0.16, 0.24].map((d) => ({ t: f.t + d, kind: 'coin' })) : f.tipo === 'tomba' ? [{ t: f.t, kind: 'whoosh' }] : f.tipo === 'confete' ? [{ t: f.t, kind: 'ding' }] : f.tipo === 'raios' ? [{ t: f.t, kind: 'boom' }] : f.tipo === 'notas' ? [{ t: f.t, kind: 'whoosh' }] : []),
    ...STATES.filter((s) => s.id === 'palco').map((s) => ({ t: s.t + 0.6, kind: s.momento === 'pensamento' ? 'rise' : s.momento === 'close' ? 'whoosh' : 'swish' })),
    ...STATES.filter((s) => s.id === 'lista').flatMap((s) => s.itens.map((it) => ({ t: it.t + 0.33, kind: 'tick' }))),
    ...STATES.filter((s) => s.id === 'janela').flatMap((j) => j.objetos.map((o) => ({ t: o.t + 0.05, kind: o.nome === 'carro' ? 'rise' : o.nome === 'lampada' ? 'click' : 'tick' }))),
  ]
  return L.map((x) => ({ ...x, t: ((x.t % D) + D) % D }))
}

window.seek = seek
// a CONFERÊNCIA pergunta à página onde está cada coisa visível (coordenadas do ecrã de 1080×1920)
window.__medir__ = () => {
  const st = $('stage').getBoundingClientRect(), k = 1080 / st.width
  const caixa = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - st.left) * k, y: (r.top - st.top) * k, w: r.width * k, h: r.height * k } }
  const visivel = (el) => { let e = el; while (e && e !== document.body) { const cs = getComputedStyle(e); if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity < 0.6) return false; e = e.parentElement } return true }
  const palavras = [...document.querySelectorAll('#heads .w')].filter(visivel).map((el) => ({ txt: el.textContent, ...caixa(el) }))
  const cartao = caixa($('shape'))
  const legenda = visivel($('capBox')) ? caixa($('capBox')) : null
  const dentro = []
  for (const id of ['notif', 'valor', 'extrato', 'alerta', 'app', 'grafico', 'conta', 'convite']) {
    const L = $('L-' + id); if (!visivel(L)) continue
    L.querySelectorAll('div').forEach((el) => { if (el.children.length === 0 && el.textContent.trim() && visivel(el)) dentro.push({ tela: id, txt: el.textContent.trim().slice(0, 30), ...caixa(el) }) })
  }
  return { palavras, cartao, legenda, dentro }
}
window.configure = () => {}
window.timeline = () => ({ beat: PL.batida, beats: PL.batidas, duration: D, phrases: PL.cenas.map((c) => c.inicio), cues: cues() })

async function iniciar() {
  let plano = window.__PLANO__
  if (!plano) plano = await (await fetch(new URLSearchParams(location.search).get('plano'))).json()
  await document.fonts.ready
  montar(plano)
  window.__PRONTO__ = true
  if (!window.__RENDER__) {
    document.body.classList.add('preview')
    const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth / 1080, innerHeight / 1920)); fit(); addEventListener('resize', fit)
    const q = new URLSearchParams(location.search)
    if (q.has('t')) seek(+q.get('t'))
    else { const t0 = performance.now(); const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop) }; loop() }
  }
}
iniciar()
</script>

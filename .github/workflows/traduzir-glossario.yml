name: Traduzir Glossário

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  traduzir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Install dependencies
        run: npm ci

      - name: Traduzir glossário para EN e ES
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        # `--max-minutes 50` = paragem interna 10 min abaixo do teto do passo.
        # ATENÇÃO ao detalhe que torna isto obrigatório: o `timeout-minutes`
        # abaixo está no PASSO, não no job. Passo que estoura FALHA (não
        # cancela), e passo falhado faz o GitHub saltar os seguintes — incluindo
        # o commit. Como o script grava cada verbete à medida que traduz, bater
        # no teto deitava fora TODAS as traduções já escritas em disco.
        # Uma condição `if:` no commit não resolveria: `cancelled()` nunca
        # dispara neste caso, e `always()` guardaria também em falha real, o que
        # publicaria verbetes meio traduzidos. Por isso o conserto é aqui dentro.
        run: node src/scripts/automacoes/traduzir-glossario.js --max-minutes 50
        timeout-minutes: 60

      - name: Commit and push
        run: |
          git add src/content/glossario/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "glossário: traduzir termos para EN e ES [auto]"
            bash .github/scripts/empurrar.sh
          fi

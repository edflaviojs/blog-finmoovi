name: YouTube — Guarda do canal (diário)

# ♦ O GUARDA DO CANAL — 09/08/2026, IMPLEMENTACAO20 §64.
#
# ═══ POR QUE ESTE ROBÔ EXISTE ═══
# O vídeo piloto subiu a 05/08 privado, com a estreia marcada para domingo 09/08 às 19h,
# e o YouTube confirmou a marcação por escrito. Algures até 08/08 ele **passou a público
# sozinho** — e o domingo ficou sem vídeo. Ninguém soube: o dono descobriu ao abrir o
# Studio no próprio dia.
#
# ⚠️ **O problema não foi o vídeo ter mudado de estado. Foi ninguém ter dado por isso.**
# Entre o desmarcar e a estreia havia quatro dias de folga para reagir, e passaram-se
# em silêncio.
#
# ═══ O QUE ELE FAZ, E O QUE SE RECUSA A FAZER ═══
# Pergunta ao YOUTUBE — nunca ao caderno — sobre **todos os vídeos do canal**. E a
# pergunta é DIFERENTE para cada formato, senão dava alarmes falsos todos os dias:
#   · o vídeo LONGO antes da estreia → continua privado e à mesma hora?
#   · o LONGO já estreado, e os Shorts de 50s e de 16s → continuam PÚBLICOS e no ar?
#     (eles sobem já públicos desde a auditoria da API de 03/08)
#   · e a terceira, que nenhum programa fazia: **saiu o vídeo de ontem?** Foi assim que
#     o canal esteve dois dias sem vídeo em 07/08 sem ninguém reparar.
#
# Se alguma coisa saiu do sítio, **manda email ao dono e fica vermelho**. Não republica,
# não remarca, não muda privacidade nenhuma: essas são decisões dele. Um guarda que
# arruma sozinho o que não entende é pior do que guarda nenhum.
#
# ⚠️ **VERMELHO É DE PROPÓSITO.** É a segunda campainha: o email do Resend chega à
# caixa do dono, e o email do GitHub chega a quem segue o repositório. Uma delas há-de
# ser vista.
#
# ⚠️ **NÃO TOCA EM NADA.** Não escreve no repositório, não gasta IA, não gasta créditos
# de imagem. Só faz perguntas.

on:
  schedule:
    # ⚠️ 08:10 universais = 05h10 no Brasil. A hora foi escolhida, não sorteada: as
    # 05:00-12:00 universais são onde se concentram os agendamentos deste repositório
    # (memória `blog-workflows-infra`), mas isto é uma corrida de segundos e o atraso
    # do GitHub não lhe faz diferença — o que importa é ser TODOS os dias, e cedo o
    # suficiente para o dono ler antes de começar o dia.
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Perguntar ao YouTube se está tudo como foi combinado (longos, 50s e 16s)
        id: vigiar
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set +e
          node src/scripts/youtube/guarda.js
          CODE=$?
          set -e
          # ⚠️ CONFERIR O RESULTADO, NUNCA SÓ O CÓDIGO — mas aqui o código É o resultado,
          # e é ele que separa "está tudo bem" (0) de "há alarme" (9) de "o programa
          # rebentou" (qualquer outro). Os três merecem destinos diferentes.
          if [ "$CODE" = "0" ]; then echo "alarme=nao" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CODE" = "9" ]; then echo "alarme=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::error::o guarda rebentou (código $CODE) — e um guarda que rebenta não vigia."
          echo "alarme=sim" >> "$GITHUB_OUTPUT"
          echo "alarmes<<FIM" >> "$GITHUB_OUTPUT"
          echo "o próprio guarda falhou a correr (código $CODE) — ninguém está a vigiar o agendamento." >> "$GITHUB_OUTPUT"
          echo "FIM" >> "$GITHUB_OUTPUT"

      # ═══ 🔴 AS PROVAS DO VÍDEO LONGO, ACERVO INCLUÍDO — 25/08/2026 ═══
      #
      # Desde hoje o robô que FAZ o vídeo corre as provas com `--sem-acervo`: as provas
      # que lêem `.github/data/` (colheitas de outros robôs, títulos de canais que não são
      # nossos) avisam em vez de travarem. Foi uma surpresa dessas que deixou o domingo
      # 23/08 sem vídeo — as três corridas de 22/08 morreram numa prova de títulos.
      #
      # ⚠️ **Mas baixar o castigo lá não pode ser apagar o alarme.** É aqui que ele passa
      # a tocar: estas provas correm INTEIRAS, todos os dias, e uma vermelha manda email.
      # O defeito continua a ser visto no dia seguinte — o que deixa de acontecer é o
      # canal ficar sem vídeo por causa dele.
      #
      # ⚠️ Não gastam rede, nem IA, nem créditos: são provas de mesa. O montador corre
      # antes porque sete delas lêem o guião do piloto já montado, e ele é derivado (não
      # vai para o repositório). É determinista e leva dois segundos.
      - name: As provas do vídeo longo — com o acervo a valer vermelho
        id: acervo
        run: |
          set +e
          node src/scripts/youtube/montar-longo.js --slug=sair-do-vermelho > /dev/null 2>&1
          node src/scripts/validacao/validar-roteiro-longo.js > /tmp/provas-roteiro.txt 2>&1; A=$?
          node src/scripts/validacao/validar-publicacao-longo.js > /tmp/provas-publicacao.txt 2>&1; B=$?
          set -e
          cat /tmp/provas-roteiro.txt /tmp/provas-publicacao.txt
          if [ "$A" = "0" ] && [ "$B" = "0" ]; then
            echo "alarme=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "alarme=sim" >> "$GITHUB_OUTPUT"
          {
            echo "alarmes<<FIM"
            echo "🔴 as provas do vídeo longo têm vermelhas (o vídeo ainda sai, mas isto é para olhar):"
            sed -n '/AS QUE FALHARAM/,/═══/p' /tmp/provas-roteiro.txt /tmp/provas-publicacao.txt | grep '·' | head -20
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      # ⚠️ O EMAIL VAI PELO MESMO CAMINHO DO RELATÓRIO DIÁRIO (Resend), porque é o único
      # que já se sabe que chega ao dono. Um alarme que só existe no separador "Actions"
      # é um alarme que ninguém lê — foi exactamente assim que este defeito passou.
      - name: Avisar o dono
        if: steps.vigiar.outputs.alarme == 'sim' || steps.acervo.outputs.alarme == 'sim'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO || 'finmoovi@gmail.com' }}
          ALARMES: |
            ${{ steps.vigiar.outputs.alarmes }}
            ${{ steps.acervo.outputs.alarmes }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/avisar-guarda-canal.mjs

      - name: Ficar vermelho para o aviso não passar despercebido
        if: steps.vigiar.outputs.alarme == 'sim' || steps.acervo.outputs.alarme == 'sim'
        run: |
          echo "::error::há vídeo(s) fora do combinado ou provas vermelhas — ver o email e o registo acima."
          exit 1

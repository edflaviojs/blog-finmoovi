name: Fact Firewall (anti-alucinacao)

on:
  schedule:
    # Diario 05h UTC — pega fabricacoes logo apos as gerações de conteudo.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fact-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Rodar Fact Firewall
        run: node src/scripts/validacao/fact-guard.js

      # Link-guard: desfaz links internos para destino inexistente escritos por
      # QUALQUER um dos robos de conteudo. Vive aqui, e nao em cada workflow,
      # porque 12 scripts partilham o translation-prompt.js e sao 27 workflows a
      # escrever — 27 sitios para esquecer. Um link inventado reprova o build e
      # PARA o deploy do blog em silencio (aconteceu em 05/08/2026, ~20h parado).
      - name: Desfazer links internos inventados (link-guard)
        run: node src/scripts/validacao/link-guard.js

      - name: Validar consistência i18n
        run: node src/scripts/validacao/validar-i18n.js

      - name: Push changes
        run: |
          git pull --rebase origin main || true
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push
          else
            echo "No changes to push"
          fi

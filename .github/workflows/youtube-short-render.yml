name: YouTube — Renderizar Short (completo)

# Produz o Short inteiro na nuvem (IP limpo, sem o throttle do Edge local):
# TTS por cena + Whisper (timing real) → legendas SRT ×3 → render Remotion
# (voz + SFX + música + karaokê sincronizado). Sobe o MP4 + .srt como artefato.
# Com upload=true, publica no YouTube já PÚBLICO (auditoria aprovada) — F1.4.
#
# ♦ 03/08/2026 — cron diário: 06:30 UTC o job escolhe sozinho o PRÓXIMO termo,
# GERA o roteiro fresco, comita, renderiza e PÕE NA FILA DE SAÍDA (não publica
# mais aqui!). Quem publica é o youtube-short-publish.yml, no horário nobre BR.
# No disparo manual (workflow_dispatch) o comportamento é o de antes: slug +
# upload vêm dos inputs e o roteiro já tem que existir — a menos que auto=true,
# que replica o ciclo do cron sob demanda (escolhe, gera, renderiza, enfileira).
# ⚠️ RECUPERAÇÃO de um vídeo mau do dia: re-rodar manual com upload=true publica
# o NOVO direto (e às 15:00 o carteiro vê o tema já no tracking e só limpa a
# fila). Re-rodar manual SEM upload NÃO troca o bilhete da fila — o carteiro
# entregaria o artefato VELHO.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do roteiro (src/scripts/youtube/output/<slug>.script.json)'
        required: false
        default: 'juros-compostos'
      upload:
        description: 'Publicar no YouTube após render (vai PÚBLICO na hora)'
        type: boolean
        required: false
        default: false
      auto:
        description: "Modo automático — escolhe o próximo termo da fila e gera o roteiro (igual ao cron diário)"
        type: boolean
        required: false
        default: false
  schedule:
    # 06:30 UTC todo dia: o vídeo fica pronto ~07h UTC e o dono publica de manhã
    # (Lisboa/BR). Horário ajustável — é só mudar o cron aqui.
    - cron: '30 6 * * *'

# Necessário para commitar o roteiro gerado + o tracking do upload.
permissions:
  contents: write

# No cron, todas as execuções compartilham UM grupo fixo ("daily") para
# serializar (evita corrida no tracking / publicação dupla). Disparo manual com
# auto=true entra nesse MESMO grupo "daily", porque ele roda o ciclo idêntico
# ao cron (picker + commit + upload) e correria o mesmo risco de corrida. Nos
# demais disparos manuais o grupo é por slug — assim um manual não trava outro
# nem o cron. A expressão só usa contexto de evento (não usa saída de step),
# então é válida aqui.
concurrency:
  group: youtube-short-${{ (github.event_name == 'schedule' || github.event.inputs.auto == 'true') && 'daily' || github.event.inputs.slug || 'juros-compostos' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # F1.5 — resolve o modo da execução:
      #   • schedule, OU workflow_dispatch com auto=true → escolhe o próximo
      #     termo (ignora o input slug); se o glossário esgotou, marca
      #     skip=true e o resto do job é pulado (sucesso neutro, sem falha).
      #     SLUG resolvido, UPLOAD=false + ENQUEUE=true (o vídeo vai para a
      #     fila de saída; quem publica é o youtube-short-publish.yml).
      #     auto=true replica o ciclo do cron sob demanda, pra testar/repetir.
      #   • workflow_dispatch sem auto → SLUG/UPLOAD vêm dos inputs,
      #     GENERATE=false (comportamento manual de sempre).
      - name: Resolver slug e modo
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.auto }}" = "true" ]; then
            set +e
            SLUG="$(node src/scripts/youtube/pick-next-short.js)"
            CODE=$?
            set -e
            if [ "$CODE" = "78" ]; then
              echo "glossário esgotado 🎉 — nada a fazer hoje."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CODE" != "0" ]; then
              echo "❌ pick-next-short falhou (code $CODE)"
              exit "$CODE"
            fi
            echo "🎬 termo do dia: $SLUG"
            # Se editorial, FILE_SLUG é o id sem prefixo (para nome de ficheiro)
            if [[ "$SLUG" == EDITORIAL:* ]]; then
              FILE_SLUG="${SLUG#EDITORIAL:}"
            else
              FILE_SLUG="$SLUG"
            fi
            {
              echo "SLUG=$SLUG"
              echo "FILE_SLUG=$FILE_SLUG"
              # ♦ 03/08/2026 — PRODUÇÃO SEPARADA DA PUBLICAÇÃO (IMPL20 §32/IMPL24):
              # o cron PRODUZ de madrugada e põe o vídeo na FILA DE SAÍDA; quem
              # publica é o youtube-short-publish.yml, no horário nobre BR.
              # Publicar aqui às 06:30 UTC era publicar às 03:30 da manhã no Brasil.
              echo "UPLOAD=false"
              echo "ENQUEUE=true"
              echo "GENERATE=true"
            } >> "$GITHUB_ENV"
          else
            {
              echo "SLUG=${{ github.event.inputs.slug || 'juros-compostos' }}"
              echo "FILE_SLUG=${{ github.event.inputs.slug || 'juros-compostos' }}"
              echo "UPLOAD=${{ github.event.inputs.upload }}"
              echo "ENQUEUE=false"
              echo "GENERATE=false"
            } >> "$GITHUB_ENV"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências (blog)
        if: steps.resolve.outputs.skip != 'true'
        run: npm ci

      # ♦ 06/08/2026 — AS PROVAS DE MESA DO SHORT, e correm ANTES de tudo o que custa.
      # O Short publica todos os dias e era o único formato sem uma única prova: a forma
      # de ver o que ele ia escrever era gastar uma corrida de IA. Estas não gastam nada
      # e demoram segundos. ⚠️ Falham o job de propósito — as regras do dono (título de 8
      # palavras, palavra-chave em maiúsculas, 3 hashtags, etiquetas a encher os 500
      # caracteres) partem-se em silêncio e só se veem no Studio, tarde.
      - name: As provas de mesa dos metadados (não gastam nada)
        if: steps.resolve.outputs.skip != 'true'
        run: node src/scripts/validacao/validar-metadados-short.js

      # Só no cron: gera o roteiro fresco do termo escolhido (usa o LLM grátis).
      # Se a validação falhar mesmo após os retries internos, o step falha e o
      # job inteiro falha — o e-mail de falha do GitHub é o alerta (sem sistemas
      # de notificação extras).
      #
      # ⚠️ AS DUAS PASSAGENS PASSARAM A SER O GERADOR DE PRODUÇÃO (01/08/2026,
      # decisão do dono). Antes: `roteiro-short.js`, um prompt de 25.300 chars que
      # pedia ao modelo o texto E o visual ao mesmo tempo. Agora:
      #   passagem 1 (roteiro-narrativa.js) escreve SÓ a narração;
      #   passagem 2 (coreografia.js) escreve SÓ o visual, escolhendo a
      #   palavra-âncora por NÚMERO — é estruturalmente impossível inventar âncora.
      # Motivo medido: 5 dos últimos 6 vídeos tiveram erro de âncora e em 2 deles
      # um shot foi APAGADO do vídeo.
      # O ficheiro escrito é o MESMO (output/<slug>.script.json, mesmas chaves), por
      # isso nenhum passo a jusante muda.
      # 🔁 PARA VOLTAR ATRÁS bastam esta linha e a antiga:
      #   run: node src/scripts/youtube/roteiro-short.js --slug="$SLUG"
      - name: Gerar roteiro do termo (cron) — duas passagens
        if: steps.resolve.outputs.skip != 'true' && env.GENERATE == 'true'
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          # ♦ A chave dos modelos PAGOS do vídeo (03/08/2026, autorizada pelo dono):
          # sem ela o escritor/leitor caem nos gratuitos e o texto sai pior que o
          # padrão aprovado. É opt-in só aqui — os 27 robôs do blog continuam grátis.
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
        run: node src/scripts/youtube/coreografia.js --slug="$SLUG" --gravar

      # Comita o roteiro gerado (mesmo padrão do tracking) para o render ser
      # reproduzível e o histórico ficar registrado.
      - name: Commitar roteiro gerado (cron)
        if: steps.resolve.outputs.skip != 'true' && env.GENERATE == 'true'
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add "src/scripts/youtube/output/$FILE_SLUG.script.json"
          if git diff --staged --quiet; then
            echo "Sem mudanças no roteiro (nada a commitar)."
          else
            git commit -m "chore: roteiro do Short $FILE_SLUG [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      # Fallback OFFLINE de voz: instala o Piper + a voz pt-BR (faber-medium) para
      # o tts-client ter um SEGUNDO provedor real na cadeia (edge → piper). Sem
      # isto a "escalada" da 4ª tentativa do tts-short não tinha p/ quem cair
      # (cadeia de tamanho 1) e o job morria se o edge desse stub repetido.
      # RESILIENTE: se o download falhar, só avisa e segue SEM Piper (edge-only,
      # como antes) — o fallback NUNCA derruba o job.
      - name: Cache do Piper (binário + voz)
        id: piper-cache
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/piper
          key: piper-2023.11.14-2-pt_BR-faber-medium-v1.0.0
      - name: Instalar Piper (fallback offline de voz)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          PIPER_DIR="$RUNNER_TEMP/piper"
          BIN="$PIPER_DIR/piper/piper"
          MODEL="$PIPER_DIR/pt_BR-faber-medium.onnx"
          if ! ( [ -x "$BIN" ] && [ -f "$MODEL" ] && [ -f "$MODEL.json" ] ); then
            echo "Baixando Piper + voz pt-BR (faber-medium)…"
            mkdir -p "$PIPER_DIR"
            if curl -fsSL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o "$PIPER_DIR/piper.tar.gz" \
              && tar -xzf "$PIPER_DIR/piper.tar.gz" -C "$PIPER_DIR" \
              && curl -fsSL "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx" -o "$MODEL" \
              && curl -fsSL "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json" -o "$MODEL.json"; then
              rm -f "$PIPER_DIR/piper.tar.gz"
              echo "Piper instalado."
            else
              echo "::warning::Falha ao baixar o Piper — seguindo SEM fallback offline (edge-only, como antes)."
              exit 0
            fi
          else
            echo "Piper já em cache."
          fi
          if [ -x "$BIN" ] && [ -f "$MODEL" ] && [ -f "$MODEL.json" ]; then
            {
              echo "PIPER_BIN=$BIN"
              echo "PIPER_MODEL=$MODEL"
            } >> "$GITHUB_ENV"
            echo "PIPER_BIN=$BIN"
            echo "PIPER_MODEL=$MODEL"
          else
            echo "::warning::Piper incompleto após instalação — seguindo SEM fallback offline."
          fi

      - name: Gerar áudio + timing (TTS + Whisper)
        if: steps.resolve.outputs.skip != 'true'
        env:
          TOGETHER_TTS_API_KEY: ${{ secrets.TOGETHER_TTS_API_KEY }}
        run: node src/scripts/youtube/tts-short.js --slug="$FILE_SLUG"

      - name: Gerar legendas SRT ×3 (pt/en/es)
        if: steps.resolve.outputs.skip != 'true'
        env:
          TOGETHER_TTS_API_KEY: ${{ secrets.TOGETHER_TTS_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/youtube/srt-short.js --slug="$FILE_SLUG"

      # Leva o roteiro do slug do dia para dentro do public/ do Remotion, para o
      # render carregá-lo via staticFile(roteiro/<slug>.json). Sem isto o render
      # cairia no fixture importado (bug do vídeo mudo/roteiro errado).
      - name: Preparar roteiro para o Remotion (public/roteiro)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          mkdir -p youtube-render/public/roteiro
          cp "src/scripts/youtube/output/$FILE_SLUG.script.json" "youtube-render/public/roteiro/$FILE_SLUG.json"

      - name: Instalar dependências (render)
        if: steps.resolve.outputs.skip != 'true'
        working-directory: youtube-render
        run: npm ci

      - name: Renderizar Short
        if: steps.resolve.outputs.skip != 'true'
        working-directory: youtube-render
        run: npx remotion render src/index.ts Short "out/$FILE_SLUG.mp4" --props="{\"slug\":\"$FILE_SLUG\"}" --crf=16 --jpeg-quality=95

      # ♦ 05/08/2026 — A CAPA (IMPL20 §52).
      # Tira-se AQUI e não em cada entrega: a produção já tem o Remotion instalado e
      # tudo em mãos, e a mesma fotografia serve as duas casas (miniatura no YouTube,
      # capa do Reel no Instagram). Renderiza-se uma vez, usa-se duas.
      # ⚠️ Corre da RAIZ (não de youtube-render): o programa lê o roteiro em
      # src/scripts/ e é ele que chama o Remotion na pasta certa.
      - name: Tirar a capa
        if: steps.resolve.outputs.skip != 'true'
        run: node src/scripts/youtube/capa-short.js --slug="$FILE_SLUG"

      - name: Subir artefato (MP4 + legendas + capa)
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ env.FILE_SLUG }}
          path: |
            youtube-render/out/*.mp4
            youtube-render/out/capa-${{ env.FILE_SLUG }}*.jpg
            youtube-render/public/audio/${{ env.FILE_SLUG }}/*.srt
          if-no-files-found: error

      # ♦ 03/08/2026 — o vídeo produzido pelo CRON entra na FILA DE SAÍDA em vez de
      # ser publicado aqui: o artefato short-<slug> guarda o MP4+SRTs e este bilhete
      # diz ao carteiro (youtube-short-publish.yml) qual run baixar. O commit da fila
      # serializa com o resto pelo concurrency group "daily".
      # ♦ 05/08/2026 — DUAS FILAS, PORQUE HÁ DOIS CARTEIROS.
      # O mesmo artefato é entregue no YouTube ao meio-dia e no Instagram às 19h.
      # Cada carteiro rasga o SEU bilhete: com uma fila só, o primeiro a entregar
      # apagaria o trabalho do segundo. Os dois bilhetes são escritos no MESMO
      # commit de propósito — é uma viagem só ao repositório, e nunca fica um
      # escrito sem o outro.
      - name: Pôr nas filas de saída (cron)
        if: steps.resolve.outputs.skip != 'true' && env.ENQUEUE == 'true'
        run: |
          node src/scripts/youtube/outbox.js enqueue --file-slug="$FILE_SLUG" --run-id="${{ github.run_id }}"
          node src/scripts/youtube/outbox.js enqueue --file-slug="$FILE_SLUG" --run-id="${{ github.run_id }}" --fila=instagram-outbox.json
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-outbox.json .github/data/instagram-outbox.json
          if git diff --staged --quiet; then
            echo "Filas de saída sem mudanças."
          else
            git commit -m "chore: video $FILE_SLUG pronto nas filas de saida [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Publicar no YouTube (público)
        if: steps.resolve.outputs.skip != 'true' && env.UPLOAD == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # LLM grátis p/ metadados (fallback determinístico se ausente)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/youtube/upload-short.js --slug="$FILE_SLUG"

      - name: Commitar tracking do upload
        if: steps.resolve.outputs.skip != 'true' && env.UPLOAD == 'true'
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-published.json
          if git diff --staged --quiet; then
            echo "Sem mudanças no tracking (nada novo publicado)."
          else
            git commit -m "chore: update youtube upload tracking [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

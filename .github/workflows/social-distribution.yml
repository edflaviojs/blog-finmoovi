name: Social Distribution (Pinterest + Bookmarks)

on:
  schedule:
    # Segundas, quartas e sextas às 15h UTC
    - cron: '0 15 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  # Lembrete automático de renovação do refresh token do Pinterest (issue → e-mail)
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  social-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Pinterest Publish
        env:
          # Preferencial: refresh token (access token renovado a cada execução)
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          # Fallback legado (token estático, expira em ~30 dias)
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          # Para abrir a issue de lembrete de renovação do token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Descrição rica do pin via LLM (kie-ai.js): Cerebras → Groq → Cloudflare
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          # O Pinterest entrega um refresh token novo a cada rodada; o passo abaixo grava-o
          PINTEREST_NOVO_TOKEN_FICHEIRO: ${{ runner.temp }}/pinterest-refresh.txt
        run: node --import tsx scripts/pinterest-publish.js

      # Sem isto a chave do Pinterest morria a cada 60 dias (16/11/2026).
      # GH_PAT_BLOG: chave do GitHub só deste repo, permissão Secrets (o GITHUB_TOKEN não grava secrets).
      # Se falhar, o pin já saiu: só avisa, e o lembrete de 7 dias continua de rede.
      - name: Guardar a chave nova do Pinterest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_BLOG }}
          FICHEIRO: ${{ runner.temp }}/pinterest-refresh.txt
        run: |
          if [ ! -s "$FICHEIRO" ]; then echo "Sem chave nova do Pinterest nesta rodada."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::warning::GH_PAT_BLOG em falta: chave nova do Pinterest NAO guardada."; rm -f "$FICHEIRO"; exit 0; fi
          if gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$FICHEIRO"; then
            echo "Chave nova do Pinterest guardada."
          else
            echo "::warning::Falhou guardar a chave nova do Pinterest (ver GH_PAT_BLOG)."
          fi
          rm -f "$FICHEIRO"

      - name: Run Social Bookmarking
        env:
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          RAINDROP_COLLECTION_ID: ${{ secrets.RAINDROP_COLLECTION_ID }}
        run: node --import tsx scripts/social-bookmarking.js

      - name: Commit and push tracking updates
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/pinterest-published.json .github/data/social-bookmarks.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update social distribution tracking [skip ci]"
            bash .github/scripts/empurrar.sh
          fi
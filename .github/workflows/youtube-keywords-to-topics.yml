name: YouTube — Converter Keywords em Temas (semanal)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * 3'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Converter keywords em temas YouTube
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/keywords-to-youtube-topics.js

      - name: Commitar temas novos
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-topics.json
          if git diff --staged --quiet; then
            echo "Sem novos temas para commitar."
          else
            git commit -m "chore: converter keywords em temas YouTube [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

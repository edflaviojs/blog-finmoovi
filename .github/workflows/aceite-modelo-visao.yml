# ARQUIVO TEMPORARIO DE USO UNICO — deve ser REMOVIDO logo apos rodar.
#
# Valida o FALLBACK de visao (Cloudflare) do gerar-alt-imagens.js rodando o
# script real com o Groq desligado. Nao commita nada: o alt gerado fica so no
# runner e e descartado no fim do job.

name: (temporario) Testar fallback de visao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rodar o script SEM Groq (forca o fallback do Cloudflare)
        env:
          # GROQ_API_KEY deliberadamente AUSENTE — o provedor se auto-desabilita
          # e a unica saida e o Cloudflare.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node --import tsx src/scripts/automacoes/gerar-alt-imagens.js --limit 1

      - name: Mostrar o alt gerado (e descartar)
        if: always()
        run: |
          git --no-pager diff --unified=0 -- src/content | grep -E '^\+imageAlt:' || echo "(nenhum imageAlt novo no diff)"
          git checkout -- src/content || true

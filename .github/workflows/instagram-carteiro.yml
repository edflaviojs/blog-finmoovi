name: Multipost — Entregar o Short às 8 redes (a partir das 19h BR)

# ♦ O SEGUNDO CARTEIRO (05/08/2026 — IMPL20 §51, decisão do dono).
#
# O mesmo vídeo que o carteiro do YouTube entrega ao meio-dia é entregue aqui ao
# Multipost, que o publica em OITO redes a partir das 19h do Brasil.
#
# ♦ 07/08/2026 — DE UMA REDE PARA OITO (IMPL26 §12). Entraram TikTok, Facebook,
# LinkedIn, Threads, Telegram, Pinterest e Bluesky. O X ficou de fora por ordem
# do dono: desde 02/2026 cobra US$ 0,20 por publicação com link.
#
# ⚠️ O NOME DO FICHEIRO CONTINUA "instagram-carteiro" DE PROPÓSITO. O histórico de
# corridas do GitHub está agarrado ao caminho do ficheiro: renomeá-lo apagava a
# lista de tudo o que já correu, para arrumar uma palavra. O mesmo vale para o
# caderno `.github/data/instagram-agendados.json`.
#
# INDEPENDENTE DE PROPÓSITO: se isto falhar, o YouTube não sente. Fila própria,
# relógio próprio, caderno próprio. Foi essa a escolha do dono entre os três
# desenhos possíveis.
#
# 🔑 E DENTRO DELE, O INSTAGRAM É O PRINCIPAL: se ele falhar, a corrida falha. As
# outras sete são lucro — falham em aviso e o dia continua de pé. Correr esta
# mesma entrega outra vez tenta SÓ as redes que ficaram por sair.
#
# Corre às 15:20 UTC (12:20 no Brasil), vinte minutos depois do carteiro do
# YouTube — para o vídeo já ter ido ao ar lá antes de sair aqui, e para os dois
# não disputarem o mesmo minuto.
#
# ⚠️ A hora da PUBLICAÇÃO não é a hora desta corrida. Este robô só ENTREGA; quem
# publica é o Multipost, porque o agendamento vai no pedido. As oito saem entre
# as 19h00 e as 20h47 do Brasil, com intervalos desiguais — oito posts de quinze
# em quinze minutos certinhos é a assinatura de um robô.
#
# Sem pendentes na fila = sucesso neutro (exit 78), o mesmo "nada a fazer" do
# carteiro do YouTube.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Entregar este slug (vazio = o próximo da fila)'
        required: false
      run_id:
        description: 'De que corrida vem o vídeo (só com slug à mão; sem isto o MP4 não é baixado)'
        required: false
      dry_run:
        description: 'Ensaio (mostra o texto e a hora de CADA uma das 8 redes, não envia nada)'
        type: boolean
        default: false
      hora:
        description: 'Hora da PRIMEIRA rede (o Instagram), no relógio do Brasil — as outras vêm a seguir (vazio = 19)'
        required: false
      inspecionar:
        description: 'SÓ LER: perguntar às 8 redes que opções cada uma aceita, e conferir contra o que mandamos (não entrega nada)'
        type: boolean
        default: false
  # ✅ RELÓGIO LIGADO em 07/08/2026, por ordem do dono.
  #
  # Nasceu desligado ("liga-se depois da primeira entrega conferida") e assim ficou
  # enquanto só havia Instagram. Liga agora, no mesmo dia em que passou a servir sete
  # redes — e a primeira corrida automática é 08/08 às 12h20 do Brasil.
  #
  # ⚠️ O QUE SAI NA PRIMEIRA: os dois vídeos que estão na fila foram escritos ANTES da
  # fala nova (ainda dizem "comenta FINMOOVI"), por isso a trava do vídeo antigo manda-os
  # só ao Instagram. As sete redes só recebem a partir do primeiro vídeo escrito depois
  # de hoje. Ver `falaPedeComentario` em `entregar.js`.
  #
  # 🔴 UM RELÓGIO SÓ CORRE A PARTIR DO RAMO PRINCIPAL. Num ramo lateral este bloco não
  # faz nada — já custou tempo neste projeto a descobrir isso.
  #
  # 15:20 UTC = 12:20 no Brasil (o país não muda a hora desde 2019).
  schedule:
    - cron: '20 15 * * *'

permissions:
  contents: write
  actions: read

# MESMO grupo dos outros: todos commitam em .github/data.
concurrency:
  group: youtube-short-daily
  cancel-in-progress: false

jobs:
  # 🔎 O INSPETOR — só lê. Existe porque a capa do Reel foi mandada durante duas semanas
  # num campo que não existe e **nada se queixou**: este servidor deita fora em silêncio
  # o que não conhece. Em vez de adivinhar, pergunta-se-lhe. Ver `inspecionar()`.
  #
  # ♦ Desde 07/08 ele olha as OITO redes e cruza o que mandamos com o que cada uma
  # aceita: acende a vermelho se mandarmos um campo que ela não conhece (seria deitado
  # fora em silêncio) ou se faltar um obrigatório. Correr depois de cada atualização do
  # Multipost — a lista muda com a versão dele.
  inspecionar:
    if: github.event.inputs.inspecionar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Perguntar ao Multipost o que ele aceita
        env:
          MULTIPOST_API_KEY: ${{ secrets.MULTIPOST_API_KEY }}
        run: node src/scripts/multipost/entregar.js --inspecionar

  entregar:
    # ⚠️ Num relógio este campo vem VAZIO, e vazio ≠ 'true' — portanto a entrega corre
    # normalmente. É a mesma armadilha dos interruptores que já custou um robô mudo.
    if: github.event.inputs.inspecionar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # ⚠️ NUMA CORRIDA AUTOMÁTICA OS CAMPOS DO BOTÃO VÊM VAZIOS. Já houve neste
      # projeto um robô que nunca publicava por causa disto. Por isso: se o campo
      # do slug estiver vazio (que é sempre, no relógio), vai-se à fila.
      - name: Próximo da fila do Instagram
        id: fila
        run: |
          PEDIDO="${{ github.event.inputs.slug }}"
          if [ -n "$PEDIDO" ]; then
            echo "FILE_SLUG=$PEDIDO" >> "$GITHUB_ENV"
            echo "RUN_ID=${{ github.event.inputs.run_id }}" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🎯 pedido à mão: $PEDIDO"
            exit 0
          fi
          set +e
          BILHETE="$(node src/scripts/youtube/outbox.js next --fila=instagram-outbox.json)"
          CODE=$?
          set -e
          if [ "$CODE" = "78" ]; then
            echo "📭 nada a entregar ao Instagram hoje — sucesso neutro."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != "0" ]; then
            echo "❌ leitura da fila falhou (code $CODE)"
            exit "$CODE"
          fi
          echo "bilhete: $BILHETE"
          {
            echo "FILE_SLUG=$(echo "$BILHETE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).fileSlug))')"
            echo "RUN_ID=$(echo "$BILHETE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runId))')"
          } >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        if: steps.fila.outputs.skip != 'true'
        run: npm ci

      # O artefato foi gravado a partir de youtube-render/, então baixá-lo PARA lá
      # reconstrói o layout que o entregador espera: out/<slug>.mp4.
      - name: Baixar o vídeo do run de produção
        if: steps.fila.outputs.skip != 'true' && env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RUN_ID" --name "short-$FILE_SLUG" --dir youtube-render
          test -f "youtube-render/out/$FILE_SLUG.mp4" || { echo "❌ MP4 não veio no artefato"; ls -R youtube-render | head -30; exit 1; }
          echo "🎞️ $(du -h "youtube-render/out/$FILE_SLUG.mp4" | cut -f1) prontos para entrega."

      - name: Entregar ao Multipost e agendar
        if: steps.fila.outputs.skip != 'true'
        env:
          MULTIPOST_API_KEY: ${{ secrets.MULTIPOST_API_KEY }}
        run: |
          ARGS="--slug=$FILE_SLUG"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.hora }}" ]; then ARGS="$ARGS --hora=${{ github.event.inputs.hora }}"; fi
          node src/scripts/multipost/entregar.js $ARGS

      - name: Tirar da fila e commitar o caderno
        if: steps.fila.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          node src/scripts/youtube/outbox.js done --file-slug="$FILE_SLUG" --fila=instagram-outbox.json
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/instagram-outbox.json .github/data/instagram-agendados.json
          if git diff --staged --quiet; then
            echo "Sem mudanças a commitar."
          else
            git commit -m "chore: short $FILE_SLUG agendado nas redes [skip ci]"
            bash .github/scripts/empurrar.sh
          fi

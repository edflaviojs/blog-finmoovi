name: Diagnóstico — quem responde no motor de IA

# SÓ à mão. Não tem horário, não escreve no repositório, não publica nada:
# faz uma pergunta minúscula ao motor de texto e diz qual fornecedor respondeu.
#
# Existe porque em 18/08/2026 a Cerebras começou a recusar (HTTP 402) e a única
# maneira de saber se tinha voltado era esperar que um robô de CONTEÚDO corresse
# por acaso — e esses publicam. Medir não pode custar uma publicação.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Perguntar ao motor de texto e à fila normal de imagens
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: node src/scripts/diagnostico/fornecedores-ia.js

      # A Together SOZINHA. Sem isto ela nunca seria experimentada: o roteador
      # para no primeiro que responder, e a Cloudflare responde primeiro.
      # Aqui as chaves da Cloudflare são deixadas de fora de propósito, e como
      # este é um arranque novo a lista de fornecedores é montada outra vez.
      # `continue-on-error`: a Together é o PLANO B — se ela estiver em baixo o
      # diagnóstico deve DIZER isso, não morrer e esconder o resto.
      # O GROQ_API_KEY vai aqui de propósito, embora este passo seja sobre a
      # Together: é ele que dá olhos à trava anti-letras. Sem ele a imagem da
      # Together sairia sem ninguém a olhar — e é justamente a dela que mais
      # interessa ver, porque o Qwen-Image é um modelo ESPECIALISTA em escrever
      # texto (foi o substituto imposto quando a Together desligou o FLUX).
      - name: A Together sozinha (o plano B das imagens)
        continue-on-error: true
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/scripts/diagnostico/fornecedores-ia.js --so-imagem

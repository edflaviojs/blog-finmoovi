name: Gerar ALT descritivo das imagens (IA de visão)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Máximo de imagens a processar (vazio = todas). Use 5 para testar.'
        required: false
        default: ''
      force:
        description: 'Regenerar mesmo onde já existe imageAlt (true/false)'
        required: false
        default: 'false'
  # Rede de segurança: 3x/dia processa um lote até tudo ter imageAlt; depois vira no-op.
  # HORARIO (mudado em 06/08/2026): era '0 9,15,21'. Medido no historico de
  # corridas: a das 09h UTC passava TODOS os dias; as das 15h e 21h UTC eram
  # canceladas TODOS os dias, por 25 min de backoff do Groq (429). 15h e 21h UTC
  # sao 11h e 17h na costa leste dos EUA — o pico do free tier do Groq. As tres
  # corridas passam agora a 06/09/11 UTC (02h/05h/07h em NY), a faixa mais calma
  # e a unica com passagem comprovada.
  schedule:
    - cron: '0 6,9,11 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gerar-alt:
    runs-on: ubuntu-latest
    # Teto duro. Sem isto herda o padrao de 6h do GitHub: em 13-15/07/2026
    # NOVE execucoes deste workflow queimaram 1.935 min (60% da cota mensal),
    # duas delas canceladas por bater nas 6h. A causa e o backoff de
    # 20s+40s+60s POR IMAGEM (gerar-alt-imagens.js:117) quando o Groq
    # rate-limita — sem teto global. Ritmo normal medido: ~15s/imagem, ou
    # ~8 min para o lote de 30. 25 min da 3x de folga e corta o descontrole.
    # Perder um lote nao custa dado: o script e idempotente e a proxima
    # rodada (3x/dia) refaz o que faltou.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Install dependencies
        run: npm ci

      - name: Gerar imageAlt via IA de visão
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          # Rodadas agendadas processam um lote (respeita limites de API).
          # Era 60 (=180/dia); baixado para 30 porque a cota do Groq e
          # COMPARTILHADA com os demais workflows, que usam o Groq como fallback.
          # 06/08/2026: baixado de 30 para 15. A corrida boa das 09h UTC levava
          # 19 dos 25 min permitidos para fazer 30 — ou seja, ate a que passava
          # estava a raspar no teto. Com 15, sao ~10 min e sobra folga de 15 min.
          # 45/dia (3x15) continua a ser mais do que suficiente: em 06/08/2026
          # faltavam 74 imagens ao todo, isto e, 2 dias de trabalho.
          if [ -z "$LIMIT" ] && [ "${{ github.event_name }}" = "schedule" ]; then LIMIT="15"; fi
          ARGS=""
          if [ -n "$LIMIT" ]; then ARGS="--limit $LIMIT"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          # Teto de tempo POR DENTRO do script, 7 min abaixo do timeout do job:
          # o script para sozinho e o passo de commit corre, em vez de o GitHub
          # cancelar o job e deitar fora o trabalho ja feito.
          node --import tsx src/scripts/automacoes/gerar-alt-imagens.js $ARGS --max-minutes 18

      # `if: always()` = segunda rede. O teto de tempo do script ja evita o
      # cancelamento; mas se ainda assim o job for cancelado (ou o passo anterior
      # falhar), este passo corre na mesma e guarda os imageAlt ja escritos em
      # disco, em vez de os perder. O script e idempotente: guardar a meio nunca
      # estraga nada.
      - name: Commit e push
        if: always()
        run: |
          git add src/content/posts src/content/glossario
          if git diff --cached --quiet; then
            echo "Nenhum imageAlt novo para commitar"
          else
            git commit -m "content(a11y): gerar imageAlt descritivo das capas via IA de visão"
            git pull --rebase origin main || true
            git push
          fi

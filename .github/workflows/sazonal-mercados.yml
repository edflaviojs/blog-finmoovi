name: Sazonal Multimercado (timezone)

on:
  schedule:
    # Diario 08h UTC — publica ~10-15 dias antes da data mais proxima entre BR/PT/ES/EUA/UK.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sazonal:
    runs-on: ubuntu-latest
    # Teto duro (padrao do GitHub sem isto: 6h). Pico observado: 90 min —
    # dos quais 88 sao o passo "Auto-sincronizar i18n" embutido (gerar o
    # post leva 67s). Mesmo motivo do i18n-sync.yml: o commit so acontece
    # no fim, entao matar no meio perde trabalho. 120 min ate a Fase 0 do
    # IMPLEMENTACAO24 limitar o lote do i18n; depois dara para apertar.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Install dependencies
        run: npm ci

      - name: Gerar post sazonal multimercado
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/automacoes/gerar-sazonal-mercados.js

      - name: Auto-sincronizar i18n (rede de segurança)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/validacao/sincronizar-i18n.js

      - name: Validar consistência i18n
        run: node src/scripts/validacao/validar-i18n.js

      # SEM `if:` de proposito — herda o `success()` padrao, ou seja, so publica
      # se os passos acima passarem.
      #
      # Em 28/07/2026 este passo teve `if: !cancelled()` por algumas horas, com a
      # justificativa de que um push descartado perderia o feriado para sempre
      # (o tracking ja estaria marcado como coberto). Essa premissa e FALSA e foi
      # revertida no mesmo dia: `sazonal-cobertos.json` entra na whitelist do
      # commit (gerar-sazonal-mercados.js:241), logo viaja DENTRO do mesmo commit
      # local. Push descartado => runner destruido => o tracking na main fica
      # intacto => `loadTrack()` do dia seguinte nao ve o feriado como coberto.
      # E o cron e diario dentro de uma janela de 6 dias (leadMin 10 / leadMax 15
      # em calendario-sazonal.js:131), portanto ha ate 6 tentativas por feriado.
      # A perda NAO e permanente; e retentada sozinha no dia seguinte.
      #
      # O preco do `!cancelled()` era real: publicava conteudo REPROVADO pelo
      # validar-i18n.js e, pior, quando o sincronizar-i18n.js saia 1, o passo de
      # validacao era saltado (`success()`) e publicava-se sem validacao nenhuma.
      - name: Push changes
        run: |
          bash .github/scripts/empurrar.sh

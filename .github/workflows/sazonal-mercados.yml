name: Sazonal Multimercado (timezone)

on:
  schedule:
    # Diario 08h UTC — publica ~10-15 dias antes da data mais proxima entre BR/PT/ES/EUA/UK.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sazonal:
    runs-on: ubuntu-latest
    # Teto duro (padrao do GitHub sem isto: 6h). Pico observado: 90 min —
    # dos quais 88 sao o passo "Auto-sincronizar i18n" embutido (gerar o
    # post leva 67s). Mesmo motivo do i18n-sync.yml: o commit so acontece
    # no fim, entao matar no meio perde trabalho. 120 min ate a Fase 0 do
    # IMPLEMENTACAO24 limitar o lote do i18n; depois dara para apertar.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Install dependencies
        run: npm ci

      - name: Gerar post sazonal multimercado
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/automacoes/gerar-sazonal-mercados.js

      - name: Auto-sincronizar i18n (rede de segurança)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/validacao/sincronizar-i18n.js

      - name: Validar consistência i18n
        run: node src/scripts/validacao/validar-i18n.js

      # Roda MESMO se a validacao acima reprovar. Sem isto, gate vermelho =
      # push nunca acontece = o post e a capa morrem no runner efemero — e o
      # gerador ja marcou o feriado como coberto em sazonal-cobertos.json
      # ANTES do push, entao o feriado nunca mais e tentado nesse ano. A perda
      # e PERMANENTE e nao se recupera com re-run. O gate continua marcando o
      # job de vermelho (o passo acima nao foi tocado); o que muda e que o
      # conteudo deixa de ser descartado em silencio.
      # !cancelled() e nao always(): cancelamento manual nao deve publicar.
      - name: Push changes
        if: ${{ !cancelled() }}
        run: |
          git pull --rebase origin main || true
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push
          else
            echo "No changes to push"
          fi

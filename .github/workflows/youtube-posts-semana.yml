name: YouTube — Posts da semana (e-mail de segunda)

# 14/10/2026 — pedido do dono: *"é possível criarmos algum workflow para automatizarmos
# os posts do youtube?"* → *"Sim quero na segunda!"*
#
# A API do YouTube NÃO cria posts (só vídeos, comentários, legendas). Por isso o robô
# ESCREVE os seis posts da semana (segunda a sábado) à volta do vídeo de domingo e manda
# por e-mail; o dono cola e AGENDA no Studio. Ver o cabeçalho de `posts-semana.js`.
#
# 💶 SEM CAMINHO PARA COBRANÇA: este workflow NÃO recebe chave do kie.ai nem da Cerebras.
# Desde 14/10 escreve primeiro o Claude (Sonnet 5.5), pago pelo CRÉDITO mensal do plano Max
# — a organização da API não tem cartão, por isso sem crédito ele recusa, não cobra. Depois
# vem o Gemini Flash grátis e a fila gratuita (Groq, NVIDIA, Cloudflare).

on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'Ensaio: escreve e mostra no registo, NÃO envia o e-mail'
        type: boolean
        required: false
        default: false
  schedule:
    # Segunda 06:17 UTC = 07:17 em Lisboa (verão) / 03:17 no Brasil. Fora do minuto :00
    # (menos atraso do relógio do GitHub, que já chegou a 112 min neste repositório) e
    # depois da estreia de domingo (22:00 UTC), para o vídeo de ontem já ser público.
    - cron: '17 6 * * 1'

permissions:
  # write: a página de copiar (public/posts-youtube/) é guardada no repositório para o
  # Cloudflare a publicar no blog — ver `posts-semana.js`.
  contents: write

concurrency:
  group: youtube-posts-semana
  cancel-in-progress: false

jobs:
  escrever:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Escrever os 6 posts e a página de copiar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 14/10 — o Claude (Sonnet 5.5), crédito do plano Max — ver `escreverComClaude` em kie-ai.js
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.ensaio }}" = "true" ]; then
            node src/scripts/youtube/posts-semana.js --ensaio
          else
            node src/scripts/youtube/posts-semana.js --escrever
          fi

      # ⚠️ SEM [skip ci] de propósito: o Cloudflare Pages SALTA o deploy de um commit
      # com essa marca, e a página nova nunca chegaria ao ar.
      - name: Guardar a página de copiar (o Cloudflare publica-a no blog)
        if: github.event.inputs.ensaio != 'true'
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add public/posts-youtube/index.html
          if git diff --staged --quiet; then
            echo "Sem novidades na página."
          else
            git commit -m "chore(posts-youtube): página de copiar da semana"
            bash .github/scripts/empurrar.sh
          fi

      # Só sai depois de a página NOVA estar no ar (até 20 min à espera). Se não ficar,
      # o e-mail sai na mesma, com os textos todos, e diz que a página falhou.
      - name: Mandar o e-mail
        if: github.event.inputs.ensaio != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO || 'finmoovi@gmail.com' }}
        run: node src/scripts/youtube/posts-semana.js --enviar

      - name: Guardar os posts (para conferir depois)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-semana
          path: .posts-semana.json
          if-no-files-found: ignore

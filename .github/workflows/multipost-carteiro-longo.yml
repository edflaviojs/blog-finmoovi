name: Multipost — Entregar o vídeo longo às 4 redes (domingo)

# ♦ O QUARTO CARTEIRO — 10/08/2026, IMPLEMENTACAO26 §15 (ordem do dono).
#
# ═══ O BURACO QUE ISTO TAPA ═══
# O vídeo longo semanal subia ao YouTube e parava ali. Nunca foi ligado ao Multipost — não
# era defeito, era trabalho por fazer, e por isso nada se queixava.
#
# ═══ 🔴 QUATRO REDES, E NÃO SETE — É DECISÃO DE CONTEÚDO ═══
# O vídeo longo é **DEITADO (16:9) e tem 5 a 8 minutos**. O Instagram, o Threads e o
# Pinterest são casas de vídeo **em pé e curto**: lá ele entraria como uma faixa fina no
# meio do ecrã, que é pior do que não entrar. Vai às quatro onde vídeo comprido e deitado
# é normal: **Facebook, LinkedIn, Telegram e Bluesky** (este leva a capa e o link, porque
# não publica vídeo). A lista vive em `FORMATOS`, em `entregar.js`, e não aqui.
#
# ═══ A HORA — depois da estreia, nunca antes ═══
# O vídeo é produzido no sábado de madrugada e **estreia no YouTube ao domingo às 19h**.
# Este carteiro corre ao domingo às 18h do Brasil e agenda as quatro a partir das **20h**:
# a última sai às 21h47, ainda em horário nobre. Mandá-las antes da estreia seria estrear
# o vídeo nas redes e só depois no canal.
#
# ⚠️ **Um relógio só corre a partir do ramo PRINCIPAL.** Num ramo lateral este bloco não
# faz nada — já custou tempo neste projeto a descobrir isso.
#
# ⚠️ E há um caso em que ele não entrega nada e está certo: um vídeo longo cuja FALA ainda
# peça comentário. O Instagram é a única rede com robô a responder e não recebe este
# formato, portanto a trava do vídeo antigo não tem para onde cortar. O `entregar.js`
# diz-o com todas as letras em vez de sair calado.
#
# Sem pendentes na fila = sucesso neutro (exit 78), como nos outros carteiros.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Entregar este slug (vazio = o próximo da fila)'
        required: false
      run_id:
        description: 'De que corrida vem o vídeo (só com slug à mão; sem isto o MP4 não é baixado)'
        required: false
      dry_run:
        description: 'Ensaio (mostra o texto e a hora das 4 redes, não envia nada)'
        type: boolean
        default: false
      hora:
        description: 'Hora da primeira rede, no relógio do Brasil (vazio = 20)'
        required: false
  schedule:
    # 21:00 universais ao domingo = 18h00 no Brasil, no mesmo domingo (o país está a
    # UTC-3 e não muda a hora desde 2019). Uma hora antes da estreia no YouTube, e duas
    # antes da primeira rede — folga que chega para o atraso do cron do GitHub.
    - cron: '0 21 * * 0'

permissions:
  contents: write
  actions: read

# MESMO grupo dos outros carteiros: todos commitam em .github/data.
concurrency:
  group: youtube-short-daily
  cancel-in-progress: false

jobs:
  entregar:
    runs-on: ubuntu-latest
    # ⚠️ Mais tempo que os outros: o ficheiro do longo tem ~136 MB (o Short tem 23) e
    # sobe uma vez para servir as quatro redes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # ⚠️ NUMA CORRIDA AUTOMÁTICA OS CAMPOS DO BOTÃO VÊM VAZIOS. Já houve neste projeto
      # um robô que nunca publicava por causa disto.
      - name: Próximo da fila do vídeo longo
        id: fila
        run: |
          PEDIDO="${{ github.event.inputs.slug }}"
          if [ -n "$PEDIDO" ]; then
            echo "FILE_SLUG=$PEDIDO" >> "$GITHUB_ENV"
            echo "RUN_ID=${{ github.event.inputs.run_id }}" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🎯 pedido à mão: $PEDIDO"
            exit 0
          fi
          set +e
          BILHETE="$(node src/scripts/youtube/outbox.js next --fila=longo-redes.json)"
          CODE=$?
          set -e
          if [ "$CODE" = "78" ]; then
            echo "📭 nenhum vídeo longo à espera das redes — sucesso neutro."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != "0" ]; then
            echo "❌ leitura da fila falhou (code $CODE)"
            exit "$CODE"
          fi
          echo "bilhete: $BILHETE"
          {
            echo "FILE_SLUG=$(echo "$BILHETE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).fileSlug))')"
            echo "RUN_ID=$(echo "$BILHETE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runId))')"
          } >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        if: steps.fila.outputs.skip != 'true'
        run: npm ci

      # O artefato foi gravado a partir da raiz, então baixá-lo PARA a raiz reconstrói o
      # que o entregador espera: out/longo/<slug>.mp4, o roteiro e a capa da Manus.
      - name: Baixar o vídeo, o roteiro e a capa
        if: steps.fila.outputs.skip != 'true' && env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RUN_ID" --name "longo-$FILE_SLUG" --dir .
          test -f "youtube-render/out/longo/$FILE_SLUG.mp4" || { echo "❌ MP4 não veio no artefato"; ls -R youtube-render/out | head -30; exit 1; }
          test -f "src/scripts/youtube/output/$FILE_SLUG.script.json" || { echo "❌ o roteiro não veio no artefato — sem ele não há legenda"; exit 1; }
          # ⚠️ A capa em falta é AVISO, não paragem: sem ela só o Bluesky fica de fora
          # (é a única das quatro que não publica vídeo). Três redes é melhor que zero.
          ls youtube-render/public/manus/"$FILE_SLUG"/capa-*.jpg >/dev/null 2>&1 \
            || echo "::warning::sem capa da Manus — o Bluesky fica de fora deste."
          echo "🎞️ $(du -h "youtube-render/out/longo/$FILE_SLUG.mp4" | cut -f1) prontos para entrega."

      - name: Entregar ao Multipost e agendar
        if: steps.fila.outputs.skip != 'true'
        env:
          MULTIPOST_API_KEY: ${{ secrets.MULTIPOST_API_KEY }}
        run: |
          ARGS="--slug=$FILE_SLUG"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.hora }}" ]; then ARGS="$ARGS --hora=${{ github.event.inputs.hora }}"; else ARGS="$ARGS --hora=20"; fi
          node src/scripts/multipost/entregar.js $ARGS

      - name: Tirar da fila e commitar o caderno
        if: steps.fila.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          node src/scripts/youtube/outbox.js done --file-slug="$FILE_SLUG" --fila=longo-redes.json
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/longo-redes.json .github/data/instagram-agendados.json
          if git diff --staged --quiet; then
            echo "Sem mudanças a commitar."
          else
            git commit -m "chore: video longo $FILE_SLUG agendado nas redes [skip ci]"
            bash .github/scripts/empurrar.sh
          fi

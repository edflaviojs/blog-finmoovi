name: YouTube — Publicar Short (horário nobre)

# ♦ O CARTEIRO (03/08/2026 — IMPL20 §32 / IMPL24, decisão do dono).
#
# A produção (youtube-short-render.yml, cron 06:30 UTC) deixa o vídeo pronto
# como ARTEFATO e regista o bilhete na fila de saída. ESTE workflow entrega:
# baixa o artefato do run de produção e publica no YouTube — no horário nobre
# do Brasil, não às 03:30 da manhã como era quando tudo acontecia num fôlego.
#
# ♦ 12/08/2026 — O VÍDEO VAI AO AR ÀS 15:00 UTC (12h no Brasil), COMO SEMPRE. O que
# mudou é que ele **CHEGA três horas antes**, privado, com a estreia marcada: o dono
# quer que o YouTube tenha tempo de perceber do que se trata antes de o mostrar.
# Para mudar a hora de ir ao ar são DUAS linhas que andam juntas — o cron do envio e
# o `--estreia=` do passo de publicar. Há prova de mesa que compara as duas.
#
# A auditoria da API foi APROVADA (03/08/2026): a porta private→public abriu, e é por
# isso que o robô pode marcar a hora sozinho. Continua a não haver clique manual no
# Studio — quem publica ao segundo certo é o YouTube.
#
# Sem pendentes na fila = sucesso neutro (exit 78, o mesmo "nada a fazer" do
# pick-next-short). O passo de publicar é BARATO e determinístico de propósito
# (a lição da IMPL24): não carrega nada da produção além do bilhete.

on:
  workflow_dispatch:
  schedule:
    # ♦ 12/08/2026 — SOBE ÀS 12:00 UTC (09h BR) E ESTREIA ÀS 15:00 UTC (12h BR).
    #
    # Ordem do dono: *"quero que ele entre como privado e agendado nos horários corretos.
    # A intenção é dar tempo para o YouTube saber do que se trata o vídeo e divulgar para
    # a audiência certa."*
    #
    # ⚠️ **A HORA DE IR AO AR NÃO MUDOU — continua 12h no Brasil.** O que mudou foi a hora
    # do ENVIO: três horas antes, e o vídeo fica privado no Studio com a estreia marcada.
    # Quem o publica é o YouTube, ao segundo certo (`--estreia=15:00` no passo de publicar).
    #
    # ⚠️ **POR QUE TRÊS HORAS E NÃO DUAS**, que era o mínimo pedido: o cron do GitHub
    # atrasa — mediu-se até 112 minutos nesta casa. Com duas, um atraso grande deixava o
    # vídeo com minutos de antecedência ou com a hora já passada. Com três, mesmo no pior
    # atraso ainda sobra mais de uma hora.
    - cron: '0 12 * * *'   # 09:00 BRT — envia; a estreia fica marcada para as 15:00 UTC
    # ♦ 07/08/2026 — A SEGUNDA RONDA (ordem do dono: *"não podemos correr o risco
    # de não ter vídeo postado no dia"*). Em 06/08 a entrega das 12h nunca chegou a
    # receber máquina do GitHub e o canal ficou DOIS DIAS sem Short, com o vídeo
    # pronto e guardado na fila o tempo todo.
    # Não é uma segunda publicação: se o vídeo de hoje já saiu, esta ronda não faz
    # nada (a pergunta é `outbox.js saiu-hoje`) e custa segundos.
    - cron: '0 20 * * *'   # 17:00 BRT — repescagem, só se hoje ainda não saiu nada

# Escreve tracking + fila; lê artefatos de outro run.
permissions:
  contents: write
  actions: read

# MESMO grupo do cron de produção: os dois commitam nos mesmos ficheiros de
# estado — serializar evita a corrida no tracking/fila.
concurrency:
  group: youtube-short-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # ♦ 12/08/2026 — 🛟 O GUARDIÃO DO AGENDADO.
      #
      # ⚠️ **AGENDAR CRIA UM MODO DE FALHA QUE NÃO EXISTIA.** Até hoje, upload feito era
      # vídeo no ar. Com hora marcada, o vídeo pode subir bem, a corrida acabar a VERDE e
      # ele **nunca ficar público**. É exactamente o risco que o dono disse que não podia
      # correr — e ninguém daria por nada até abrir o Studio.
      #
      # Este passo pergunta ao YouTube pelos vídeos cuja hora já passou e, se algum
      # continuar privado, **torna-o público na hora**. Não avisa: conserta.
      #
      # ⚠️ **CORRE ANTES DO PASSO QUE INSTALA e SEM `if`**, de propósito: tem de correr
      # mesmo nos dias em que não há nada para publicar (`upload-short.js` só usa node e
      # ficheiros locais — provado a correr com o `node_modules` fora do disco).
      # ⚠️ **E NUNCA DERRUBA A ENTREGA DE HOJE.** Um guardião que impede a publicação é
      # pior do que o defeito que ele guarda.
      - name: O guardião do agendado (o que devia estar no ar, está?)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node src/scripts/youtube/upload-short.js --conferir-agendados || \
            echo "::warning::o guardião do agendado não correu — segue-se para a entrega de hoje."

      - name: Próximo da fila de saída
        id: fila
        run: |
          # ♦ A REPESCAGEM DAS 17h BR (07/08/2026). Só a ronda tardia faz esta
          # pergunta; a das 12h entrega sempre. `github.event.schedule` diz qual dos
          # dois crons disparou — não é preciso adivinhar pela hora do relógio.
          # ⚠️ Corre ANTES do `npm ci` de propósito: `outbox.js` só usa node:fs, e
          # num dia normal esta ronda acaba aqui, sem instalar nada.
          # ⚠️ `--formato=short50` acrescentado em 07/08/2026, e é o que mantém esta
          # rede de segurança viva. Sem ele, o Short de 16s que passa a sair às 8h40
          # respondia "sim, já saiu vídeo hoje" TODOS OS DIAS — e esta repescagem, que
          # nasceu ontem por o canal ter ficado dois dias sem vídeo, nunca mais
          # disparava, em silêncio. Cada formato pergunta pelo SEU.
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            if [ "$(node src/scripts/youtube/outbox.js saiu-hoje --formato=short50)" = "sim" ]; then
              echo "✅ o vídeo de hoje já foi entregue na ronda das 12h — a repescagem não faz nada."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::🔁 REPESCAGEM — hoje ainda não saiu vídeo nenhum; a entrega das 12h falhou ou não correu."
          fi
          set +e
          BILHETE="$(node src/scripts/youtube/outbox.js next)"
          CODE=$?
          set -e
          if [ "$CODE" = "78" ]; then
            echo "📭 nada a publicar hoje — sucesso neutro."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != "0" ]; then
            echo "❌ leitura da fila falhou (code $CODE)"
            exit "$CODE"
          fi
          echo "bilhete: $BILHETE"
          {
            echo "FILE_SLUG=$(echo "$BILHETE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).fileSlug))')"
            echo "RUN_ID=$(echo "$BILHETE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runId))')"
          } >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        if: steps.fila.outputs.skip != 'true'
        run: npm ci

      # O artefato foi gravado a partir de youtube-render/ (ancestral comum dos
      # caminhos), então baixá-lo PARA youtube-render/ reconstrói exatamente o
      # layout que o upload-short espera: out/<slug>.mp4 + public/audio/<slug>/*.srt.
      - name: Baixar o vídeo do run de produção
        if: steps.fila.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RUN_ID" --name "short-$FILE_SLUG" --dir youtube-render
          test -f "youtube-render/out/$FILE_SLUG.mp4" || { echo "❌ MP4 não veio no artefato"; ls -R youtube-render | head -30; exit 1; }
          echo "🎞️ $(du -h "youtube-render/out/$FILE_SLUG.mp4" | cut -f1) prontos para entrega."

      # ♦ 12/08/2026 — PRIVADO COM HORA MARCADA, e só na ronda de envio.
      #
      # ⚠️ **A REPESCAGEM CONTINUA A SUBIR PÚBLICO NA HORA**, e isso não é esquecimento:
      # ela só corre quando a entrega falhou, e ali o que está em causa é o vídeo existir.
      # Dar-lhe hora marcada seria empurrar o vídeo do dia para ainda mais tarde. **A rede
      # de segurança não pode ter condições.**
      #
      # ⚠️ E a decisão de agendar tem a última palavra DENTRO do programa: se a hora já
      # passou (o cron do GitHub atrasa), `estreiaMarcada` devolve "público na hora" e
      # diz porquê. Ver o cabeçalho dela em `upload-short.js`.
      - name: Publicar no YouTube (privado, com estreia marcada)
        if: steps.fila.outputs.skip != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # LLM grátis p/ metadados (fallback determinístico se ausente)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          ESTREIA=""
          if [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then ESTREIA="--estreia=15:00"; fi
          node src/scripts/youtube/upload-short.js --slug="$FILE_SLUG" $ESTREIA

      - name: Tirar da fila e commitar tracking
        if: steps.fila.outputs.skip != 'true'
        run: |
          node src/scripts/youtube/outbox.js done --file-slug="$FILE_SLUG"
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-published.json .github/data/youtube-outbox.json
          if git diff --staged --quiet; then
            echo "Sem mudanças a commitar."
          else
            git commit -m "chore: short $FILE_SLUG publicado (horario nobre) [skip ci]"
            bash .github/scripts/empurrar.sh
          fi

name: "i18n Gate (PR Check)"

on:
  pull_request:
    paths:
      - 'src/content/posts/**'
      - 'src/content/glossario/**'
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/content/glossario/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # necessário para git diff contra base ref / before SHA

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute changed content files (anchor strict scope)
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE=""   # first push / branch-create / force-push: sem base confiável
            else
              RANGE="$BEFORE ${{ github.sha }}"
            fi
          fi

          if [ -z "$RANGE" ]; then
            echo "Sem range de diff confiavel -> guard em WARNING puro (nao bloqueia)."
            CHANGED=""
          else
            CHANGED=$(git diff --name-only --diff-filter=AMR $RANGE -- src/content/posts src/content/glossario 2>/dev/null)
          fi

          echo "Arquivos estritos (novos/alterados):"; echo "$CHANGED"
          {
            echo 'ANCHOR_STRICT_FILES<<__ANCHOR_EOF__'
            echo "$CHANGED"
            echo '__ANCHOR_EOF__'
          } >> "$GITHUB_ENV"

      - name: Run i18n validation
        run: npm run validate:i18n:sync

      - name: Validate slug language (EN/ES sem palavras PT)
        run: npm run validate:slugs

      - name: Check new files for PT slug patterns
        run: |
          # Get list of new/renamed EN/ES content files in this PR
          NEW_FILES=$(git diff --name-only --diff-filter=AR origin/main... -- 'src/content/posts/en-*' 'src/content/posts/es-*' 'src/content/glossario/en-*' 'src/content/glossario/es-*')

          if [ -z "$NEW_FILES" ]; then
            echo "No new EN/ES content files in this PR."
            exit 0
          fi

          echo "Checking new EN/ES files for PT slug patterns..."
          ISSUES=0

          # Words that are PT-only (not valid in EN or ES)
          PT_WORDS_COMMON="voce|dicas|financeiro|financeira|orcamento|investimentos|economizar|poupar|gastos|renda|cartao|credito|debito|previdencia"
          # Words that exist in both PT and ES — only flag for EN files
          PT_WORDS_EN_ONLY="para|como|nas|nos"

          for FILE in $NEW_FILES; do
            BASENAME=$(basename "$FILE" .md)
            # Remove locale prefix for checking
            SLUG_BODY=$(echo "$BASENAME" | sed 's/^en-//;s/^es-//')

            # Determine locale from prefix
            LOCALE_PREFIX=$(echo "$BASENAME" | grep -oP '^(en|es)' || echo "")

            if [ "$LOCALE_PREFIX" = "en" ]; then
              # EN files: check all PT words including "para", "como", etc.
              FULL_PT_WORDS="$PT_WORDS_EN_ONLY|$PT_WORDS_COMMON"
              if echo "$SLUG_BODY" | grep -qE "($FULL_PT_WORDS)"; then
                echo "  ❌ $FILE — slug contains PT words"
                ISSUES=$((ISSUES + 1))
              fi
            else
              # ES files: only check PT-exclusive words (skip "para", "como" etc.)
              if echo "$SLUG_BODY" | grep -qE "($PT_WORDS_COMMON)"; then
                echo "  ❌ $FILE — slug contains PT words"
                ISSUES=$((ISSUES + 1))
              fi
            fi
          done

          if [ $ISSUES -gt 0 ]; then
            echo ""
            echo "⚠️ $ISSUES file(s) have PT words in EN/ES slug."
            echo "Slugs should be derived from the translated title."
            echo "Check that your generator script uses createSlug(translatedTitle)."
            exit 1
          fi

          echo "✅ All new EN/ES files have proper locale slugs."

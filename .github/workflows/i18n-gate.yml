name: "i18n Gate (PR Check)"

on:
  pull_request:
    paths:
      - 'src/content/posts/**'
      - 'src/content/glossario/**'
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/content/glossario/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # necessário para git diff contra base ref / before SHA

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Guard de capas — SEGUNDA linha de defesa, para PR e push HUMANO.
      # A defesa PRINCIPAL e a auditoria diaria no i18n-sync.yml: este gate NAO
      # dispara nos pushes dos bots (feitos com GITHUB_TOKEN), medido em
      # 28/07/2026 — 6 runs em toda a vida, todos humanos. Nao contar com este
      # passo para apanhar conteudo gerado por automacao.
      #
      # Colocado LOGO a seguir ao npm ci de proposito: se ficasse depois das
      # validacoes i18n, uma delas vermelha (como esta hoje) saltava este passo
      # e o alarme calava-se. Aqui ele fala sempre.
      #
      # Seguro: este workflow nao tem passo de push (nao descarta conteudo) e
      # `validate:capas` esta FORA do `build` e do `validate:i18n` — os 20
      # workflows que chamam validar-i18n.js por caminho e o deploy do
      # Cloudflare Pages nao ganham motivo novo para morrer.
      - name: Validate post/glossary covers exist on disk
        env:
          CAPA_GUARD_BLOCKING: '1'
        run: npm run validate:capas

      # O guard de âncora local compara cada arquivo alterado com a SUA versão na
      # base. Por isso este passo publica DUAS coisas: a base resolvida
      # (ANCHOR_BASE_REF) e o inventário do que mudou (ANCHOR_STRICT_FILES).
      #
      # O inventário vai em `--name-status -M` e NÃO em `--name-only`: o status
      # distingue arquivo novo (A, sem base) de alterado (M), e o -M entrega o
      # caminho ANTIGO dos renomeados — sem isso, renomear um post faria todo o
      # seu conteúdo legado passar por conteúdo novo. Quem interpreta essas
      # linhas é o validador, num sítio só; aqui não se decide nada sobre âncoras.
      #
      # Sem base confiável (primeiro push, branch nova, force-push, merge-base
      # indisponível) as duas variáveis saem vazias e o guard degrada para
      # WARNING puro — nunca bloqueia por falta de informação.
      - name: Compute changed content files (anchor strict scope)
        run: |
          set +e
          BASE_SHA=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1
            # merge-base explícito = mesmo conjunto que `origin/base...HEAD`, mas
            # devolve o SHA, que é o que o validador precisa para ler a base.
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null)
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              # Pode não existir mais (force-push): rev-parse decide.
              BASE_SHA=$(git rev-parse --verify --quiet "$BEFORE^{commit}" 2>/dev/null)
            fi
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "Sem base de diff confiavel -> guard em WARNING puro (nao bloqueia)."
            CHANGED=""
          else
            echo "Base de comparacao: $BASE_SHA"
            CHANGED=$(git -c core.quotePath=false diff --name-status -M --diff-filter=AMR "$BASE_SHA" HEAD -- src/content/posts src/content/glossario 2>/dev/null)
          fi

          echo "Arquivos estritos (novos/alterados):"; echo "$CHANGED"
          {
            echo "ANCHOR_BASE_REF=$BASE_SHA"
            echo 'ANCHOR_STRICT_FILES<<__ANCHOR_EOF__'
            echo "$CHANGED"
            echo '__ANCHOR_EOF__'
          } >> "$GITHUB_ENV"

      - name: Run i18n validation
        run: npm run validate:i18n:sync

      - name: Validate slug language (EN/ES sem palavras PT)
        run: npm run validate:slugs

      - name: Check new files for PT slug patterns
        run: |
          # Get list of new/renamed EN/ES content files in this PR
          NEW_FILES=$(git diff --name-only --diff-filter=AR origin/main... -- 'src/content/posts/en-*' 'src/content/posts/es-*' 'src/content/glossario/en-*' 'src/content/glossario/es-*')

          if [ -z "$NEW_FILES" ]; then
            echo "No new EN/ES content files in this PR."
            exit 0
          fi

          echo "Checking new EN/ES files for PT slug patterns..."
          ISSUES=0

          # Words that are PT-only (not valid in EN or ES)
          PT_WORDS_COMMON="voce|dicas|financeiro|financeira|orcamento|investimentos|economizar|poupar|gastos|renda|cartao|credito|debito|previdencia"
          # Words that exist in both PT and ES — only flag for EN files
          PT_WORDS_EN_ONLY="para|como|nas|nos"

          for FILE in $NEW_FILES; do
            BASENAME=$(basename "$FILE" .md)
            # Remove locale prefix for checking
            SLUG_BODY=$(echo "$BASENAME" | sed 's/^en-//;s/^es-//')

            # Determine locale from prefix
            LOCALE_PREFIX=$(echo "$BASENAME" | grep -oP '^(en|es)' || echo "")

            if [ "$LOCALE_PREFIX" = "en" ]; then
              # EN files: check all PT words including "para", "como", etc.
              FULL_PT_WORDS="$PT_WORDS_EN_ONLY|$PT_WORDS_COMMON"
              if echo "$SLUG_BODY" | grep -qE "($FULL_PT_WORDS)"; then
                echo "  ❌ $FILE — slug contains PT words"
                ISSUES=$((ISSUES + 1))
              fi
            else
              # ES files: only check PT-exclusive words (skip "para", "como" etc.)
              if echo "$SLUG_BODY" | grep -qE "($PT_WORDS_COMMON)"; then
                echo "  ❌ $FILE — slug contains PT words"
                ISSUES=$((ISSUES + 1))
              fi
            fi
          done

          if [ $ISSUES -gt 0 ]; then
            echo ""
            echo "⚠️ $ISSUES file(s) have PT words in EN/ES slug."
            echo "Slugs should be derived from the translated title."
            echo "Check that your generator script uses createSlug(translatedTitle)."
            exit 1
          fi

          echo "✅ All new EN/ES files have proper locale slugs."

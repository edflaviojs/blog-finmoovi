name: YouTube — Testar SÓ a narração (passagem 1)

# TESTE ISOLADO da PASSAGEM 1 (IMPLEMENTACAO20 §19): gera apenas o TEXTO falado
# do Short e imprime no log, para o dono ler e julgar a coerência.
#
# NÃO renderiza, NÃO envia ao YouTube, NÃO commita nada, NÃO consome tema da fila
# (o tracking só é escrito no upload). Custo: uma chamada de IA (~15s).
#
# Existe porque o pipeline de produção obriga a publicar para gerar roteiro novo —
# e o dono precisa avaliar o texto ANTES de qualquer vídeo ir ao ar.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Termo do glossário (ex: juros-compostos) ou EDITORIAL:<id>'
        required: false
        default: 'juros-compostos'

jobs:
  narrativa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar a narração e imprimir
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/youtube/roteiro-narrativa.js --slug="${{ github.event.inputs.slug }}"

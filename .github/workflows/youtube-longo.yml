name: YouTube — Vídeo longo (semanal)

# ♦ O ROBÔ DO VÍDEO LONGO — IMPLEMENTACAO20 §44.
#
# ═══ ✅ O RELÓGIO ESTÁ LIGADO DESDE 05/08/2026 — e as duas razões que o travavam ═══
#
#   1. **Não se sabia quanto tempo dez mil fotogramas demoram na nuvem.** No portátil do
#      dono o render foi morto TRÊS vezes (§43.6), e ligar um relógio a um trabalho de
#      duração desconhecida é assinar um cheque em branco.
#      ✅ **MEDIDO em 04/08: 36 minutos do princípio ao fim**, dos quais 14 a fazer o
#      vídeo — oito vezes menos do que as 5 horas de tecto. Razão resolvida.
#   2. 🔴 **COLISÃO DE DATAS.** O primeiro vídeo (`sair-do-vermelho`) é subido À MÃO pelo
#      dono e estreia **domingo 09/08 às 19h00 do Brasil**. Com o relógio ligado numa
#      quarta-feira, a primeira corrida cairia em **sábado 08/08** e marcaria OUTRO vídeo
#      para o MESMO domingo, à mesma hora.
#      ✅ **RESOLVIDA, e não por esperar por segunda-feira.** Esperar resolve uma vez e
#      deixa a armadilha armada; a regra que ficou vale para sempre: **UM DIA, UM VÍDEO**.
#      O robô confere, ANTES de trabalhar, se o domingo em causa já tem dono — e se tiver,
#      desiste em silêncio. É por isso que a corrida de sábado 08 não vai fazer nada, e a
#      de sábado 15 vai. Ver `estreiaOcupada` em `upload-longo.js`.
#
# ═══ QUANDO SE LIGAR: SÁBADO, PRIVADO, COM A ESTREIA MARCADA ═══
# O relógio a usar é `0 2 * * 6` — sábado às 02:00 universais (23h00 de sexta no Brasil).
# ⚠️ **A hora foi escolhida, não sorteada:** o relógio do GitHub neste repositório já
# atrasou **112 minutos** (medido — memória `blog-workflows-infra`), e a carga concentra-se
# entre as 05:00 e as 12:00 universais, onde estão 50 agendamentos. Às 02:00 não está lá
# quase ninguém, e sobram ~20 horas de folga até à estreia.
#
# E o atraso do relógio deixa de importar, porque **quem garante o segundo exato é o
# YouTube**: o vídeo sobe privado com a estreia marcada. O dono tem um dia inteiro para o
# ver no Studio antes de ir ao ar. Ver o cabeçalho de `upload-longo.js`.
#
# ═══ ⚠️ NADA AQUI TOCA NO ROBÔ DIÁRIO ═══
# Grupo de execução próprio (o do Short chama-se "youtube-short-daily"), fila própria,
# caderno próprio. O Short continua a produzir às 06:30 e a publicar às 15:00, sem saber
# que isto existe.

on:
  workflow_dispatch:
    inputs:
      slug:
        # ⚠️ VAZIO POR OMISSÃO, e mudou de propósito. Enquanto a fila só tinha o piloto,
        # o valor por omissão era `sair-do-vermelho`. Agora que a fila tem trabalho a
        # sério, esse valor mandaria um disparo à mão refazer um vídeo que JÁ FOI AO AR.
        # Vazio, quem escolhe é a fila — o mesmo que o relógio faz.
        description: 'Qual vídeo (o nome curto). Deixe VAZIO para o robô escolher o próximo da fila.'
        required: false
        default: ''
      gerar:
        description: 'Escrever um guião NOVO (gasta IA). Desligado = usa o guião que já está no repositório.'
        type: boolean
        required: false
        default: false
      publicar:
        description: '⚠️ Subir ao YouTube (privado, com a estreia marcada). Desligado = só faz o vídeo e guarda-o aqui.'
        type: boolean
        required: false
        default: false
  schedule:
    # ✅ LIGADO EM 05/08/2026, por ordem do dono, depois de a corrida na nuvem ter sido
    # medida: 36 minutos do princípio ao fim, dos quais 14 a fazer o vídeo.
    # Sábado às 02:00 universais = sexta às 23h00 no Brasil.
    - cron: '0 2 * * 6'
    #
    # 🔴 AS DUAS REPESCAGENS — 09/08/2026, e existem por uma razão medida.
    #
    # A PRIMEIRA corrida automática deste robô, sábado 08/08, **falhou**. Não havia
    # segunda oportunidade: o canal ficou sem vídeo longo ao domingo e o dono só
    # descobriu ao abrir o Studio no dia seguinte. Uma corrida por semana significa que
    # qualquer tropeção — a IA, a cota, uma pane do GitHub — custa a semana inteira.
    #
    # ⚠️ **NÃO É PRECISA LÓGICA NENHUMA NOVA, e é isso que as torna seguras.** O passo
    # "Conferir que o domingo da estreia está livre" já pergunta ao YouTube antes de
    # gastar um cêntimo: se a corrida da sexta correu bem, o domingo tem dono e a
    # repescagem desiste em silêncio (código 78, sucesso). Só trabalha se não houver
    # vídeo — que é exactamente a definição de repescagem.
    #
    # ⚠️ **AS HORAS FORAM ESCOLHIDAS PELA MARGEM ATÉ À ESTREIA**, que é às 22:00
    # universais de domingo. O vídeo leva ~56 min a fazer, e o relógio do GitHub neste
    # repositório já atrasou 112 min (memória `blog-workflows-infra`). Às 12:00 sobram
    # 34 horas; às 18:00 sobram 28. A última ainda acaba com folga de horas, não de
    # minutos — pôr a última às 20:00 seria apostar em que nada atrasa.
    - cron: '0 12 * * 6'   # sábado 09h00 no Brasil — 1ª repescagem
    - cron: '0 18 * * 6'   # sábado 15h00 no Brasil — última oportunidade

permissions:
  contents: write

# Grupo PRÓPRIO — nunca o "youtube-short-daily" do robô diário.
concurrency:
  group: youtube-longo-${{ github.event.inputs.slug || 'semanal' }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    # ⚠️ São ~10 mil fotogramas. O teto do GitHub para um trabalho é de 6 horas; 5 dá
    # folga e ainda avisa em vez de ficar pendurado.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ ESTE FICHEIRO VIVE NO RAMO PRINCIPAL, MAS O CÓDIGO DO VÍDEO LONGO NÃO (ainda).
      #
      # O GitHub só mostra o botão de arrancar um robô se o ficheiro dele existir no ramo
      # principal — e depois deixa escolher de que ramo se corre. Só que o botão vem com o
      # ramo principal já escolhido, e é fácil carregar sem trocar.
      #
      # Sem esta guarda, isso daria um erro obscuro dez passos mais à frente. Com ela, dá
      # uma frase que diz o que fazer. É a lição de 02/08 (o robô que não arrancava): um
      # programa que morre sem explicar porquê custa dias.
      - name: Conferir que este ramo tem o código do vídeo longo
        run: |
          if [ ! -f "src/scripts/youtube/upload-longo.js" ]; then
            echo "::error::Este ramo ($GITHUB_REF_NAME) não tem o código do vídeo longo."
            echo ""
            echo "  O que aconteceu: só a INSTRUÇÃO do robô está no ramo principal; o"
            echo "  código vive no ramo de trabalho \"video-longo-04-08\"."
            echo ""
            echo "  O que fazer: carregar outra vez em \"Run workflow\" e, na caixa do ramo,"
            echo "  escolher \"video-longo-04-08\" em vez do ramo principal."
            exit 1
          fi
          echo "✅ o ramo $GITHUB_REF_NAME tem o código do vídeo longo."

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # ⚠️ O SOM DO VÍDEO LONGO É COSTURADO COM O ffmpeg, E NÃO PELO RENDER.
      # É ele que deita fora as 2048 amostras de atraso do princípio de cada parte — o
      # defeito que fazia a música parecer que "cortava" (§42.1). Sem ffmpeg, o render
      # cai no método antigo e o vídeo sai com um buraco em cada capítulo, **sem falhar**.
      # Por isso confirma-se que existe, em vez de se assumir.
      #
      # 🔴 MEDIDO EM 04/08: **o ffmpeg NÃO existe na máquina da nuvem.** A 1ª corrida
      # escreveu, com estas palavras, *"ffmpeg em falta — a instalar"*. Sem este passo o
      # render caía no método antigo **sem falhar** e o vídeo saía com um buraco de som em
      # cada capítulo — o defeito que custou um dia inteiro a caçar.
      #
      # 🔴 E MEDIDO NA 2ª CORRIDA: a instalação levou **22 segundos** na primeira e ficou
      # **presa mais de 10 minutos** na segunda, com o código exatamente igual. É o
      # instalador da máquina da nuvem a pendurar-se — acontece, e não é nosso.
      # Portanto: tempo máximo em tudo (nada aqui pode ficar pendurado para sempre),
      # tenta-se instalar SEM a atualização da lista primeiro (que é a parte que se
      # pendura, e quase nunca é precisa), e só se isso falhar é que se atualiza.
      # ⚠️ E no fim confere-se que o ffmpeg RESPONDE — nunca o código de saída do apt.
      - name: Garantir o ffmpeg (o costureiro do som)
        run: |
          set -uo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg já cá está."
          else
            echo "ffmpeg em falta — a instalar (sem atualizar a lista, que é o que se pendura)."
            sudo timeout 300 apt-get install -y -qq ffmpeg || {
              echo "::warning::não deu à primeira — a atualizar a lista e a tentar outra vez."
              sudo timeout 300 apt-get update -qq || true
              sudo timeout 600 apt-get install -y -qq ffmpeg || true
            }
          fi
          # ⚠️ CONFERIR O RESULTADO, NUNCA O CÓDIGO DE SAÍDA — regra da casa.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::error::o ffmpeg não ficou instalado. Sem ele o vídeo sairia com um buraco de som em cada capítulo, e SEM SE QUEIXAR. A corrida para aqui."
            exit 1
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Instalar dependências (blog)
        run: npm ci

      # ⚠️ **UM DIA, UM VÍDEO** — e esta pergunta vem ANTES de tudo o que custa.
      #
      # Fazer o vídeo leva 36 minutos e uma corrida de IA. Descobrir no fim que o domingo
      # já era de outro vídeo seria deitar fora os 36 minutos — e a corrida seguinte só
      # cabe na semana a seguir. Isto responde em milissegundos, lendo o caderno.
      #
      # Dois vídeos do mesmo canal a estrear no mesmo domingo competem um com o outro na
      # lista de quem se inscreveu, por isso o dia é a régua — não a hora.
      # ⚠️ Num disparo à mão isto NÃO trava: quem carrega no botão sabe o que quer, e há
      # sempre `--publicar-em` para escolher outra data.
      #
      # ⚠️ **LEVA AS CHAVES DO YOUTUBE, e é isso que torna a regra honesta.** O caderno
      # guarda a INTENÇÃO; quem sabe a verdade é o YouTube. Um dia reservado por um vídeo
      # que entretanto foi tornado público **não está ocupado** — e sem esta pergunta o
      # canal perdia uma semana por causa de uma linha que já não era verdade.
      - name: Conferir que o domingo da estreia está livre
        id: data
        if: github.event_name == 'schedule'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set +e
          node src/scripts/youtube/upload-longo.js --conferir-estreia
          CODE=$?
          set -e
          if [ "$CODE" = "78" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != "0" ]; then echo "❌ a conferência da data falhou (código $CODE)"; exit "$CODE"; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ⚠️ O ROBÔ ALIMENTA-SE SOZINHO, MAS SÓ QUANDO TEM FOME.
      #
      # Ordem do dono (05/08): *"quero continuar usando a fonte que criamos da pesquisa da
      # api do youtube… quero que busque os mais virais e crie tudo com base nisso"*.
      #
      # O detetive de tendências já corre todos os dias às 04:00 e guarda os dez vídeos
      # LONGOS de finanças mais vistos dos últimos 60 dias — uma lista que até hoje ninguém
      # lia. É dela que saem os temas.
      #
      # ⚠️ **Só se procura tema quando a fila está vazia**, e é de propósito: encher a fila
      # todas as semanas era passar a perseguir o que estava a bombar há dois meses — o
      # mesmo defeito que fez o detetive passar de semanal a diário.
      - name: Escolher o vídeo da semana (e procurar temas se a fila estiver vazia)
        id: escolher
        env:
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          # ⚠️ Se o domingo já tinha dono, tudo o que vem a seguir é desnecessário. Este
          # passo é o único portão que os passos seguintes olham, por isso a decisão da
          # data passa por aqui — dois interruptores diferentes seriam duas coisas para
          # alguém se esquecer de ligar.
          if [ "${{ steps.data.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SLUG="${{ github.event.inputs.slug }}"
          if [ -z "$SLUG" ]; then
            # ⚠️ Fila vazia devolve 78 e isso é SUCESSO, não avaria. Mesmo rito do Short.
            set +e
            SLUG="$(node src/scripts/youtube/pick-next-longo.js)"
            CODE=$?
            if [ "$CODE" = "78" ]; then
              echo "📭 fila vazia — a procurar temas no que está a bombar."
              node src/scripts/youtube/temas-longo.js
              SLUG="$(node src/scripts/youtube/pick-next-longo.js)"
              CODE=$?
            fi
            set -e
            if [ "$CODE" = "78" ]; then
              echo "📭 continua sem temas (nem os virais deram nada que sirva) — nada a fazer hoje."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CODE" != "0" ]; then echo "❌ a fila falhou (código $CODE)"; exit "$CODE"; fi
          fi
          echo "🎬 vídeo da semana: $SLUG"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ⚠️ A FILA TEM DE FICAR GUARDADA MESMO QUE O RESTO FALHE.
      # Se os temas novos não forem gravados aqui, a corrida seguinte volta a lê-los dos
      # mesmos virais, paga a IA outra vez e cria temas repetidos com outro nome — porque
      # a dedup é feita contra o que está na fila. Guardar custa segundos.
      #
      # ═══ 🔴 E DESDE 25/08/2026 ELE TAMBÉM **RESERVA O TEMA E O DOMINGO** ═══
      #
      # ═══ O QUE ISTO CONSERTA, MEDIDO NAS CORRIDAS REAIS ═══
      # Até aqui, a única marca de *"este tema já foi feito"* era escrita no **último
      # passo** desta corrida — depois de 40 minutos de trabalho e da subida ao YouTube.
      # Em 15/08 esse passo falhou (o empurrão foi recusado três vezes, com o vídeo já em
      # cima). Resultado: **o vídeo ficou no ar e o robô nunca soube.** Escolheu o mesmo
      # tema na semana seguinte, e na outra. Três domingos com a mesma história e a mesma
      # capa, e o dono a descobri-lo no Studio.
      #
      # ⚠️ **A cura não é empurrar melhor no fim: é marcar no princípio.** Aqui a corrida
      # ainda não gastou um cêntimo. Se a marca não conseguir ser gravada, perde-se uma
      # corrida barata — em vez de se subir um vídeo que ninguém anota.
      #
      # ⚠️ **UM COMMIT SÓ, e é de propósito.** Dois passos a empurrar são duas corridas a
      # disputar o mesmo ramo, e já se perderam 19 ficheiros nesta casa por causa disso
      # (memória `blog-deploy-parado-por-link-do-robo`). A reserva viaja com os temas.
      #
      # ⚠️ **A reserva não é uma publicação** — não leva `videoId`, e por isso o guarda
      # ignora-a e a subida no fim preenche-a. E **expira sozinha** se o domingo passar
      # sem vídeo, para que uma corrida morta a meio não faça o tema desaparecer da fila
      # em silêncio. Ver `reservaAindaVale` em `pick-next-longo.js`.
      - name: Reservar o tema e o domingo, e guardar os temas novos na fila
        if: steps.escolher.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node src/scripts/youtube/upload-longo.js --reservar --slug="$SLUG"
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-longos.json .github/data/youtube-longos-published.json
          if git diff --staged --quiet; then
            echo "Nada de novo (nem temas, nem reserva por escrever)."
          else
            git commit -m "chore: reserva do video longo $SLUG (e temas novos, se houver) [skip ci]"
            bash .github/scripts/empurrar.sh
          fi

      # ── 1. O GUIÃO ────────────────────────────────────────────────────────────
      #
      # 🔴 **ESTE PASSO ESTAVA A OLHAR PARA O INTERRUPTOR ERRADO, e com o relógio ligado
      # isso partia o robô todas as semanas.** A condição era *"só quando se pede"* — e um
      # relógio não pede nada. Numa corrida automática, o interruptor vem vazio, o guião
      # nunca era escrito, e o passo seguinte parava a dizer que não havia guião. **O robô
      # teria falhado todos os sábados, e a mensagem apontaria para o sítio errado.**
      #
      # A regra certa não é "quando se pede": é **quando falta**. Um tema novo nunca tem
      # guião — escreve-se. Um tema que já foi escrito não se paga duas vezes. É a mesma
      # ideia das partes do render que ficam no disco.
      # 🔴 ORDEM DO DONO, 09/08/2026: *"se existe algum bloqueio ele pula para o próximo
      # tema… mas nunca parar e não gerar o vídeo"*.
      #
      # A corrida automática de 08/08 morreu aqui: o modelo não conseguiu escrever um
      # mapa que passasse, o passo ficou vermelho, e o canal ficou sem vídeo ao domingo.
      # As travas de dentro já não desistem (ver `consertarMapa`); esta é a rede de fora,
      # para o caso de FALTAR a matéria-prima — e aí o remédio não é insistir no mesmo
      # tema, é pegar no seguinte da fila.
      #
      # ⚠️ **TRÊS TEMAS, E NÃO MAIS.** Cada volta custa uma corrida de IA inteira. Se
      # três temas seguidos não dão um guião, o problema não é o tema: é o pedido ou a
      # chave, e insistir só gasta a cota que amanhã faz falta.
      #
      # ⚠️ **Nada marca o tema como reprovado.** O `--saltar` vale só nesta corrida; na
      # semana seguinte ele volta a ser o primeiro da fila.
      - name: Escrever o guião e montar as cenas (e trocar de tema se um travar)
        if: steps.escolher.outputs.skip != 'true'
        env:
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          set -uo pipefail
          SALTAR=""
          FEITO=""
          for VOLTA in 1 2 3; do
            echo ""
            echo "── volta $VOLTA · tema \"$SLUG\" ──"

            if [ -f "src/scripts/youtube/output/$SLUG.longo.json" ] && [ "${{ github.event.inputs.gerar }}" != "true" ]; then
              echo "♻️  o guião de \"$SLUG\" já existe — não se paga duas vezes pelo mesmo texto."
            else
              node src/scripts/youtube/pick-next-longo.js --como-argumentos --slug="$SLUG" > /tmp/tema.args
              echo "tema escolhido:"; cat /tmp/tema.args
              # ⚠️ UM ARGUMENTO POR LINHA (`-d '\n'`). Os temas trazem dois pontos, vírgulas e
              # acentos; deixar o separador por conta do espaço partiria o tema a meio — que é
              # exatamente o defeito nº 10 de §34.3, o caminho com um espaço a partir o comando.
              xargs -d '\n' -a /tmp/tema.args node src/scripts/youtube/roteiro-longo.js --slug="$SLUG" || true
            fi

            # ⚠️ A PROVA É O FICHEIRO, NUNCA O CÓDIGO DE SAÍDA — regra da casa.
            if [ -f "src/scripts/youtube/output/$SLUG.longo.json" ] \
               && node src/scripts/youtube/montar-longo.js --slug="$SLUG" \
               && [ -f "youtube-render/public/roteiro/$SLUG.json" ]; then
              FEITO="$SLUG"
              break
            fi

            echo "::warning::o tema \"$SLUG\" não deu guião — a tentar o seguinte da fila."
            SALTAR="${SALTAR:+$SALTAR,}$SLUG"
            # Um disparo à mão com tema escolhido não anda para outro: quem carregou sabe o que quer.
            if [ -n "${{ github.event.inputs.slug }}" ]; then break; fi
            PROXIMO="$(node src/scripts/youtube/pick-next-longo.js --saltar="$SALTAR")" || PROXIMO=""
            if [ -z "$PROXIMO" ]; then echo "📭 não há mais temas por tentar."; break; fi
            SLUG="$PROXIMO"
          done

          if [ -z "$FEITO" ]; then
            echo "::error::nenhum dos temas tentados deu um guião — não há vídeo esta semana. Temas: ${SALTAR:-$SLUG}"
            exit 1
          fi
          echo "SLUG=$FEITO" >> "$GITHUB_ENV"
          node -e "const p=require('./youtube-render/public/roteiro/'+process.argv[1]+'.json');console.log('✅ '+p.scenes.length+' cenas · '+p.palavras+' palavras · '+p.scenes.filter(s=>s.visual&&s.visual.tipo==='foto').length+' fotografias');" "$FEITO"

      # ── 1-b. AS CENAS E AS IMAGENS ────────────────────────────────────────────
      # ⚠️ O montador passou para DENTRO do passo de cima (09/08/2026). Ele é a primeira
      # prova de que o guião serve para alguma coisa — e se não serve, quem decide é a
      # volta seguinte do laço, trocando de tema. Separado, ele ficava vermelho sozinho e
      # ninguém trocava nada. Continua determinista, e por isso a pasta das cenas
      # continua fora do repositório: refaz-se aqui, igual, de graça.

      # ⚠️ AS PROVAS CORREM AQUI, E O SÍTIO FOI ESCOLHIDO A DOER.
      #
      # 🔴 A 1ª versão punha-as logo no princípio, e a corrida de 04/08 na nuvem morreu
      # em 46 segundos: **as 121 provas do roteiro precisam do guião JÁ MONTADO**, e num
      # clone limpo ele ainda não existe. Isso revelou uma coisa maior — **essas provas
      # nunca tinham corrido fora do portátil do dono**, onde o ficheiro estava lá por
      # acaso, de uma corrida anterior. Uma prova que só corre numa máquina é meia prova.
      #
      # Agora correm logo a seguir ao montador, que demora dois segundos — e continuam a
      # correr ANTES da voz, que é o primeiro passo que custa alguma coisa. Descobrir que
      # a hora de estreia está mal calculada depois de cinco horas de render seria deitar
      # fora cinco horas, e a corrida seguinte só cabia no dia seguinte.
      - name: As provas de mesa (não gastam nada)
        if: steps.escolher.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # ⚠️ 🔴 SETE DAS PROVAS LEEM O GUIÃO DO PILOTO JÁ MONTADO, e ele não vai para o
          # repositório (é derivado). Isto parou o robô DUAS vezes na nuvem: à primeira
          # porque as provas corriam antes de haver guião nenhum; à segunda porque eu tinha
          # tratado o sintoma — mudei-as para depois do montador e passou, **mas só porque
          # essa corrida calhou de estar a fazer o vídeo do piloto**. Com um tema novo, o
          # montador escreve o guião DESSE vídeo e o do piloto continua a não existir.
          #
          # Montá-lo custa dois segundos e é determinista (há prova disso). Sem esta linha
          # as sete provas das fotografias nunca correriam na nuvem — e são elas que
          # garantem que uma fotografia cai numa cena cujo TEXTO a chamou.
          #
          # ⚠️ E isto NÃO estraga o vídeo que está a ser feito: o montador escreve com o
          # nome do vídeo (`<nome>.json`), portanto o guião do piloto e o do vídeo da
          # semana são ficheiros diferentes e não se pisam.
          node src/scripts/youtube/montar-longo.js --slug=sair-do-vermelho > /dev/null
          # ═══ 🔴 `--sem-acervo`, E ESTA OPÇÃO CUSTOU UM DOMINGO INTEIRO ═══
          #
          # Em 22/08 as TRÊS corridas deste robô morreram exactamente aqui, e o canal
          # ficou sem vídeo no domingo 23/08. A causa não tinha nada a ver com vídeo: o
          # detetive de tendências trouxe, em 17/08, títulos de capítulo de OUTROS canais
          # (um de 15 palavras, três a começar por "Resumo"), e uma prova que os lê ficou
          # vermelha. O `set -euo pipefail` fez o resto.
          #
          # ⚠️ A régua foi endireitada em 24/08 (`0c780aeb`) — mas o CASTIGO continuava
          # errado. Estes ficheiros de `.github/data/` são enchidos todos os dias por
          # outros robôs, com material que não é nosso: a próxima surpresa vai aparecer.
          #
          # Com `--sem-acervo`, as provas do ACERVO avisam (e o aviso aparece no topo da
          # corrida) e as provas do MOTOR continuam a travar tudo, como devem. A
          # conferência diária corre as mesmas provas SEM esta opção e fica vermelha na
          # mesma — o alarme chega, o domingo não fica vazio.
          node src/scripts/validacao/validar-roteiro-longo.js --sem-acervo
          node src/scripts/validacao/validar-publicacao-longo.js --sem-acervo

      # ── 1-c. AS FOTOGRAFIAS ───────────────────────────────────────────────────
      #
      # ⚠️ **CORRE ANTES DA VOZ, e a ordem não é indiferente.** As fotografias entram no
      # guião montado, e é sobre esse guião que a voz, as legendas e o vídeo são feitos.
      # Depois da voz era tarde.
      #
      # 🔴 **A REGRA QUE NÃO SE NEGOCEIA:** uma fotografia não pode ter uma única letra
      # legível. A primeira que se gerou saiu com uma fatura EM INGLÊS E EM DÓLARES e o
      # script disse ✅ — só se viu olhando (§42.5). Por ordem do dono (05/08), isso deixou
      # de ser uma regra escrita e passou a ser MEDIDA: instala-se um leitor de texto e a
      # máquina lê a imagem. Se ler letras numa fotografia, ela é recusada; e no cartaz faz
      # o contrário — confirma que o número é o do caderno.
      #
      # ⚠️ **SEM A CHAVE DA MANUS, ISTO NÃO FALHA — SALTA.** O vídeo sai sem fotografias,
      # que é exatamente o que acontece hoje. Um robô que fica vermelho por causa de uma
      # coisa que ainda não foi ligada ensina toda a gente a ignorar os avisos.
      - name: As fotografias (só se houver chave da Manus)
        if: steps.escolher.outputs.skip != 'true'
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          # ═══ 🔴 A SEGUNDA CONTA DA MANUS — 10/08/2026, ordem do dono ═══
          #
          # A Manus era **o único ponto do vídeo longo sem plano B**. Medido no dia: o
          # saldo estava em **-2** e não saía uma única imagem. Numa sexta às 23h isso é o
          # vídeo da semana a subir sem capa e sem fotografias, com a corrida a verde e
          # ninguém a saber até abrir o Studio.
          #
          # ⚠️ **A conta 1 gasta-se até secar, e só então entra a 2** (decisão do dono).
          # A escolha é feita pelo programa, imagem a imagem, e cada tarefa fica agarrada
          # à conta que a criou — ver o cabeçalho de `lib/manus-client.js`.
          #
          # ⚠️ **Se o segredo não existir, não falha nada:** a lista fica com uma conta e
          # o comportamento é exactamente o de antes.
          MANUS_API_KEY_2: ${{ secrets.MANUS_API_KEY_2 }}
        run: |
          set -uo pipefail
          if [ -z "${MANUS_API_KEY:-}" ] && [ -z "${MANUS_API_KEY_2:-}" ]; then
            echo "::warning::não há chave nenhuma da Manus nos segredos — este vídeo sai SEM fotografias."
            echo "  Para as ligar: criar o segredo MANUS_API_KEY no GitHub (e MANUS_API_KEY_2 para a reserva)."
            exit 0
          fi
          if [ -z "${MANUS_API_KEY_2:-}" ]; then
            echo "::notice::só há uma conta da Manus ligada. Sem reserva, um saldo esgotado é um vídeo sem imagens."
          fi
          echo "🔤 a instalar o leitor de texto (é ele que recusa uma fotografia com letras)…"
          sudo timeout 300 apt-get install -y -qq tesseract-ocr tesseract-ocr-por || {
            sudo timeout 300 apt-get update -qq || true
            sudo timeout 600 apt-get install -y -qq tesseract-ocr tesseract-ocr-por || true
          }
          # ⚠️ CONFERIR O RESULTADO. Sem leitor, o programa recusa-se a aceitar fotografias
          # — e é melhor assim: a regra das letras não se pode garantir sem as ler.
          if ! command -v tesseract >/dev/null; then
            echo "::warning::o leitor de texto não ficou instalado — o vídeo sai sem fotografias."
            exit 0
          fi
          tesseract --version | head -1
          # 🔴 AS FOTOGRAFIAS NUNCA PODEM MATAR A CORRIDA — 09/08/2026, ordem do dono.
          # Em 08/08 uma imagem recusada (o cartaz veio sem o número) derrubou este passo
          # e o vídeo do domingo não existiu. Uma fotografia é um ENFEITE: o vídeo sai
          # sem ela, com as ilustrações e as palavras. Sem `set -e` de propósito.
          node src/scripts/youtube/fotos-longo.js --slug="$SLUG" || \
            echo "::warning::as fotografias não correram bem — o vídeo sai sem elas, e isso é melhor do que não haver vídeo."
          # As fotografias entram no guião — portanto o montador corre outra vez, agora
          # com elas. É determinista: o resto do vídeo sai exatamente igual.
          # ⚠️ Se ele falhar aqui, o guião ANTERIOR (sem fotografias) fica de pé e o
          # vídeo faz-se com ele. Por isso também não trava.
          node src/scripts/youtube/montar-longo.js --slug="$SLUG" || \
            echo "::warning::o montador não gostou das fotografias — fica o guião de antes delas."

      # ── 1-c-bis. OS DESENHOS DE CADA CENA ─────────────────────────────────────
      #
      # 🔴 **70% DO VÍDEO ERA LETRA NA TELA — 10/08/2026, queixa do dono.**
      #
      # Palavras dele: *"Esses trechos só têm letras, não tem socos, não tem mudança de
      # imagens, isso é ponto de fuga dos espectadores… quero cenas mudando toda hora."*
      # Medido no vídeo desse dia: 70% do tempo em `palavras` contra 6% em ilustração, e
      # os dois piores buracos (30s e 27s sem nada) eram os dois cenas de `palavras`.
      #
      # ⚠️ **A escolha da figura era por palavra-gatilho e não escalava.** Abriram-se as
      # 33 figuras (só 14 tinham pista) e subiu-se o teto de 6 para 14: o vídeo passou de
      # 3 ilustrações para 5, em 55 cenas. Com o leitor de IA a escolher pelo SIGNIFICADO
      # (que já estava escrito em `METAPHOR_MEANINGS`), passou a 11 — 70% → 55% de letra.
      #
      # ⚠️ **VEM DEPOIS DAS FOTOGRAFIAS, e a ordem importa:** o ilustrador só olha para as
      # cenas que sobraram em `palavras`, e as fotografias já tiraram as delas. Ao
      # contrário, ele escolheria desenho para cenas que iam levar fotografia.
      #
      # ⚠️ **E O MONTADOR CORRE OUTRA VEZ A SEGUIR** — é ele que põe os desenhos no guião.
      # Continua determinista: quem paga a IA é este passo, que escreve um ficheiro; o
      # montador só lê. É a mesma forma das fotografias.
      #
      # 🔴 **NUNCA MATA A CORRIDA.** Sem chave, sem resposta, ou com resposta estragada, o
      # vídeo sai com as pistas escritas à mão. Menos desenhos > vídeo nenhum.
      - name: Os desenhos de cada cena (o leitor escolhe pelo significado)
        if: steps.escolher.outputs.skip != 'true'
        env:
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          set -uo pipefail
          node src/scripts/youtube/ilustrador-longo.js --slug="$SLUG" || \
            echo "::warning::o ilustrador não correu bem — o vídeo sai com as pistas escritas à mão."
          node src/scripts/youtube/montar-longo.js --slug="$SLUG" || \
            echo "::warning::o montador não gostou dos desenhos — fica o guião de antes deles."
          # ⚠️ CONFERIR O RESULTADO, NUNCA O CÓDIGO DE SAÍDA. É esta linha que diz, em
          # texto, quanto do vídeo ficou em letra na tela — o número da queixa do dono.
          node -e "const p=require('./youtube-render/public/roteiro/'+process.argv[1]+'.json');const c=p.scenes.reduce((a,s)=>{const k=(s.visual&&s.visual.tipo)||'?';a[k]=(a[k]||0)+1;return a;},{});const tot=p.scenes.length;console.log('🎨 '+(c.ilustracao||0)+' ilustrações · '+(c.palavras||0)+'/'+tot+' cenas só com letra ('+Math.round((c.palavras||0)/tot*100)+'%)');" "$SLUG"

      # ── 1-d. A CAPA ───────────────────────────────────────────────────────────
      #
      # 🔴 **O PROGRAMA DA CAPA EXISTIA E NINGUÉM O CHAMAVA — 10/08/2026.**
      #
      # ═══ O DEFEITO, E ELE NÃO SE QUEIXAVA ═══
      # `capa-manus.js` está escrito, testado e dinâmico desde 09/08 (seis moldes, a cena
      # tirada da metáfora do vídeo, o título tirado da fila). **Mas nenhum workflow deste
      # repositório o corria** — foi conferido com `grep capa-manus .github/workflows/`,
      # que não devolvia uma única linha. Todas as capas até hoje foram feitas à mão.
      #
      # Consequência, e é a pior espécie: o vídeo subia **sem miniatura própria**, o
      # YouTube escolhia um fotograma sozinho, e a corrida acabava **a verde**. O dono só
      # descobriria abrindo o Studio — que foi exactamente como se descobriu o domingo
      # sem vídeo (§64). Ver o aviso de `acharCapa` em `upload-longo.js`: sem capa, ele
      # escreve *"(FALTA — o vídeo subiria sem miniatura própria)"* e sobe à mesma.
      #
      # ⚠️ **VEM DEPOIS DAS FOTOGRAFIAS E ANTES DO COMMIT, e o sítio não é indiferente.**
      # A capa é escrita em `youtube-render/public/manus/<slug>/capa-<molde>.jpg`, que já
      # está no `git add` do passo seguinte — portanto entra no MESMO commit das
      # fotografias. Um passo próprio a empurrar seria uma segunda corrida a disputar o
      # ramo, e é assim que se perdem ficheiros nesta casa.
      #
      # ⚠️ **E O MOLDE ESCOLHIDO FICA GRAVADO** no `longo-cenarios.json` (o mesmo caderno
      # das cenas), que é o que faz o molde RODAR de vídeo para vídeo. Se este passo
      # corresse depois do commit, o caderno aprenderia na nuvem e morreria com ela.
      #
      # 🔴 **NUNCA MATA A CORRIDA** — regra do dono, 09/08: uma capa é um enfeite caro,
      # mas um vídeo sem capa continua a ser um vídeo, e um vídeo que não existe não é
      # nada. Sem chave da Manus, salta em silêncio, como as fotografias.
      # ═══ 🔴 JÁ NÃO É "SÓ SE HOUVER CHAVE DA MANUS" — 29/08/2026 ═══
      #
      # Queixa do dono: *"Mais uma vez a capa do vídeo longo do youtube sai iguais às
      # anteriores… já vão quase 1 mês e isso não se resolve"*. A causa não era o
      # programa que escolhe a capa — esse escolheu molde "a-queda" e metáfora
      # "balde-furado", tudo diferente do vídeo anterior. A causa foi esta:
      #
      #     conta 1: ❌ api key has been deleted or does not exist
      #     conta 2: ❌ api key has been deleted or does not exist
      #     cabem 0 imagem(ns) ao todo
      #
      # As DUAS chaves da Manus mortas, em 24/08 e outra vez em 29/08. E este passo,
      # como estava escrito, desistia com `exit 0` — corrida verde, sem capa.
      #
      # ⚠️ **UM FORNECEDOR PAGO SOZINHO NÃO É UM PLANO, É UMA APOSTA.** Agora o programa
      # corre SEMPRE: sem Manus, a Cloudflare desenha a arte (é o mesmo desenhista que faz
      # as capas do blog todos os dias) e o texto é escrito por nós com o `sharp`. Ver
      # `src/scripts/youtube/lib/capa-cloudflare.js`.
      - name: A capa do YouTube (Manus, e a Cloudflare como plano B)
        if: steps.escolher.outputs.skip != 'true'
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          # ⚠️ A conta de reserva — ver a nota no passo das fotografias. Tem de estar
          #    nos DOIS passos: as variáveis de ambiente não passam de um passo para o
          #    outro, e a capa é feita depois das fotografias, que é exactamente quando a
          #    conta 1 tem mais hipóteses de já estar seca.
          MANUS_API_KEY_2: ${{ secrets.MANUS_API_KEY_2 }}
          # O plano B. São os MESMOS segredos que os robôs do blog já usam para as capas
          # dos posts — não há chave nova para ninguém criar.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          # A IA de visão que recusa arte borrada ou com letras tortas, antes de lhe
          # escrevermos o título por cima. Sem ela o guardião fica cego, avisa, e deixa
          # passar — que é a regra certa: não se recusa às cegas.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${MANUS_API_KEY:-}" ] && [ -z "${MANUS_API_KEY_2:-}" ]; then
            echo "::warning::não há chave nenhuma da Manus nos segredos — a capa vai pelo plano B (Cloudflare)."
          fi
          node src/scripts/youtube/capa-manus.js --slug="$SLUG" --so=capa || \
            echo "::warning::a capa não saiu — o vídeo sobe sem miniatura própria, e isso é melhor do que não haver vídeo."
          # ═══ 🔴 A PERGUNTA MUDOU, E ERA ELA O DEFEITO ═══
          #
          # Isto perguntava `ls .../capa-*.jpg` — ou seja, "há um ficheiro de capa na
          # pasta?". Em 24/08 a resposta foi SIM e estava certa: havia lá uma
          # `capa-canal-youtube.jpg` feita à mão em Agosto. O vídeo subiu com ela, pela
          # terceira vez, e este passo escreveu "✅ capa:".
          #
          # A pergunta certa é "esta corrida DESENHOU uma capa?", e quem responde é o
          # recibo — escrito só quando uma capa nova fica em disco, e fora do repositório
          # de propósito (ver .gitignore).
          if [ -f "youtube-render/public/manus/$SLUG/capa-de-hoje.json" ]; then
            echo "✅ capa desenhada nesta corrida:"
            cat "youtube-render/public/manus/$SLUG/capa-de-hoje.json"
            echo "CAPA_DE_HOJE=sim" >> "$GITHUB_ENV"
          else
            echo "CAPA_DE_HOJE=nao" >> "$GITHUB_ENV"
            echo "::warning::NENHUMA capa foi desenhada nesta corrida — nem pela Manus, nem pelo plano B. Se houver um ficheiro antigo na pasta, o vídeo sobe com a miniatura da semana passada."
          fi

      # 🔴 O CADERNO DE CENAS TEM DE SAIR DAQUI GRAVADO — 09/08/2026.
      #
      # ═══ O DEFEITO, MEDIDO ═══
      # O `roteiro-longo.js` escreve `.github/data/longo-cenarios.json` a cada vídeo — é
      # ele que impede o vídeo seguinte de contar a mesma cena. **Nenhum passo deste
      # robô lhe fazia `git add`.** A máquina da nuvem é deitada fora no fim da corrida,
      # portanto o caderno morria lá dentro e, na semana seguinte, o robô lia a versão
      # velha. A trava anti-repetição existia e **nunca aprendia nada**.
      #
      # ⚠️ **É O MESMO PASSO DAS FOTOGRAFIAS DE PROPÓSITO.** Dois passos que gravam no
      # repositório com o mesmo `empurrar.sh` são duas corridas a disputar o mesmo ramo,
      # e já se perderam 19 ficheiros nesta casa por causa disso (memória
      # `blog-deploy-parado-por-link-do-robo`). Um commit só, uma disputa só.
      #
      # ⚠️ **E CORRE MESMO SEM CHAVE DA MANUS**, que é o caso em que não há fotografia
      # nenhuma — mas há SEMPRE caderno de cenas para gravar.
      - name: Guardar o caderno de cenas, as fotografias e o banco
        if: steps.escolher.outputs.skip != 'true'
        run: |
          # ═══ 🔴 A RESERVA DO TEMA QUE REALMENTE GANHOU — 25/08/2026 ═══
          #
          # O passo lá de cima reserva o PRIMEIRO tema da fila. Mas o passo do guião pode
          # trocar de tema pelo caminho (ordem do dono, 09/08: *"se existe algum bloqueio
          # ele pula para o próximo tema… mas nunca parar e não gerar o vídeo"*) — e aí a
          # reserva ficava no tema errado, com o tema certo por marcar.
          #
          # ⚠️ **Isto NÃO é um empurrão novo.** Vai no commit que já existe, e o sítio foi
          # escolhido: estamos a ~10 minutos de corrida e o render, que é o que custa 40,
          # ainda não começou. Dois passos a empurrar são duas corridas a disputar o mesmo
          # ramo, e já se perderam 19 ficheiros nesta casa por causa disso.
          #
          # ⚠️ E ela não apaga a primeira: o tema que travou fica reservado esta semana e
          # **volta à fila sozinho** quando o domingo passar (`reservaAindaVale`).
          node src/scripts/youtube/upload-longo.js --reservar --slug="$SLUG" || \
            echo "::warning::não deu para reservar \"$SLUG\" — o caderno é escrito no fim na mesma."
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/longo-cenarios.json .github/data/fotos-do-longo.json .github/data/banco-de-imagens.json .github/data/youtube-longos-published.json youtube-render/public/manus || true
          if git diff --staged --quiet; then
            echo "Sem novidades para guardar."
          else
            git commit -m "chore: cenas, fotografias e reserva do video longo $SLUG [skip ci]"
            bash .github/scripts/empurrar.sh
          fi

      # ── 2. A VOZ ─────────────────────────────────────────────────────────────
      # ⚠️ O tratamento de som da voz liga-se sozinho pelo FORMATO do guião (longo), e o
      # Short nunca o apanha por acidente. Ver §43.1.
      - name: A voz, e os tempos medidos palavra a palavra
        if: steps.escolher.outputs.skip != 'true'
        env:
          TOGETHER_TTS_API_KEY: ${{ secrets.TOGETHER_TTS_API_KEY }}
        run: node src/scripts/youtube/tts-short.js --slug="$SLUG"

      # ── 3. AS LEGENDAS ───────────────────────────────────────────────────────
      # ⚠️ O gerador é PRÓPRIO do longo. O do Short punha a legenda até 7,13 s adiantada
      # neste vídeo — a linha do tempo é outra (respiro, transições, cartões de capítulo).
      # Está tudo medido no cabeçalho de `srt-longo.js`.
      - name: As legendas (pt/en/es)
        if: steps.escolher.outputs.skip != 'true'
        env:
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/youtube/srt-longo.js --slug="$SLUG"

      # ── 4. A DESCRIÇÃO ───────────────────────────────────────────────────────
      # ⚠️ AS CHAVES DA IA TÊM DE ESTAR AQUI desde 06/08. A descrição deixou de ser só
      # uma lista: os três blocos de texto ("sobre", "vai aprender" e as perguntas) são
      # escritos a partir do guião. Sem as chaves, isto **não falha** — sai o texto de
      # reserva, em silêncio, todas as semanas. É o pior modo de falha desta casa.
      - name: A descrição, com os capítulos cronometrados sobre a voz real
        if: steps.escolher.outputs.skip != 'true'
        env:
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/youtube/descricao-longo.js --slug="$SLUG"

      - name: Instalar dependências (render)
        if: steps.escolher.outputs.skip != 'true'
        working-directory: youtube-render
        run: npm ci

      # ── 5. O VÍDEO ───────────────────────────────────────────────────────────
      # ⚠️ O render é por PARTES, cortadas nos limites dos capítulos, e a colagem tira o
      # som de cada parte ANTES de colar. Ele traz as suas próprias provas: conta os
      # fotogramas UM A UM (nunca acredita na duração declarada) e varre o som à procura
      # de buracos. O `--concurrency=2` já vive lá dentro.
      - name: Fazer o vídeo (~10 mil fotogramas)
        id: render
        if: steps.escolher.outputs.skip != 'true'
        working-directory: youtube-render
        run: |
          set -euo pipefail
          COMECOU=$(date +%s)
          node scripts/render-longo.mjs --slug="$SLUG"
          ACABOU=$(date +%s)
          MINUTOS=$(( (ACABOU - COMECOU) / 60 ))
          echo "MINUTOS_DO_RENDER=$MINUTOS" >> "$GITHUB_ENV"
          echo "⏱️  o vídeo levou $MINUTOS minutos a ser feito."

      # ⚠️ CONFERIR O RESULTADO, NUNCA O CÓDIGO DE SAÍDA — a regra desta casa. O render já
      # se confere a si próprio, mas quem lê isto quer o número à vista, e a MEDIÇÃO DO
      # TEMPO é a razão de ser desta primeira corrida.
      - name: O que saiu, em números
        if: steps.escolher.outputs.skip != 'true'
        run: |
          set -euo pipefail
          MP4="youtube-render/out/longo/$SLUG.mp4"
          test -f "$MP4" || { echo "❌ o vídeo não existe: $MP4"; exit 1; }
          FOTOGRAMAS=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$MP4" | tr -d '\r\n,')
          SEGUNDOS=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$MP4")
          TAMANHO=$(du -h "$MP4" | cut -f1)
          {
            echo "## 🎬 $SLUG"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| fotogramas (contados um a um) | **$FOTOGRAMAS** |"
            echo "| duração | $SEGUNDOS s |"
            echo "| tamanho | $TAMANHO |"
            echo "| **minutos que o vídeo levou a ser feito** | **$MINUTOS_DO_RENDER** |"
            echo "| legendas | $(ls youtube-render/public/audio/$SLUG/*.srt 2>/dev/null | wc -l) |"
            echo ""
            echo "> É este o número que decide se o relógio de sábado se pode ligar."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ $FOTOGRAMAS fotogramas · $SEGUNDOS s · $TAMANHO · $MINUTOS_DO_RENDER min a fazer"

      - name: Guardar o vídeo, as legendas e a descrição
        if: steps.escolher.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: longo-${{ env.SLUG }}
          path: |
            youtube-render/out/longo/${{ env.SLUG }}.mp4
            youtube-render/public/audio/${{ env.SLUG }}/*.srt
            src/scripts/youtube/output/${{ env.SLUG }}.descricao.txt
            src/scripts/youtube/output/${{ env.SLUG }}.script.json
            youtube-render/public/manus/${{ env.SLUG }}/capa-*.jpg
          # ⚠️ AS DUAS LINHAS DE CIMA ENTRARAM EM 10/08, e cada uma tapa um buraco do
          # carteiro das redes:
          #   · o `.script.json` é de onde ele tira a legenda, o gancho e os tópicos —
          #     sem ele a entrega morre logo com "não encontrei o roteiro";
          #   · a `capa-*.jpg` é a que vai ao Bluesky, que NÃO publica vídeo: sem ela,
          #     aquela rede fica de fora todas as semanas, em silêncio.
          # ⚠️ A capa pode não existir (só sai se houver chave da Manus) e o padrão fica
          # vazio — isso é AVISO, não erro: o `if-no-files-found` olha o conjunto, e o MP4
          # está sempre lá.
          if-no-files-found: error
          retention-days: 30

      # ── 6. A SUBIDA ──────────────────────────────────────────────────────────
      #
      # 🔴 **A SEGUNDA FALHA DO MESMO TIPO, E ESTA ERA A PIOR.** A condição era só
      # *"quando o interruptor de publicar está ligado"* — e num relógio ele vem vazio.
      # **O robô teria feito o vídeo todos os sábados e NUNCA o teria publicado**, com a
      # corrida a acabar a verde. Trinta e seis minutos de trabalho por semana a cair num
      # ficheiro que ninguém ia buscar, sem um único aviso.
      #
      # A regra certa: **um relógio publica sempre** (é para isso que ele existe); um
      # disparo à mão só publica se quem carregou o pedir.
      #
      # ⚠️ Sobe PRIVADO, com a estreia marcada para o próximo domingo às 19h00 do Brasil —
      # e o próprio programa confirma com o YouTube que a marcação ficou lá, porque um
      # vídeo que fica privado para sempre não se queixa a ninguém.
      - name: Subir ao YouTube (privado, com estreia marcada)
        if: steps.escolher.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.publicar == 'true')
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # ⚠️ É AQUI que a descrição que VAI AO AR é montada — o passo 4 só escreve uma
          # pré-visualização em disco. Sem estas chaves o vídeo subia com o texto de
          # reserva todas as semanas, e a corrida acabava a verde. Ver o aviso do passo 4.
          KIE_AI_KEY: ${{ secrets.KIE_AI_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node src/scripts/youtube/upload-longo.js --slug="$SLUG"

      # ⚠️ Se isto não correr, o caderno não sabe que o vídeo foi ao ar — e na semana
      # seguinte o robô voltava a escolher o mesmo tema. Anda sempre com a subida.
      # ♦ E DESDE 10/08 ELE TAMBÉM ENTRA NA FILA DAS REDES (IMPLEMENTACAO26 §15).
      #
      # Até aqui o vídeo longo subia ao YouTube e parava ali — nunca foi ligado ao
      # Multipost. Vai às QUATRO redes onde vídeo deitado e comprido é normal (Facebook,
      # LinkedIn, Telegram e Bluesky); ver `FORMATOS` em `entregar.js` para saber porque
      # não vai ao Instagram, ao Threads nem ao Pinterest.
      #
      # ⚠️ A FILA É PRÓPRIA, como a dos outros formatos. E o carteiro dela corre ao
      # DOMINGO, não hoje: o vídeo é produzido no sábado de madrugada e estreia no
      # domingo às 19h — as redes vêm depois da estreia, nunca antes.
      - name: Guardar no caderno do vídeo longo e pôr na fila das redes
        if: steps.escolher.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.publicar == 'true')
        run: |
          node src/scripts/youtube/outbox.js enqueue \
            --file-slug="$SLUG" --run-id="${{ github.run_id }}" \
            --fila=longo-redes.json
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-longos-published.json .github/data/youtube-longos.json \
                  .github/data/longo-redes.json
          if git diff --staged --quiet; then
            echo "Nada de novo no caderno."
          else
            git commit -m "chore: video longo $SLUG agendado [skip ci]"
            bash .github/scripts/empurrar.sh
          fi

      # ═══ 🔴 A CORRIDA FICA VERMELHA SE NÃO HOUVE CAPA — 29/08/2026 ═══
      #
      # Ordem do dono, depois de ver a mesma miniatura no Studio pela terceira vez:
      # *"fazer a corrida ficar VERMELHA quando o vídeo sobe sem capa"*.
      #
      # ⚠️ **É O ÚLTIMO PASSO DE TODOS, e o sítio é a parte importante.** Falhar no passo
      # da capa deitaria fora 40 minutos de render e o vídeo do domingo por causa de um
      # enfeite — o oposto da regra da casa (*"nunca parar e não gerar o vídeo"*, 09/08).
      # Aqui, o vídeo JÁ ESTÁ no YouTube com a estreia marcada e o caderno já está
      # gravado. O que esta falha faz é uma coisa só: **tocar a campainha**. O GitHub
      # manda o email da corrida vermelha, e o dono fica a saber no sábado em vez de
      # descobrir sozinho no Studio duas semanas depois.
      #
      # ⚠️ **NÃO OLHA PARA `capa-*.jpg`**, e é essa a diferença que fecha o defeito: um
      # ficheiro antigo na pasta responderia que sim. Olha para o recibo desta corrida.
      - name: 🔔 Houve capa nova neste vídeo?
        if: steps.escolher.outputs.skip != 'true'
        run: |
          if [ "${CAPA_DE_HOJE:-nao}" = "sim" ]; then
            echo "✅ este vídeo foi para o ar com uma capa desenhada hoje."
            exit 0
          fi
          echo "::error::O vídeo \"$SLUG\" foi publicado SEM capa nova. Nem a Manus nem o plano B (Cloudflare) desenharam uma miniatura nesta corrida."
          echo ""
          echo "O vídeo ESTÁ no ar e a estreia está marcada — isto não desfaz nada."
          echo "O que falta é a miniatura. Ver o passo \"A capa do YouTube\" lá em cima:"
          echo "  · \"api key has been deleted\"  → a chave da Manus morreu, é preciso uma nova"
          echo "  · \"não há desenhista nenhum ligado\" → faltam CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_AI_TOKEN nos segredos"
          echo "  · \"recusada — borrada\"        → a arte saiu má nas 3 tentativas dos 3 desenhistas"
          echo ""
          echo "Para pôr a capa à mão depois de resolver:"
          echo "  node src/scripts/youtube/capa-manus.js --slug=$SLUG --so=capa"
          exit 1

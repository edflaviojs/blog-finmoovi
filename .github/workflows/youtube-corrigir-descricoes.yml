name: YouTube — Corrigir a descrição dos vídeos já publicados

# Os 10 primeiros vídeos foram ao ar com a descrição estragada (cortada a meio,
# sem hashtags, link genérico). O robô já não erra assim desde 03/08/2026 — este
# botão arruma os que ficaram para trás.
#
# ⚠️ Por omissão faz ENSAIO: mostra o que mudaria e não envia nada. Só escreve no
# YouTube quando `aplicar` for "sim". A ordem certa é correr em ensaio, ler, e só
# então aplicar.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Escrever mesmo no YouTube? ("sim" aplica; qualquer outra coisa é só ensaio)'
        required: false
        default: 'nao'
      slug:
        description: 'Corrigir só um vídeo (ex.: acoes). Vazio = todos.'
        required: false
        default: ''

# Não escreve no repositório: só no YouTube, e só quando mandado.
permissions:
  contents: read

concurrency:
  group: youtube-corrigir-descricoes
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Corrigir descrições
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.aplicar }}" = "sim" ] && ARGS="$ARGS --aplicar"
          [ -n "${{ github.event.inputs.slug }}" ] && ARGS="$ARGS --slug=${{ github.event.inputs.slug }}"
          echo "argumentos: ${ARGS:-(ensaio, todos)}"
          node src/scripts/youtube/corrigir-descricoes.js $ARGS

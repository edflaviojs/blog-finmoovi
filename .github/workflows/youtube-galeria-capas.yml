name: YouTube — Galeria de CAPAS (para o dono ver e aprovar)

# GALERIA DAS 32 CAPAS (IMPLEMENTACAO20 §21.2, T1).
#
# Mostra CADA capa de abertura sozinha, com o nome da imagem, à duração real de
# 3,5 segundos e à mesma velocidade do vídeo — mais uma marca no ecrã em 1,2s, que
# é onde o momento-chave TEM de acontecer (regra 3 das 8 de composição). Se a queda
# vier depois da marca, aquela capa não prende ninguém no scroll.
#
# Existe pela mesma razão que a galeria das imagens: das 24 imagens desenhadas em
# 31/07, ONZE precisaram de correção só depois de VISTAS — e nenhuma dessas
# correções teria sido apanhada por teste automático.
#
# NÃO publica nada, NÃO commita nada, NÃO consome tema da fila. Só desenha e mostra.

on:
  workflow_dispatch:

jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências do render
        working-directory: youtube-render
        run: npm ci

      - name: Renderizar a galeria de capas
        working-directory: youtube-render
        run: npx remotion render src/index.ts Capas out/galeria-capas.mp4 --crf=18

      - name: Deixar o vídeo para download
        uses: actions/upload-artifact@v4
        with:
          name: galeria-capas
          path: youtube-render/out/galeria-capas.mp4
          retention-days: 14

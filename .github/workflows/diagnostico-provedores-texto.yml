name: Diagnostico - Provedores de texto

# SÓ À MÃO. Sem `schedule` de propósito: isto existe para responder a uma pergunta
# ("por que a Cerebras e o Groq devolvem resposta vazia?"), não para correr sozinho.
# Não escreve ficheiro nenhum, não commita e não toca em conteúdo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Medir os provedores
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: node src/scripts/diagnostico/provedores-de-texto.js

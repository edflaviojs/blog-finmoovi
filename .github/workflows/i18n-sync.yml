name: Sincronizar i18n (auto-corretor PT/EN/ES)

on:
  schedule:
    # Diário às 5h UTC (antes dos workflows de geração) — mantém a base sincronizada
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sincronizar-i18n:
    runs-on: ubuntu-latest
    # Teto duro (padrao do GitHub sem isto: 6h). Pico observado: 71 min.
    # DELIBERADAMENTE GENEROSO: sincronizar-i18n.js so commita no FINAL,
    # depois de traduzir TODAS as lacunas — matar no meio joga fora o
    # trabalho ja feito. 120 min protege contra o descontrole sem cortar
    # execucao legitima. Reavaliar para ~30 min depois da Fase 0 do
    # IMPLEMENTACAO24 (limite de lote), que e quem ataca a causa.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Install dependencies
        run: npm ci

      - name: Auto-sincronizar i18n (gera traduções faltantes + commita)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # --limit 5: PRIMEIRO workflow a adotar o teto de lote (IMPL24 Fase 0).
        # Os outros 16 que chamam este script seguem SEM a flag (comportamento
        # historico) ate este aqui ser observado por alguns dias. Escolhido
        # como cobaia por ser o unico que so sincroniza — nao gera conteudo — e
        # por nao ter passo de validacao separado que pudesse ficar vermelho
        # com as lacunas adiadas de proposito.
        run: node src/scripts/validacao/sincronizar-i18n.js --limit 5

      - name: Push changes
        run: |
          git pull --rebase origin main || true
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push
          else
            echo "No changes to push"
          fi

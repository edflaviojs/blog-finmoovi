name: YouTube — Oportunidade do dono (tema que fura a fila)

# ♦ 06/08/2026 — IMPL20 §60.
#
# O dono viu um tema que acha excelente e escreve-o na página /status. Este robô é o
# que recebe: põe o tema à CABEÇA da fila, com marca de prioridade, e o próximo vídeo
# a ser feito passa a ser esse. Depois a fila segue como estava.
#
# ⚠️ NÃO PRODUZ NADA E NÃO PUBLICA NADA. Só escreve numa fila e faz um commit. Quem
# produz continua a ser o robô de sempre, à hora de sempre — foi essa a escolha: um
# botão que dispara uma produção é um botão que gasta 36 minutos de máquina por engano.
#
# ⚠️ Também se pode disparar à mão aqui no GitHub, com os mesmos campos. É a rede por
# baixo, para o dia em que a página estiver em baixo.

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'A ideia, numa frase (obrigatório)'
        required: true
      titulo:
        description: 'O título exato (OBRIGATÓRIO para vídeo longo; no Short, deixe vazio que a IA escreve)'
        required: false
        default: ''
      formato:
        description: 'Onde entra'
        required: true
        type: choice
        options: [short, longo, ambos]
        default: short

permissions:
  contents: write

# MESMO grupo dos outros: todos commitam em .github/data.
concurrency:
  group: youtube-short-daily
  cancel-in-progress: false

jobs:
  registar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ⚠️ O tema vai por ficheiro e não na linha de comando: os temas trazem aspas,
      # dois pontos e acentos, e já houve neste projeto um comando partido ao meio por
      # causa de um espaço. Aqui passa por variável de ambiente, que o shell não parte.
      - name: Pôr o tema à cabeça da fila
        env:
          TEMA: ${{ github.event.inputs.tema }}
          TITULO: ${{ github.event.inputs.titulo }}
          FORMATO: ${{ github.event.inputs.formato }}
        run: node src/scripts/youtube/oportunidade.js --formato="$FORMATO" --tema="$TEMA" --titulo="$TITULO"

      - name: Guardar
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add .github/data/youtube-topics.json .github/data/youtube-longos.json
          if git diff --staged --quiet; then
            echo "Sem mudanças a commitar."
          else
            git commit -m "chore: oportunidade do dono — tema à cabeça da fila [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

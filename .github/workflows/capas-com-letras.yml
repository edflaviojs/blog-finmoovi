name: Capas — varrer (e refazer) as que têm letras ou estão borradas

# SÓ à mão, e por lotes pequenos.
#
# PARA QUE SERVE: as travas do guardiao-da-capa.js protegem as capas NOVAS. As que
# já estão no ar entraram antes de existir trava — incluindo as de 18 e 19/08/2026,
# em que uma capa saiu com o título do post desenhado por cima e outras saíram
# borradas. Este robô é a limpeza do passado.
#
# COMEÇAR SEMPRE POR RELATAR (regerar: false). O relatório não toca em nada e diz
# quantas capas estão reprovadas e quais. Só depois se manda refazer, em lotes,
# porque cada capa refeita é uma chamada paga na fila das imagens.
on:
  # ⚠️ 22:30 UTC = 19:30 no Brasil, 23:30 em Portugal. É DEPOIS do ciclo de
  # conteúdo do dia (os robôs de posts e glossário correm de manhã), de propósito:
  # a cota de IA é diária e partilhada, e publicar tem prioridade sobre limpar o
  # passado. Se a cota já estiver gasta, o script desiste sem tocar em nada e
  # continua amanhã de onde ficou — o inventário guarda o lugar.
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      regerar:
        description: 'Refazer as capas reprovadas? (false = só relatar)'
        type: boolean
        default: true
      max_correcoes:
        description: 'Quantas capas REFAZER por corrida (pedido do dono: 10)'
        type: string
        default: '10'
      max_medicoes:
        description: 'Quantas imagens MEDIR por corrida (protege a cota diária de IA)'
        type: string
        default: '40'
      desde:
        description: 'Medir só capas commitadas a partir desta data (AAAA-MM-DD). Vazio = TODAS'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    # A varredura mede centenas de imagens e cada regeneração espera pela API.
    # 25 min é o teto do GitHub que os outros robôs de imagem desta casa usam.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # `--desde` lê a data do último commit de cada imagem com `git log`, e
          # isso não funciona no clone raso que o checkout faz por omissão. Sem
          # isto a data vinha vazia e a varredura media o acervo TODO, gastando a
          # cota do dia. É o mesmo motivo pelo qual o regenerar-capas-glossario.yml
          # também pede o histórico completo.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Varrer as capas
        env:
          # Visão: é o que permite VER as letras. Sem isto só a nitidez é medida
          # e o relatório diz-lo em voz alta.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Geração: só usada quando `regerar` é true.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          # No agendamento não há `inputs`: usam-se os valores do dono (10 correcções,
          # 40 medições, acervo todo). À mão, o que o painel disser.
          CORR="${{ inputs.max_correcoes }}"; CORR="${CORR:-10}"
          MED="${{ inputs.max_medicoes }}";   MED="${MED:-40}"
          ARGS="--max-correcoes $CORR --max-medicoes $MED"
          if [ -n "${{ inputs.desde }}" ]; then ARGS="$ARGS --desde ${{ inputs.desde }}"; fi
          # Agendado = corrige. Só não corrige se for pedido à mão com regerar=false.
          if [ "${{ inputs.regerar }}" != "false" ]; then ARGS="$ARGS --regerar"; fi
          echo "Argumentos: $ARGS"
          node --import tsx src/scripts/manutencao/varrer-capas-com-letras.js $ARGS

      # Corre sempre, e não só quando refaz: mesmo em modo relatório o INVENTÁRIO
      # avança, e é ele que guarda o lugar para a corrida seguinte. Sem commitar o
      # inventário, cada dia remedia as mesmas primeiras imagens e o acervo nunca
      # é percorrido até ao fim.
      #
      # Continua a só commitar quando algum ficheiro mudou de facto: um commit
      # vazio faria o robô parecer que fez trabalho.
      - name: Commitar as capas refeitas e o inventário
        run: |
          git config user.name "FinMoovi Bot"
          git config user.email "bot@finmoovi.com"
          git add public/images src/content data/capas-auditadas.json || true
          if git diff --cached --quiet; then
            echo "Nada mudou — nem capa refeita, nem avanço no inventário."
            echo "Se isto acontecer todos os dias, a varredura está cega: ver o passo anterior."
            exit 0
          fi
          git commit -m "chore(capas): auditar e refazer capas com letras ou borradas [bot]"
          # Outros robôs commitam a toda a hora; rebase antes de empurrar.
          git pull --rebase origin main
          git push

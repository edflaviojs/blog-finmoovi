name: Keep Alive

on:
  schedule:
    # Every 50 days to prevent GitHub from disabling workflows
    - cron: '0 12 1,20 * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep workflows alive
        run: |
          echo "Workflows keep-alive ping: $(date -u)" >> .github/keep-alive.log
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"
          git add .github/keep-alive.log
          git commit -m "chore: keep-alive ping" || echo "No changes"
          # ⚠️ ESTE é o único que engole a falha de propósito: a única função do
          # keep-alive é tocar no repositório para o GitHub não adormecer os crons.
          # Um ping perdido não custa nada; derrubar o job por causa dele, sim.
          bash .github/scripts/empurrar.sh || echo "Nothing to push"

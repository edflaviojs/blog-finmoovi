name: "Fix i18n Content (Daily Batch)"

on:
  schedule:
    - cron: '30 8 * * 1-5'  # Weekdays at 8:30 UTC
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of files to fix per run'
        required: false
        default: '20'
      max_tentativas:
        description: 'Passagens pelo mesmo ficheiro antes de pedir humano'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fix-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure git
        run: |
          git config user.name "${{ vars.BOT_NAME || 'FinMoovi Bot' }}"
          git config user.email "${{ vars.BOT_EMAIL || 'bot@finmoovi.com' }}"

      - name: Install dependencies
        run: npm ci

      # Sem este passo a fila e montada contra uma foto velha. Medido em
      # 06/08/2026: audit-content-results.json tinha UM unico commit em toda a
      # historia e nenhum workflow o regenerava — 52 entradas mortas, 96
      # ficheiros do disco que nem la estavam (25 deles com defeito real), e
      # severidades que ja nao correspondiam ao conteudo. Correr a auditoria
      # antes e local, nao gasta chamada a IA, e leva ~2 segundos.
      - name: Medir o estado real antes de montar a fila
        run: node scripts/audit-content-i18n.js

      - name: Run content fix batch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '20' }}
          MAX_TENTATIVAS: ${{ inputs.max_tentativas || '3' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/fix-i18n-content-batch.js

      # Rede de seguranca. O proprio fix-i18n-content-batch.js ja aplica o
      # link-guard ao corpo devolvido pelo modelo; esta passagem apanha o que
      # escapar (regressao no script, link escrito no frontmatter, etc.).
      # REPARA em vez de reprovar: reprovar aqui perderia o trabalho de IA dos 20
      # ficheiros da tanda, e o objetivo e que NADA quebrado seja empurrado — nao
      # castigar a corrida. O `git add -A` do passo seguinte leva a reparacao.
      - name: Desfazer links internos inventados (link-guard)
        run: node src/scripts/validacao/link-guard.js --no-commit

      # ♦ 12/08/2026 — 🧾 O GUARDA DO CABEÇALHO, e nasceu de um defeito deste robô.
      #
      # Às 10:03 ele escreveu `by up to "00` numa `description` (era `R$ 1,000.00` e
      # devia ter ficado `$200`). Uma aspa solta parte o YAML — e a corrida acabou a
      # VERDE e empurrou. Quem começou a cair foram os OUTROS robôs: o gerador de ALT
      # falhou às 10:06 e às 11:47 com um erro do `js-yaml` que nem diz o nome do
      # ficheiro. **O defeito estava a um sítio de distância de onde doía.**
      #
      # ⚠️ E um cabeçalho que não lê parte a construção do site — e um build vermelho
      # faz o blog **parar de publicar em silêncio** (a lição de 06/08).
      #
      # ⚠️ REPARA EM VEZ DE REPROVAR, pela mesma razão escrita no passo de cima: o
      # ficheiro partido volta à versão do repositório e os outros dezanove seguem.
      # O `git add -A` do passo seguinte leva a reparação.
      - name: Desfazer cabeçalhos partidos (frontmatter-guard)
        run: node src/scripts/validacao/frontmatter-guard.js

      - name: Commit fixes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "fix(i18n): daily batch — adapt ${COUNT} files for international audience"
            bash .github/scripts/empurrar.sh
          fi

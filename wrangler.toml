name = "blog-finmoovi"
compatibility_date = "2024-01-01"

[site]
bucket = "./dist"

[build]
command = "npm run build"

# Mantido igual ao .node-version da raiz e ao node-version dos 53 workflows.
# O Node 20 saiu de suporte e NAO le TypeScript nativamente — scripts que
# importam site.config.ts (via scripts/lib/site.js) quebram nele.
[build.environment]
NODE_VERSION = "22"

# KV namespace for newsletter subscribers
# Create with: wrangler kv:namespace create NEWSLETTER_KV
# Then update the id below with the real namespace ID
[[kv_namespaces]]
binding = "NEWSLETTER_KV"
id = "b5ea6ea0f36c40a6a3ae264e3c717750"
preview_id = "b5ea6ea0f36c40a6a3ae264e3c717750"
